exportar_to_do_para_notificacao:
  alias: "\U0001F4DD Exportar To-Do para Notificação"
  description: 'Lê uma lista de tarefas do Home Assistant (`todo.*`) e gera um relatório
    formatado nas Notificações Persistentes.

    '
  mode: single
  fields:
    lista:
      name: Lista To-Do
      description: Selecione a entidade da lista de tarefas.
      selector:
        entity:
          domain: todo
      default: todo.lista_principal
  sequence:
  - variables:
      lista_entity: '{{ lista | default(''todo.lista_principal'') }}'
  - action: todo.get_items
    target:
      entity_id: '{{ lista_entity }}'
    data:
      status: needs_action
    response_variable: itens
  - action: persistent_notification.create
    data:
      title: "\U0001F4CB {{ state_attr(lista_entity, 'friendly_name') }}"
      message: "{%- set lista_obj = itens.get(lista_entity, {}) -%}\n{%- set arr =
        lista_obj.get('items', []) -%}\n{%- set ns = namespace(lines=[]) -%}\n\n{%-
        for item in arr -%}\n  {%- set summary = item.get('summary', 'Sem título')
        -%}\n  {# Como filtramos por needs_action, o status será sempre pendente,
        mas mantive a lógica caso mude o filtro #}\n  {%- set status = item.get('status',
        '') -%}\n  {%- set ns.lines = ns.lines + [\n    '▫️ ' ~ summary\n  ] -%}\n{%-
        endfor -%}\n\n{{ ns.lines | join('\\n') if ns.lines else '✅ Nenhuma tarefa
        pendente!' }}"
      notification_id: export_todo
enviar_notificacao_alexa:
  alias: "\U0001F5E3️ Enviar Notificação Alexa"
  description: "# \U0001F5E3️ Central de Notificações Alexa\n\nTTS e anúncios nos
    Echos.\n\n---\n\n### \U0001F9E0 Comportamento\n\n* **Padrão:** usa **Alexa Media
    Player**; se o `media_player` estiver `unavailable` ou `unknown`, usa **Alexa
    Devices** (nativo).\n* **`forcar_modo_nativo`:** opcional; se `true`, força só
    a integração nativa (útil para testes).\n\n---\n\n### \U0001F4DD Campos\n\n####
    \U0001F4CD dispositivos (opcional)\n* Nomes, lista ou `media_player.*` / `notify.*`.\n*
    **Padrão:** `['sala']`.\n\n#### \U0001F4AC mensagem (obrigatório)\n* Texto ou
    lista.\n\n#### ⚙️ tipo / volume\n* **tipo:** `tts` ou `announce`.\n* **volume:**
    0.0–1.0 (só Alexa Media).\n\n#### \U0001F6E0 forcar_modo_nativo (opcional)\n*
    `true` = só nativo.\n* omitido ou `false` = Media primeiro, nativo em fallback.\n\n---\n\n###
    \U0001F4A1 Exemplos\n\n1) Padrão:\n   dispositivos: cozinha\n   mensagem: \"Olá.\"\n\n2)
    Teste nativo:\n   dispositivos: cozinha\n   mensagem: \"Teste nativo.\"\n   forcar_modo_nativo:
    true\n\n---\n"
  icon: phu:alexa-logo
  mode: parallel
  max: 15
  fields:
    dispositivos:
      name: Dispositivos
      description: Nome(s) ('sala', 'cozinha', ...) ou entity_ids.
      example: '[''sala'', ''cozinha'']'
    mensagem:
      name: Mensagem
      description: String ou lista de strings a serem faladas/anunciadas.
      example: A máquina de lavar terminou o ciclo.
    tipo:
      name: Tipo
      description: '''tts'' (fala simples) ou ''announce'' (com som de notificação).'
      example: announce
    volume:
      name: Volume
      description: Só para Alexa Media (0.0–1.0). Ignorado na nativa.
      example: 0.8
    forcar_modo_nativo:
      name: Forçar modo nativo (teste)
      description: Se ligado, envia apenas pela integração nativa (Alexa Devices),
        ignorando Alexa Media nesta execução. Por omissão usa Alexa Media e cai para
        nativo se o media_player estiver indisponível.
      default: false
      selector:
        boolean: {}
  sequence:
  - variables:
      forcar_nativa: '{{ forcar_modo_nativo | default(false) | bool }}'
      mapa_dispositivos:
        escritorio: media_player.escritorio_echo_mediaplayer
        banheiro_social: media_player.banheiro_social_echo_mediaplayer
        sala: media_player.sala_de_tv_echo_mediaplayer
        sala_de_tv: media_player.sala_de_tv_echo_mediaplayer
        cozinha: media_player.cozinha_echo_mediaplayer
        oficina: media_player.oficina_echo_mediaplayer
        banheiro_suite: media_player.banheiro_suite_echo_mediaplayer
        quarto_da_cecilia: media_player.quarto_cecilia_echo_mediaplayer
        brinquedoteca: media_player.brinquedoteca_echo_mediaplayer
        suite: media_player.suite_echo_mediaplayer
        quarto_cecilia: media_player.quarto_cecilia_echo_mediaplayer
        fire_tv_sala: media_player.sala_de_tv_fire_tv_stick_mediaplayer
        fire_tv_suite_4k: media_player.suite_fire_tv_stick_4k_max_mediaplayer
        fire_tv_suite_lite: media_player.suite_fire_tv_stick_4k_max_mediaplayer
        media_player.echo_dot_sala_de_tv: media_player.sala_de_tv_echo_mediaplayer
        media_player.echo_dot_cozinha: media_player.cozinha_echo_mediaplayer
        media_player.echo_dot_escritorio: media_player.escritorio_echo_mediaplayer
        media_player.echo_dot_oficina: media_player.oficina_echo_mediaplayer
        media_player.echo_dot_banheiro_social: media_player.banheiro_social_echo_mediaplayer
        media_player.echo_dot_banheiro_suite: media_player.banheiro_suite_echo_mediaplayer
        media_player.echo_dot_cecilia: media_player.quarto_cecilia_echo_mediaplayer
        media_player.echo_dot_brinquedoteca: media_player.brinquedoteca_echo_mediaplayer
        media_player.echo_dot_suite: media_player.suite_echo_mediaplayer
        media_player.firestick_sala_de_tv: media_player.sala_de_tv_fire_tv_stick_mediaplayer
        media_player.antonio_s_fire_tv: media_player.suite_fire_tv_stick_4k_max_mediaplayer
        media_player.firestick_suite: media_player.suite_fire_tv_stick_4k_max_mediaplayer
        sala_de_jantar: media_player.sala_de_jantar_echo_mediaplayer
        jantar: media_player.sala_de_jantar_echo_mediaplayer
        media_player.echo_show_11_de_antonio: media_player.sala_de_jantar_echo_mediaplayer
        media_player.sala_de_jantar_echo_mediaplayer: media_player.sala_de_jantar_echo_mediaplayer
        media_player.sala_de_jantar_echo_devices: media_player.sala_de_jantar_echo_devices
        notify.sala_de_jantar_echo_devices_falar: media_player.sala_de_jantar_echo_devices
        notify.sala_de_jantar_echo_devices_anunciar: media_player.sala_de_jantar_echo_devices
        media_player.echo_show_11: media_player.sala_de_jantar_echo_devices
      sinonimos:
        sala_tv: sala_de_tv
        sala_da_tv: sala_de_tv
        saladetv: sala_de_tv
        salada_tv: sala_de_tv
        sala_de_televisao: sala_de_tv
        sala_televisao: sala_de_tv
        sala_teve: sala_de_tv
        quarto_cecilia: quarto_da_cecilia
        echo_dot_cecilia: quarto_da_cecilia
        sala_de_tv_echo: sala_de_tv
        cozinha_echo: cozinha
        escritorio_echo: escritorio
        oficina_echo: oficina
        banheiro_social_echo: banheiro_social
        banheiro_suite_echo: banheiro_suite
        quarto_cecilia_echo: quarto_da_cecilia
        brinquedoteca_echo: brinquedoteca
        suite_echo: suite
        echo_dot_escritorio: escritorio
        echo_dot_banheiro_social: banheiro_social
        echo_dot_sala: sala
        echo_dot_sala_de_tv: sala_de_tv
        echo_dot_cozinha: cozinha
        echo_dot_oficina: oficina
        echo_dot_banheiro_suite: banheiro_suite
        echo_dot_quarto_da_cecilia: quarto_da_cecilia
        echo_dot_brinquedoteca: brinquedoteca
        echo_dot_suite: suite
        jantar: sala_de_jantar
        sala_jantar: sala_de_jantar
        echo_show_11_de_antonio: sala_de_jantar
        echo_show_sala_de_jantar: sala_de_jantar
        sala_de_jantar_echo_show_dispositivos: sala_de_jantar
        sala_de_jantar_echo_show_media_player: sala_de_jantar
        echo_show_11: sala_de_jantar
        cozinha_echo_dot_dispositivos: cozinha
        sala_de_tv_echo_dot_dispositivos: sala_de_tv
        brinquedoteca_echo_dot_dispositivos: brinquedoteca
        escritorio_echo_dot_dispositivos: escritorio
        oficina_echo_dot_dispositivos: oficina
        suite_echo_dot_dispositivos: suite
        banheiro_suite_echo_dot_dispositivos: banheiro_suite
        banheiro_social_echo_dot_dispositivos: banheiro_social
        quarto_cecilia_echo_dot_dispositivos: quarto_cecilia
        cozinha_echo_dot_media_player: cozinha
        sala_de_tv_echo_dot_media_player: sala_de_tv
        brinquedoteca_echo_dot_media_player: brinquedoteca
        escritorio_echo_dot_media_player: escritorio
        oficina_echo_dot_media_player: oficina
        suite_echo_dot_media_player: suite
        banheiro_suite_echo_dot_media_player: banheiro_suite
        banheiro_social_echo_dot_media_player: banheiro_social
        quarto_cecilia_echo_dot_media_player: quarto_cecilia
      lista_dispositivos: "{% set raw = dispositivos | default(['sala']) %}\n{% if
        raw is string %}\n  {{ [raw | trim] }}\n{% else %}\n  {{ raw | map('string')
        | map('trim') | reject('equalto','') | list }}\n{% endif %}"
      tipo_final: '{{ (tipo | default(''tts'')) | lower }}'
      notify_suffix: '{{ ''_anunciar'' if tipo_final == ''announce'' else ''_falar''
        }}'
      vol_final: "{% set v = volume | default(none) %}  {% if v is number and 0 <=
        v <= 1 %}\n  {{ v }}\n{% else %}\n  {{ none }}\n{% endif %}"
      alvos_finais: "{% set ns = namespace(mp=[], notify=[]) %} {% for n in lista_dispositivos
        %}\n  {% set s = (n | string | trim) %}\n  {% set s_l = s | lower %}\n\n  {%
        if s_l | regex_match('^(media_player|notify)\\\\..+') %}\n    {% set k = s_l
        %}\n  {% else %}\n    {% set k0 = s | slugify %}\n    {% set k = sinonimos[k0]
        if k0 in sinonimos else k0 %}\n  {% endif %}\n\n  {% set m = mapa_dispositivos[k]
        if k in mapa_dispositivos else none %}\n  {% set e_mp = m if m else (s_l if
        s_l.startswith('media_player.') else none) %}\n  {% if not e_mp and s_l.startswith('notify.')
        %}\n    {% set nslug = s_l | regex_replace('^notify\\\\.', '') | regex_replace('(?:_devices)?_(anunciar|falar|announce|speak)$',
        '') %}\n    {% set mp_slug = nslug | regex_replace('_devices$', '_mediaplayer')
        %}\n    {% set e_mp = 'media_player.' + mp_slug %}\n  {% endif %}\n  \n  {%
        set base_notif = none %}\n  {% if m %}\n    {% set base_notif = 'notify.'
        + (m.split('.',1)[1] | regex_replace('_mediaplayer$', '_devices')) %}\n  {%
        elif s_l.startswith('media_player.') %}\n    {% set base_notif = 'notify.'
        + (s_l.split('.',1)[1] | regex_replace('_mediaplayer$', '_devices')) %}\n
        \ {% elif s_l.startswith('notify.') %}\n    {% set base_notif = (s_l | regex_replace('(?:_devices)?_(anunciar|falar|announce|speak)$',
        '')) %}\n  {% endif %}\n  {% set e_notif = (base_notif ~ notify_suffix) if
        base_notif else none %}\n\n  {% if forcar_nativa %}\n    {% if e_notif %}\n
        \     {% set ns.notify = ns.notify + [e_notif] %}\n    {% endif %}\n  {% else
        %}\n    {% if e_mp and states(e_mp) not in ['unavailable', 'unknown'] %}\n
        \     {% set ns.mp = ns.mp + [e_mp] %}\n    {% elif e_notif %}\n      {% set
        ns.notify = ns.notify + [e_notif] %}\n    {% endif %}\n  {% endif %}\n{% endfor
        %} {{ {'mp': ns.mp | unique | list, 'notify': ns.notify | unique | list} }}"
      final_mp: '{{ alvos_finais.mp }}'
      final_notify: '{{ alvos_finais.notify }}'
      lista_mensagens: "{% set raw = mensagem | default('') %}\n{% if raw is string
        %}\n  {{ [raw] }}\n{% else %}\n  {{ raw | list }}\n{% endif %}"
      prev_vols: "{% set ns = namespace(lst=[]) %}\n{% for e in final_mp %}\n  {%
        set v = state_attr(e, 'volume_level') | default(none, true) %}\n  {% if v
        is number and (vol_final is number) and (v != vol_final) %}\n    {% set ns.lst
        = ns.lst + [ {'entity_id': e, 'vol': v} ] %}\n  {% endif %}\n{% endfor %}\n{{
        ns.lst }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (final_mp | length == 0) and (final_notify | length ==
          0) }}'
      sequence:
      - action: system_log.write
        data:
          level: warning
          message: 'script.enviar_notificacao_alexa: nenhum destino válido resolvido
            a partir de {{ dispositivos }}

            '
      - stop: Sem destinos válidos
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (final_mp | length > 0) and (vol_final is number) }}'
      sequence:
      - repeat:
          for_each: '{{ final_mp }}'
          sequence:
          - action: media_player.volume_set
            target:
              entity_id: '{{ repeat.item }}'
            data:
              volume_level: '{{ vol_final }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ final_notify | length > 0 }}'
      sequence:
      - repeat:
          for_each: '{{ final_notify }}'
          sequence:
          - action: notify.send_message
            target:
              entity_id: '{{ repeat.item }}'
            data:
              message: "{% if tipo_final == 'announce' %}\n  {{ lista_mensagens |
                join('\\n') }}\n{% else %}\n  {{ lista_mensagens | join(' ') }}\n{%
                endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (final_mp | length > 0) and (tipo_final == ''announce'')
          }}'
      sequence:
      - action: notify.alexa_media
        data:
          target: '{{ final_mp }}'
          message: '{{ lista_mensagens | join(''

            '') }}'
          data:
            type: announce
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (final_mp | length > 0) and (tipo_final == ''tts'') }}'
      sequence:
      - action: notify.alexa_media
        data:
          target: '{{ final_mp }}'
          message: '{{ lista_mensagens | join('' '') }}'
          data:
            type: tts
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (prev_vols | length) > 0 }}'
      sequence:
      - delay:
          seconds: '{% set texto_completo = lista_mensagens | join('' '') %} {% set
            total_chars = texto_completo | length %} {% set tempo_estimado = (total_chars
            / 10) | round(0, ''ceil'') | int %} {{ [ [ tempo_estimado, 5 ] | max,
            30 ] | min }}

            '
      - repeat:
          for_each: '{{ prev_vols }}'
          sequence:
          - action: media_player.volume_set
            target:
              entity_id: '{{ repeat.item.entity_id }}'
            data:
              volume_level: '{{ repeat.item.vol }}'
enviar_notificacao_app:
  alias: "\U0001F4F1 Enviar Notificação App"
  description: "# \U0001F4F1 Central de Notificações Mobile (App)\n\nScript avançado
    para enviar notificações nativas para os celulares com o App do Home Assistant.\n\n---\n\n###
    ✨ DESTAQUES\n* \U0001F3AF **Envio Flexível:** Aceita nomes (`antonio`), listas,
    CSV (`\"antonio, renata\"`) ou serviços diretos (`notify.mobile_app_...`).\n*
    \U0001F4E2 **Broadcast:** Se não informar destinatário, envia para **TODOS** os
    usuários cadastrados.\n* \U0001F680 **Poder Total:** Suporte completo a ações,
    ícones, cores, tags e canais Android/iOS.\n\n---\n\n### \U0001F4DD CAMPOS\n\n####
    \U0001F465 destinatarios (Opcional)\n* **Aceita:** Nome, Lista, CSV ou serviço
    `notify.*`.\n* **Padrão:** Se omitido/vazio, envia para **TODOS** (Broadcast).\n\n####
    \U0001F4AC Conteúdo\n* **mensagem:** Texto principal (aceita string ou lista de
    frases).\n* **titulo:** Cabeçalho da notificação.\n* **dados:** (Avançado) Dicionário
    para recursos extras (Ações, Ícones, Tags, Cores, TTL, Canais).\n\n---\n\n###
    \U0001F4A1 EXEMPLOS\n\n1)  **Simples (Por Nome):**\n    destinatarios: antonio\n
    \   mensagem: \"Teste\"\n   \n2) **Grupos (Por Nome):**\n    destinatarios: \"antonio,
    renata\"\n    mensagem: \"Portão aberto\"\n    titulo: \"Alerta\"\n\n3)  **Broadcast
    (Para Todos):**\n    mensagem: \"Tenha um bom dia\"\n    titulo: \"Bom dia!\"\n\n4)
    \ **Avançado (Ações e Ícones):**\n   destinatarios: antonio\n   titulo: \"Alerta\"\n
    \  mensagem: \"Portão aberto.\"\n   dados:\n     tag: \"portao\"\n     channel:
    \"Alarme\"\n     importance: high\n     notification_icon: \"mdi:gate\"\n     color:
    \"#FF0000\"\n     actions:\n       - action: \"FECHAR_PORTAO\"\n         title:
    \"Fechar\"\n\n         \n---\n"
  icon: mdi:cellphone-message
  mode: parallel
  max: 5
  fields:
    destinatarios:
      description: 'Nome, lista de nomes, string CSV ("Antonio, Renata"), string lista
        ("[''Antonio'',''Renata'']" ou ''["Antonio","Renata"]''), ou notify.* direto.
        Vazio = todos do mapa.

        '
      example: Antonio, Renata
    mensagem:
      description: Mensagem a ser enviada (string ou lista).
      example: A máquina de lavar terminou.
    titulo:
      description: (Opcional) Título da notificação.
      example: Casa
    dados:
      description: (Opcional) Dicionário extra para o notify (data/push/actions etc).
      example: '{ push: { sound: default } }'
  sequence:
  - variables:
      mapa_destinatarios:
        antonio: notify.edge_antonio
        renata: notify.edge_renata
      sinonimos:
        antonio_motorola: antonio
        antonio_celular: antonio
        celular_antonio: antonio
        edge_antonio: antonio
        renata_motorola: renata
        renata_celular: renata
        celular_renata: renata
        edge_renata: renata
        mobile_app_edge_antonio: antonio
        mobile_app_edge_renata: renata
      itens_destinatarios: "{% set raw = destinatarios | default([]) %}\n\n{% if raw
        is not string %}\n  {{ raw | map('string') | map('trim') | reject('equalto','')
        | list }}\n{% else %}\n  {% set s = raw | trim %}\n\n  {% if s == '' %}\n
        \   {{ [] }}\n\n  {# JSON: [\"Antonio\",\"Renata\"] #}\n  {% elif s | regex_match('^\\\\s*\\|$.*\\$|\\\\s*$')
        and ('\"' in s) %}\n    {{ s | from_json | map('string') | map('trim') | reject('equalto','')
        | list }}\n\n  {# \"Lista\" com aspas simples: ['Antonio','Renata'] (heurística)
        #}\n  {% elif s | regex_match(\"^\\\\s*\\|$.*\\$|\\\\s*$\") and (\"'\" in
        s) %}\n    {% set s_json = s | replace(\"'\", '\"') %}\n    {{ s_json | from_json
        | map('string') | map('trim') | reject('equalto','') | list }}\n\n  {# Fallback
        CSV: Antonio, Renata #}\n  {% else %}\n    {{ s.split(',') | map('trim') |
        reject('equalto','') | list }}\n  {% endif %}\n{% endif %}"
      alvos: "{% set base = itens_destinatarios %}\n{% set itens = (mapa_destinatarios.keys()
        | list) if (base | length == 0) else base %}\n{% set ns = namespace(out=[])
        %}\n\n{% for item in itens %}\n  {% set s = (item | string | trim) %}\n  {%
        set s_l = s | lower %}\n\n  {% if s_l | regex_match('^notify\\\\..+') %}\n
        \   {% set ns.out = ns.out + [s_l] %}\n  {% else %}\n    {% set k0 = s | slugify
        %}\n    {% set k = sinonimos[k0] if k0 in sinonimos else k0 %}\n    {% if
        k in mapa_destinatarios %}\n      {% set ns.out = ns.out + [ mapa_destinatarios[k]
        ] %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n\n{{ ns.out | unique |
        list }}"
      msg: "{% if mensagem is string %}\n  {{ mensagem }}\n{% else %}\n  {{ mensagem
        | list | join(' ') }}\n{% endif %}"
      titulo_final: '{{ titulo | default('''') }}'
      dados_final: '{{ dados if dados is mapping else omit }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (alvos | length) == 0 }}'
      sequence:
      - action: system_log.write
        data:
          level: warning
          message: 'script.enviar_notificacao_app: nenhum destinatário válido resolvido
            a partir de {{ destinatarios }}

            '
      - stop: Sem destinatários válidos
    - conditions:
      - condition: template
        value_template: '{{ (msg | length) == 0 }}'
      sequence:
      - stop: Sem mensagem
  - repeat:
      for_each: '{{ alvos }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ repeat.item == ''notify.edge_antonio'' }}'
          sequence:
          - action: notify.mobile_app_edge_antonio
            data:
              message: '{{ msg }}'
              title: '{{ titulo_final if (titulo_final | length > 0) else omit }}'
              data: '{{ dados if dados is mapping else {} }}'
        - conditions:
          - condition: template
            value_template: '{{ repeat.item == ''notify.edge_renata'' }}'
          sequence:
          - action: notify.mobile_app_edge_renata
            data:
              message: '{{ msg }}'
              title: '{{ titulo_final if (titulo_final | length > 0) else omit }}'
              data: '{{ dados if dados is mapping else {} }}'
        default:
        - action: system_log.write
          data:
            level: warning
            message: 'script.enviar_notificacao_app: alvo desconhecido {{ repeat.item
              }}'
alarme_loop_de_alertas_telegram:
  alias: "\U0001F6A8 Alarme — Loop de Alertas (Telegram + App)"
  mode: restart
  icon: mdi:alarm-light
  description: "# \U0001F6A8 Loop de Alerta Crítico (Telegram & App)\n\nEnvia notificações
    repetidas para Telegram e Celulares enquanto o alarme estiver disparado.\nPara
    se o alarme for desarmado OU se o `input_boolean.casa_alarme_alerta_silenciado`
    for ligado.\n"
  sequence:
  - variables:
      alarme: alarm_control_panel.alarme_hikvision_axpro
      intervalo_alerta_seg: 20
      teclado_telegram: "\U0001F515 Silenciar Alertas:/alarme_silenciar, \U0001F513
        Desativar Alarme:/alarme_desativar"
      acoes_app:
      - action: ALARME_SILENCIAR
        title: "\U0001F515 Silenciar Alertas"
      - action: ALARME_DESATIVAR
        title: "\U0001F513 Desativar Alarme"
  - repeat:
      while:
      - condition: template
        value_template: '{{ is_state(alarme, ''triggered'') }}'
      - condition: state
        entity_id: input_boolean.casa_alarme_alerta_silenciado
        state: 'off'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios:
          - antonio
          - renata
          parse_mode: MarkdownV2
          titulo: "\U0001F6A8 Alarme Disparado!"
          mensagem: "⚠️ **Atenção!** O sistema detectou uma intrusão.\n\n\U0001F552
            **Hora:** {{ now().strftime('%H:%M:%S') }}\n\U0001F4C5 **Data:** {{ now().strftime('%d/%m/%Y')
            }}\n\nVerifique as câmeras imediatamente.\n"
          inline_keyboard: '{{ teclado_telegram }}'
      - action: script.enviar_notificacao_app
        data:
          destinatarios:
          - antonio
          - renata
          titulo: "\U0001F6A8 Alarme Disparado!"
          mensagem: ⚠️ Intrusão detectada! Verifique as câmeras.
          dados:
            tag: alarme_disparado
            importance: high
            priority: high
            ttl: 0
            color: '#FF0000'
            notification_icon: mdi:shield-alert
            actions: '{{ acoes_app }}'
      - delay:
          seconds: '{{ intervalo_alerta_seg }}'
enviar_notificacao_telegram:
  alias: "\U0001F4E8 Enviar Notificação Telegram"
  description: "# \U0001F4E8 Central de Notificações Telegram\n\n  Script universal
    para envio de mensagens, fotos e vídeos com tratamento automático de caracteres
    especiais.\n\n---\n\n### ✨ DESTAQUES\n* \U0001F6E1️ **Blindado:** Escape automático
    de caracteres para MarkdownV2.\n* \U0001F4F8 **Câmeras:** Grava clipe, extrai
    frame e envia foto automaticamente.\n* \U0001F465 **Multi-usuário:** Envia para
    `antonio`, `renata` ou listas.\n\n---\n\n### \U0001F4DD CAMPOS E DETALHES TÉCNICOS\n\n####
    \U0001F465 destinatarios (Opcional)\n* **Aceita:** Nome único (`antonio`) ou lista
    (`['antonio', 'renata']`).\n* **Comportamento:** Normaliza para minúsculo. Se
    um nome não existir no mapa, o script **LOGA ERRO e PARA** (segurança).\n* **Padrão:**
    `['antonio']` (se omitido).\n\n#### \U0001F4AC Conteúdo\n* **titulo:** Cabeçalho
    em destaque. (MarkdownV2: vira negrito `*...*`; HTML: vira `<b>...</b>`).\n* **mensagem:**
    O texto principal. Se `parse_mode: MarkdownV2`, sofre escape automático.\n* **caption:**
    Legenda da foto. Se omitido, usa a `mensagem`.\n\n#### ⚙️ Configurações\n* **cameras:**
    ID da câmera (ex: `camera.camera_garagem_hd_stream`) ou lista. Gera clipe + foto.\n*
    **parse_mode:** `MarkdownV2` (Recomendado/Padrão) ou `HTML`.\n\n---\n\n### \U0001F4A1
    EXEMPLOS DE USO\n\n ---\n\n1) **Texto simples para Antonio:**\n   destinatarios:
    antonio\n   mensagem: \"Movimento detectado na garagem.\"\n   parse_mode: MarkdownV2\n\n2)
    **Texto com título para dois destinatários:**\n   destinatarios: [\"antonio\",\"renata\"]\n
    \  titulo: \"\U0001F6A8 Alerta Crítico\"\n   mensagem: \"Portão aberto.\"\n   parse_mode:
    MarkdownV2\n\n3) **Texto + foto (frame) de uma câmera:**\n   destinatarios: renata\n
    \  mensagem: \"Alguém na entrada.\"\n   cameras: camera.camera_garagem_hd_stream\n
    \  caption: \"Entrada agora\"\n   parse_mode: MarkdownV2\n\n---\n"
  icon: phu:telegram
  mode: queued
  max: 10
  fields:
    destinatarios:
      description: 'Nome ou lista de nomes para notificar (ex: ''antonio'' ou [''antonio'',''renata'']).'
      example: '[''Antonio'', ''Renata'']'
    titulo:
      description: (Opcional) Título da notificação; se definido, vai acima da mensagem.
      example: Alerta
    mensagem:
      description: Mensagem de texto a ser enviada.
      example: Movimento detectado na garagem.
    cameras:
      description: (Opcional) ID de uma ou mais câmeras para capturar um frame de
        clipe.
      example: camera.camera_garagem_hd_stream
    caption:
      description: (Opcional) Legenda para a imagem. Se não definida, usa a mensagem
        principal.
      example: Olha o que eu vi!
    parse_mode:
      description: 'Formato da mensagem: ''MarkdownV2'' ou ''HTML''. Escape automático
        para MarkdownV2.'
      example: MarkdownV2
    inline_keyboard:
      description: "(Opcional) Teclado inline do Telegram (lista de linhas). Exemplo
        de uso na automação: inline_keyboard:\n  - - \"Ativar dia de faxina:/faxina_on\""
      example: Ativar dia de faxina:/faxina_on
  sequence:
  - variables:
      mapa_destinatarios:
        antonio: '664449565'
        renata: '1071303595'
      nomes: "{% set nomes_raw = destinatarios | default(['antonio']) %} {% if nomes_raw
        is string %}\n  {{ [nomes_raw | lower] }}\n{% else %}\n  {{ nomes_raw | map('lower')
        | list }}\n{% endif %}"
      nomes_invalidos: "{% set ns = namespace(list=[]) %} {% for nome in nomes %}\n
        \ {% if nome not in mapa_destinatarios %}\n    {% set ns.list = ns.list +
        [nome] %}\n  {% endif %}\n{% endfor %} {{ ns.list }}"
      alvos: "{% set ns = namespace(list=[]) %} {% for nome in nomes %}\n  {% if nome
        in mapa_destinatarios %}\n    {% set ns.list = ns.list + [ mapa_destinatarios[nome]
        ] %}\n  {% endif %}\n{% endfor %} {{ ns.list | unique | list }}"
      lista_cameras: "{% if cameras is defined %}\n  {% if cameras is string %}\n
        \   {{ [cameras] }}\n  {% else %}\n    {{ cameras }}\n  {% endif %}\n{% else
        %}\n  {{ [] }}\n{% endif %}"
      effective_parse_mode: "{% set pm = parse_mode | default('') | lower %}\n{% if
        pm == 'markdownv2' %}\n  markdownv2\n{% elif pm == 'html' %}\n  HTML\n{% else
        %}\n  {{ '' }}\n{% endif %}"
      titulo_raw: '{{ titulo | default('''') }}'
      mensagem_raw: '{{ mensagem | default('''') }}'
      titulo_esc: "{% set t = titulo_raw %} {% if effective_parse_mode == 'markdownv2'
        and t | length > 0 %}\n  {% set special_chars = ['\\\\', '_', '*', '[', ']',
        '(', ')', '~', '`', '>', '#', '+', '-', '=', '|', '{', '}', '.', '!'] %}\n
        \ {% set ns = namespace(saida=[]) %}\n  {% for char in t %}\n    {% if char
        in special_chars %}\n      {% set ns.saida = ns.saida + ['\\\\', char] %}\n
        \   {% else %}\n      {% set ns.saida = ns.saida + [char] %}\n    {% endif
        %}\n  {% endfor %}\n  {{ ns.saida | join('') }}\n{% else %}\n  {{ t }}\n{%
        endif %}"
      mensagem_esc: "{% set m = mensagem_raw %} {% if effective_parse_mode == 'markdownv2'
        and m | length > 0 %}\n  {% set special_chars = ['\\\\', '_', '[', ']', '(',
        ')', '~', '`', '>', '#', '+', '-', '=', '|', '{', '}', '.', '!'] %}\n  {%
        set ns = namespace(saida=[]) %}\n  {% for char in m %}\n    {% if char in
        special_chars %}\n      {% set ns.saida = ns.saida + ['\\\\', char] %}\n    {%
        else %}\n      {% set ns.saida = ns.saida + [char] %}\n    {% endif %}\n  {%
        endfor %}\n  {{ ns.saida | join('') }}\n{% else %}\n  {{ m }}\n{% endif %}"
      mensagem_texto: "{% if titulo_esc | length > 0 %}\n  {% if effective_parse_mode
        == 'html' %}\n    <b>{{ titulo_esc }}</b>\n    {{ '' }}\n    {{ mensagem_esc
        }}\n  {% elif effective_parse_mode == 'markdownv2' %}\n    *{{ titulo_esc
        }}*\n    {{ '' }}\n    {{ mensagem_esc }}\n  {% else %}\n    {{ titulo_esc
        }}\n    {{ '' }}\n    {{ mensagem_esc }}\n  {% endif %}\n{% else %}\n  {{
        mensagem_esc }}\n{% endif %}"
      caption_texto: "{% if caption is defined and caption | length > 0 %}\n  {% set
        c = caption %}\n  {% if effective_parse_mode == 'markdownv2' %}\n    {% set
        special_chars = ['\\\\', '_', '[', ']', '(', ')', '~', '`', '>', '#', '+',
        '-', '=', '|', '{', '}', '.', '!'] %}\n    {% set ns = namespace(saida=[])
        %}\n    {% for char in c %}\n      {% if char in special_chars %}\n        {%
        set ns.saida = ns.saida + ['\\\\', char] %}\n      {% else %}\n        {%
        set ns.saida = ns.saida + [char] %}\n      {% endif %}\n    {% endfor %}\n
        \   {{ ns.saida | join('') }}\n  {% else %}\n    {{ c }}\n  {% endif %}\n{%
        else %}\n  {{ mensagem_esc }}\n{% endif %}"
      inline_keyboard_eff: '{{ inline_keyboard if inline_keyboard is defined else
        [] }}'
  - if:
    - condition: template
      value_template: '{{ nomes_invalidos | count > 0 }}'
    then:
    - action: system_log.write
      data:
        level: error
        message: 'Enviar Notificação Telegram: destinatario(s) invalido(s)={{ nomes_invalidos
          }}; destinatarios={{ destinatarios }}; nomes={{ nomes }}; mapa={{ mapa_destinatarios
          }}.'
    - stop: 'Destinatário inválido: {{ nomes_invalidos }}'
  - if:
    - condition: template
      value_template: '{{ alvos | count == 0 }}'
    then:
    - action: system_log.write
      data:
        level: error
        message: 'Enviar Notificação Telegram: alvos vazios. destinatarios={{ destinatarios
          }}; nomes={{ nomes }}; mapa={{ mapa_destinatarios }}; alvos={{ alvos }}.'
    - stop: Alvos vazios (nenhum destinatário válido).
  - if:
    - condition: template
      value_template: '{{ mensagem_texto | trim | length > 0 }}'
    then:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ effective_parse_mode != '''' }}'
        sequence:
        - action: telegram_bot.send_message
          data:
            chat_id: '{{ alvos }}'
            message: '{{ mensagem_texto }}'
            parse_mode: '{{ effective_parse_mode }}'
            inline_keyboard: '{{ inline_keyboard_eff }}'
      default:
      - action: telegram_bot.send_message
        data:
          chat_id: '{{ alvos }}'
          message: '{{ mensagem_texto }}'
          inline_keyboard: '{{ inline_keyboard_eff }}'
  - if:
    - condition: template
      value_template: '{{ lista_cameras | count > 0 }}'
    then:
    - repeat:
        for_each: '{{ lista_cameras }}'
        sequence:
        - variables:
            cam_id: '{{ repeat.item }}'
            stamp: '{{ now().strftime(''%Y%m%d_%H%M%S_%f'') }}'
            clip: /config/www/tmp/{{ cam_id.split('.')[-1] }}_{{ stamp }}.mp4
            caminho_foto: /config/www/capturas/{{ cam_id.split('.')[-1] }}_{{ stamp
              }}.jpg
        - action: camera.record
          data:
            entity_id: '{{ cam_id }}'
            filename: '{{ clip }}'
            duration: 2
        - action: shell_command.frame_from_clip
          data:
            src: '{{ clip }}'
            dst: '{{ caminho_foto }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ effective_parse_mode != '''' }}'
            sequence:
            - action: telegram_bot.send_photo
              data:
                chat_id: '{{ alvos }}'
                file: '{{ caminho_foto }}'
                caption: '{{ caption_texto }}'
                parse_mode: '{{ effective_parse_mode }}'
                inline_keyboard: '{{ inline_keyboard_eff }}'
          default:
          - action: telegram_bot.send_photo
            data:
              chat_id: '{{ alvos }}'
              file: '{{ caminho_foto }}'
              caption: '{{ caption_texto }}'
              inline_keyboard: '{{ inline_keyboard_eff }}'
alarme_piscar_cabeceira_vermelho:
  alias: "\U0001F6A8 Alarme — Piscar Cabeceiras (vermelho)"
  description: 'Pisca as cabeceiras em vermelho enquanto a condição do loop for verdadeira,
    e restaura o estado ao final.

    '
  mode: restart
  sequence:
  - action: scene.create
    data:
      scene_id: pre_alarme_cabeceiras
      snapshot_entities:
      - light.suite_cabeceira_antonio_localtuya
      - light.suite_cabeceira_renata_localtuya
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.alarme_hikvision_axpro
        state: triggered
      - condition: state
        entity_id: input_boolean.casa_alarme_alerta_silenciado
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.suite_cabeceira_antonio_localtuya
          - light.suite_cabeceira_renata_localtuya
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness_pct: 100
      - delay: 00:00:01
      - action: light.turn_off
        target:
          entity_id:
          - light.suite_cabeceira_antonio_localtuya
          - light.suite_cabeceira_renata_localtuya
      - delay: 00:00:02
  - action: scene.turn_on
    target:
      entity_id: scene.pre_alarme_cabeceiras
contar_garrafa_de_agua_com_gas_e_anunciar:
