alexa_actionable_notification:
  alias: "\U0001F5E3️ Alexa Actionable Notification"
  description: Activates an actionable notification on a specific echo device. Aceita
    nome amigável (sala, cozinha, …), entity_id antigo ou media_player atual — resolvido
    como script.enviar_notificacao_alexa.
  icon: phu:alexa-logo
  mode: single
  fields:
    text:
      description: The text you would like alexa to speak.
      example: What would you like the thermostat set to?
    event_id:
      description: Correlation ID for event responses
      example: ask_for_temperature
    alexa_device:
      description: Nome amigável (sala, cozinha, …) ou media_player entity_id
      example: sala
    suppress_confirmation:
      description: Set true if you want to suppress 'okay' confirmation
      example: 'true'
    alexa_devices:
      name: Echos (lista)
      description: Opcional. Vários nomes amigáveis; grava o input_text uma vez e
        dispara a skill em todos.
      example: '[''sala'', ''cozinha'', ''brinquedoteca'']'
      selector:
        object: {}
  sequence:
  - variables:
      lista_dispositivos: "{% set raw = alexa_devices | default(none) %}\n{% if raw
        is not none and raw != '' %}\n  {% if raw is string %}\n    {{ [raw | trim]
        }}\n  {% else %}\n    {{ raw | map('string') | map('trim') | reject('equalto','')
        | list }}\n  {% endif %}\n{% else %}\n  {{ [(alexa_device | default('sala')
        | string | trim)] }}\n{% endif %}"
      mps_disparo: "{% set mapa = {\n  'escritorio':'media_player.escritorio_echo_mediaplayer',\n
        \ 'banheiro_social':'media_player.banheiro_social_echo_mediaplayer',\n  'sala':'media_player.sala_de_tv_echo_mediaplayer',\n
        \ 'sala_de_tv':'media_player.sala_de_tv_echo_mediaplayer',\n  'cozinha':'media_player.cozinha_echo_mediaplayer',\n
        \ 'oficina':'media_player.oficina_echo_mediaplayer',\n  'banheiro_suite':'media_player.banheiro_suite_echo_mediaplayer',\n
        \ 'quarto_da_cecilia':'media_player.quarto_cecilia_echo_mediaplayer',\n  'brinquedoteca':'media_player.brinquedoteca_echo_mediaplayer',\n
        \ 'suite':'media_player.suite_echo_mediaplayer',\n  'quarto_cecilia':'media_player.quarto_cecilia_echo_mediaplayer',\n
        \ 'sala_de_jantar':'media_player.sala_de_jantar_echo_mediaplayer',\n  'jantar':'media_player.sala_de_jantar_echo_mediaplayer',\n
        \ 'media_player.echo_dot_sala_de_tv':'media_player.sala_de_tv_echo_mediaplayer',\n
        \ 'media_player.echo_dot_cozinha':'media_player.cozinha_echo_mediaplayer',\n
        \ 'media_player.echo_dot_escritorio':'media_player.escritorio_echo_mediaplayer',\n
        \ 'media_player.echo_dot_oficina':'media_player.oficina_echo_mediaplayer',\n
        \ 'media_player.echo_dot_banheiro_social':'media_player.banheiro_social_echo_mediaplayer',\n
        \ 'media_player.echo_dot_banheiro_suite':'media_player.banheiro_suite_echo_mediaplayer',\n
        \ 'media_player.echo_dot_cecilia':'media_player.quarto_cecilia_echo_mediaplayer',\n
        \ 'media_player.echo_dot_brinquedoteca':'media_player.brinquedoteca_echo_mediaplayer',\n
        \ 'media_player.echo_dot_suite':'media_player.suite_echo_mediaplayer',\n  'media_player.echo_show_11_de_antonio':'media_player.sala_de_jantar_echo_mediaplayer',\n
        \ 'media_player.sala_de_jantar_echo_mediaplayer':'media_player.sala_de_jantar_echo_mediaplayer',\n
        \ 'media_player.sala_de_jantar_echo_devices':'media_player.sala_de_jantar_echo_devices',\n
        \ 'media_player.echo_show_11':'media_player.sala_de_jantar_echo_devices'\n}
        %}\n{% set ns = namespace(items=[]) %}\n{% for n in lista_dispositivos %}\n
        \ {% set s = (n | string | trim) %}\n  {% set s_l = s | lower %}\n  {% if
        s_l in mapa %}\n    {% set mp = mapa[s_l] %}\n  {% elif s_l.startswith('media_player.')
        %}\n    {% set mp = mapa[s_l] if s_l in mapa else s_l %}\n  {% else %}\n    {%
        set mp = mapa[s | slugify] | default('media_player.sala_de_tv_echo_mediaplayer')
        %}\n  {% endif %}\n  {% if mp not in ns.items %}\n    {% set ns.items = ns.items
        + [mp] %}\n  {% endif %}\n{% endfor %}\n{{ ns.items }}"
  - action: input_text.set_value
    target:
      entity_id: input_text.alexa_actionable_notification
    data:
      value: '{"text": "{{ text }}", "event": "{{ event_id }}", "suppress_confirmation":
        "{{ suppress_confirmation }}"}'
  - action: alexa_media.update_last_called
    continue_on_error: true
  - repeat:
      for_each: '{{ mps_disparo }}'
      sequence:
      - action: media_player.media_stop
        target:
          entity_id: '{{ repeat.item }}'
        continue_on_error: true
  - delay:
      seconds: 1
  - action: media_player.play_media
    target:
      entity_id: '{{ mps_disparo }}'
    data:
      media_content_type: skill
      media_content_id: amzn1.ask.skill.e347cb98-a5f7-436c-b345-7bf8af1efba9
    continue_on_error: true
saida_casa_verificar_e_armar_alarme:
