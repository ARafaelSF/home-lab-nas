cozinha_termocirculador_iniciar:
  alias: "\U0001F372 Cozinha — Termocirculador Iniciar"
  description: 'Inicia sessão: configura temp/tempo no aparelho, dá play e guarda
    mins restantes. Ignora play/pause/stop do aparelho enquanto o comando HA está
    em andamento.'
  icon: mdi:pot-steam
  mode: single
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.cozinha_termocirculador_pausado
      - input_boolean.cozinha_termocirculador_falta_agua
  - variables:
      temp: '{{ states(''input_number.cozinha_termocirculador_temperatura'') | float(55)
        }}'
      mins: '{{ states(''input_number.cozinha_termocirculador_duracao'') | int(60)
        }}'
      horas_txt: '{% set m = states(''input_number.cozinha_termocirculador_duracao'')
        | int(60) %}{% if m >= 60 %}{{ m // 60 }}h {{ m % 60 }}min{% else %}{{ m }}
        min{% endif %}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cozinha_termocirculador_temp_sessao
    data:
      value: '{{ temp }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.cozinha_termocirculador_mins_restantes
    data:
      value: '{{ mins }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_sessao_ativa
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cozinha_termocirculador_em_queda
  - action: timer.cancel
    target:
      entity_id: timer.cozinha_termocirculador_sessao
    continue_on_error: true
  - action: number.set_value
    target:
      entity_id: number.cozinha_termocirculador_tempo_configurado_localtuya
    data:
      value: '{{ mins }}'
  - delay:
      seconds: 2
  - action: climate.set_temperature
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
    data:
      temperature: '{{ temp }}'
  - delay:
      seconds: 1
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
    data:
      hvac_mode: heat
  - action: climate.turn_on
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
  - delay:
      seconds: 3
  - if:
    - condition: state
      entity_id: sensor.cozinha_termocirculador_status_localtuya
      state: stop
    then:
    - action: climate.turn_on
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
      data:
        hvac_mode: heat
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      titulo: "\U0001F372 Termocirculador iniciado"
      mensagem: 'Temperatura: {{ temp }}°C

        Duração: {{ horas_txt }}

        O tempo do aparelho só começa a contar depois de atingir a temperatura alvo.'
      parse_mode: MarkdownV2
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
cozinha_termocirculador_parar:
  alias: "\U0001F372 Cozinha — Termocirculador Parar"
  description: 'Encerra a sessão: limpa flags (incluindo pausa/falta de água) e desliga
    o aparelho.'
  fields:
    motivo:
      description: 'Motivo do encerramento: concluido | manual | aparelho | recuperacao_falhou'
      example: manual
      required: false
      selector:
        select:
          options:
          - concluido
          - manual
          - aparelho
          - recuperacao_falhou
  icon: mdi:pot-steam-off
  mode: single
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
  - variables:
      motivo_eff: '{{ motivo | default(''manual'') }}'
      temp_alvo: '{{ states(''input_number.cozinha_termocirculador_temp_sessao'')
        | float(0) }}'
      temp_atual: '{{ states(''input_number.cozinha_termocirculador_temp_ultima'')
        | float(0) }}'
      titulo_msg: "{% if motivo_eff == 'concluido' %}\U0001F372 Termocirculador concluído{%
        elif motivo_eff == 'recuperacao_falhou' %}⚠️ Termocirculador — falha na recuperação{%
        elif motivo_eff == 'aparelho' %}\U0001F372 Termocirculador parado no aparelho{%
        else %}\U0001F372 Termocirculador parado{% endif %}"
      corpo_msg: '{% if motivo_eff == ''concluido'' %}Ciclo finalizado.

        Alvo: {{ temp_alvo }}°C

        Temperatura final: {{ temp_atual }}°C{% elif motivo_eff == ''recuperacao_falhou''
        %}Não foi possível retomar o ciclo após a queda.

        Verifique o aparelho manualmente.{% elif motivo_eff == ''aparelho'' %}Ciclo
        interrompido no aparelho.

        Alvo: {{ temp_alvo }}°C

        Temperatura: {{ temp_atual }}°C{% else %}Ciclo interrompido manualmente.

        Alvo: {{ temp_alvo }}°C

        Temperatura atual: {{ temp_atual }}°C{% endif %}'
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.cozinha_termocirculador_sessao_ativa
      - input_boolean.cozinha_termocirculador_em_queda
      - input_boolean.cozinha_termocirculador_pausado
      - input_boolean.cozinha_termocirculador_falta_agua
  - action: timer.cancel
    continue_on_error: true
    target:
      entity_id: timer.cozinha_termocirculador_sessao
  - action: climate.turn_off
    continue_on_error: true
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
  - action: climate.set_hvac_mode
    continue_on_error: true
    data:
      hvac_mode: 'off'
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      mensagem: '{{ corpo_msg }}'
      parse_mode: MarkdownV2
      titulo: '{{ titulo_msg }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
cozinha_termocirculador_retomar:
  alias: "\U0001F372 Cozinha — Termocirculador Continuar"
  description: 'Retoma sessão pausada (pause no termo, falta de água ou botão Continue):
    reaplica tempo restante e temperatura e dá play.'
  icon: mdi:play-pause
  mode: single
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
  - variables:
      mins: '{{ [states(''input_number.cozinha_termocirculador_mins_restantes'') |
        int(1), 1] | max }}'
      temp: '{{ states(''input_number.cozinha_termocirculador_temp_sessao'') | float(55)
        }}'
      temp_atual: '{{ states(''input_number.cozinha_termocirculador_temp_ultima'')
        | float(0) }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_sessao_ativa
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.cozinha_termocirculador_pausado
      - input_boolean.cozinha_termocirculador_falta_agua
      - input_boolean.cozinha_termocirculador_em_queda
  - action: number.set_value
    data:
      value: '{{ mins }}'
    target:
      entity_id: number.cozinha_termocirculador_tempo_configurado_localtuya
  - delay:
      seconds: 2
  - action: climate.set_temperature
    data:
      temperature: '{{ temp }}'
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
  - delay:
      seconds: 1
  - action: climate.set_hvac_mode
    data:
      hvac_mode: heat
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
  - action: climate.turn_on
    target:
      entity_id: climate.cozinha_termocirculador_localtuya
  - delay:
      seconds: 3
  - if:
    - condition: state
      entity_id: sensor.cozinha_termocirculador_status_localtuya
      state: stop
    then:
    - action: climate.turn_on
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
    - action: climate.set_hvac_mode
      data:
        hvac_mode: heat
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
  - delay:
      seconds: 4
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: sensor.cozinha_termocirculador_status_localtuya
        state: stop
      - condition: state
        entity_id: climate.cozinha_termocirculador_localtuya
        state: 'off'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id:
        - input_boolean.cozinha_termocirculador_pausado
        - input_boolean.cozinha_termocirculador_falta_agua
    - action: script.enviar_notificacao_telegram
      data:
        destinatarios: antonio
        parse_mode: MarkdownV2
        titulo: Termocirculador — falta de água
        mensagem: 'O aparelho não ficou ligado após o play. Provável falta de água.

          A sessão ficou pausada.


          Reponha a água e dê play no termo ou Continue no HA.

          Para encerrar: Parar no HA.


          Temp: {{ temp_atual }}°C

          Alvo: {{ temp }}°C

          Mins restantes: {{ mins }} min'
    else:
    - action: script.enviar_notificacao_telegram
      data:
        destinatarios: antonio
        mensagem: 'Sessão retomada pelo HA.


          Temp atual: {{ temp_atual }}°C

          Alvo: {{ temp }}°C

          Mins restantes: {{ mins }} min'
        parse_mode: MarkdownV2
        titulo: ▶️ Termocirculador retomado
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
rega_executar_retry:
  alias: "\U0001F4A7 Rega — executar retry"
  description: Lê input_text.sistema_rega_retry_payload (action|duracao|entities)
    e tenta abrir+regar ou fechar.
  icon: mdi:sprinkler-variant
  mode: queued
  sequence:
  - variables:
      payload: '{{ states(''input_text.sistema_rega_retry_payload'') }}'
      acao: '{{ payload.split(''|'')[0] if payload and ''|'' in payload else ''''
        }}'
      duracao: '{{ payload.split(''|'')[1] | int(0) if payload and ''|'' in payload
        else 0 }}'
      entidades: '{% if payload and ''|'' in payload %}{{ payload.split(''|'')[2].split('','')
        | reject(''eq'','''') | list }}{% else %}[]{% endif %}'
  - variables:
      valves: '{{ expand(entidades) | selectattr(''domain'',''eq'',''valve'') | map(attribute=''entity_id'')
        | list if entidades else [] }}'
      switches: '{{ expand(entidades) | selectattr(''domain'',''eq'',''switch'') |
        map(attribute=''entity_id'') | list if entidades else [] }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ acao == '''' or entidades | length == 0 }}'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          titulo: ⚠️ Rega retry
          mensagem: Não há pedido de retry guardado. Aguarde a próxima falha de rega.
    - conditions:
      - condition: template
        value_template: '{{ acao == ''open'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ valves | length > 0 }}'
        then:
        - action: valve.open_valve
          target:
            entity_id: '{{ valves }}'
      - if:
        - condition: template
          value_template: '{{ switches | length > 0 }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: '{{ switches }}'
      - delay:
          seconds: 15
      - variables:
          ainda_fechadas: '{% set ligado = [''open'',''on'',''opening''] %}{% set
            ns = namespace(ids=[]) %}{% for e in expand(entidades) %}{% if e.state
            not in ligado %}{% set ns.ids = ns.ids + [e.entity_id] %}{% endif %}{%
            endfor %}{{ ns.ids }}'
      - if:
        - condition: template
          value_template: '{{ ainda_fechadas | length > 0 }}'
        then:
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: antonio
            titulo: ⚠️ Rega retry falhou
            mensagem: 'Ainda não abriu: {{ ainda_fechadas | join('', '') }}.'
            inline_keyboard:
            - "\U0001F504 Tentar novamente:/rega_retry"
        else:
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: antonio
            titulo: ✅ Rega retry
            mensagem: Abriu com sucesso. Vai regar {{ duracao }} s e fechar.
        - delay:
            seconds: '{{ duracao | int(0) }}'
        - if:
          - condition: template
            value_template: '{{ valves | length > 0 }}'
          then:
          - action: valve.close_valve
            target:
              entity_id: '{{ valves }}'
        - if:
          - condition: template
            value_template: '{{ switches | length > 0 }}'
          then:
          - action: switch.turn_off
            target:
              entity_id: '{{ switches }}'
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: antonio
            titulo: ✅ Rega retry
            mensagem: Ciclo de retry concluído (fecho enviado).
    - conditions:
      - condition: template
        value_template: '{{ acao == ''close'' }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ valves | length > 0 }}'
        then:
        - action: valve.close_valve
          target:
            entity_id: '{{ valves }}'
      - if:
        - condition: template
          value_template: '{{ switches | length > 0 }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: '{{ switches }}'
      - delay:
          seconds: 5
      - variables:
          ainda_abertas: '{{ expand(entidades) | selectattr(''state'',''in'',[''open'',''on'',''opening''])
            | map(attribute=''entity_id'') | list }}'
      - if:
        - condition: template
          value_template: '{{ ainda_abertas | length > 0 }}'
        then:
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: antonio
            titulo: ⚠️ Rega retry falhou
            mensagem: 'Ainda abertas: {{ ainda_abertas | join('', '') }}.'
            inline_keyboard:
            - "\U0001F504 Tentar novamente:/rega_retry"
        else:
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: antonio
            titulo: ✅ Rega retry
            mensagem: Fechou com sucesso.

teste_last_alexa:
  alias: "🧪 Teste Last Alexa"
  description: >
    Teste do last_called (Alexa Media). Chame por rotina Alexa / cena
    "Teste Last Alexa". Atualiza last_called e anuncia o nome do Echo que falou.
  icon: mdi:microphone-message
  mode: single
  sequence:
  - variables:
      t0_ms: "{{ (as_timestamp(now()) * 1000) | int }}"
  - action: alexa_media.update_last_called
    continue_on_error: true
  - repeat:
      count: 12
      sequence:
      - if:
        - condition: template
          value_template: >-
            {% set mapa = [
              'media_player.sala_de_tv_echo_mediaplayer',
              'media_player.cozinha_echo_mediaplayer',
              'media_player.brinquedoteca_echo_mediaplayer',
              'media_player.escritorio_echo_mediaplayer',
              'media_player.oficina_echo_mediaplayer',
              'media_player.suite_echo_mediaplayer',
              'media_player.banheiro_suite_echo_mediaplayer',
              'media_player.banheiro_social_echo_mediaplayer',
              'media_player.quarto_cecilia_echo_mediaplayer',
              'media_player.sala_de_jantar_echo_mediaplayer',
              'media_player.sala_de_jantar_echo_devices',
            ] %}
            {% set t0 = (t0_ms | default(0)) | int %}
            {% set ns = namespace(ok=false) %}
            {% for mp in mapa %}
              {% set t = (state_attr(mp, 'last_called_timestamp') or 0) | int %}
              {% set lc = state_attr(mp, 'last_called') %}
              {% if (lc is true or lc == true) and t >= (t0 - 8000) %}
                {% set ns.ok = true %}
              {% endif %}
            {% endfor %}
            {{ not ns.ok }}
        then:
        - delay:
            milliseconds: 400
        - action: alexa_media.update_last_called
          continue_on_error: true
  - variables:
      echo_mp: >-
        {% set mapa = {
          'media_player.sala_de_tv_echo_mediaplayer': 'sala',
          'media_player.cozinha_echo_mediaplayer': 'cozinha',
          'media_player.brinquedoteca_echo_mediaplayer': 'brinquedoteca',
          'media_player.escritorio_echo_mediaplayer': 'escritorio',
          'media_player.oficina_echo_mediaplayer': 'oficina',
          'media_player.suite_echo_mediaplayer': 'suite',
          'media_player.banheiro_suite_echo_mediaplayer': 'banheiro_suite',
          'media_player.banheiro_social_echo_mediaplayer': 'banheiro_social',
          'media_player.quarto_cecilia_echo_mediaplayer': 'quarto_cecilia',
          'media_player.sala_de_jantar_echo_mediaplayer': 'sala_de_jantar',
          'media_player.sala_de_jantar_echo_devices': 'sala_de_jantar',
        } %}
        {% set nomes = {
          'sala': 'Echo da Sala de TV',
          'cozinha': 'Echo da Cozinha',
          'brinquedoteca': 'Echo da Brinquedoteca',
          'escritorio': 'Echo do Escritório',
          'oficina': 'Echo da Oficina',
          'suite': 'Echo da Suíte',
          'banheiro_suite': 'Echo do Banheiro da Suíte',
          'banheiro_social': 'Echo do Banheiro Social',
          'quarto_cecilia': 'Echo do Quarto da Cecília',
          'sala_de_jantar': 'Echo da Sala de Jantar',
        } %}
        {% set t0 = (t0_ms | default(0)) | int %}
        {% set ns = namespace(dev='sala', ts=0, flagged=none, fts=0) %}
        {% for mp, nome in mapa.items() %}
          {% set t = (state_attr(mp, 'last_called_timestamp') or 0) | int %}
          {% set lc = state_attr(mp, 'last_called') %}
          {% set fresco = (t0 == 0) or (t >= (t0 - 8000)) %}
          {% if (lc is true or lc == true) and fresco and t >= ns.fts %}
            {% set ns.flagged = nome %}
            {% set ns.fts = t %}
          {% endif %}
          {% if t > ns.ts %}
            {% set ns.ts = t %}
            {% set ns.dev = nome %}
          {% endif %}
        {% endfor %}
        {{ ns.flagged if ns.flagged is not none else ns.dev }}
      echo_nome: >-
        {% set nomes = {
          'sala': 'Echo da Sala de TV',
          'cozinha': 'Echo da Cozinha',
          'brinquedoteca': 'Echo da Brinquedoteca',
          'escritorio': 'Echo do Escritório',
          'oficina': 'Echo da Oficina',
          'suite': 'Echo da Suíte',
          'banheiro_suite': 'Echo do Banheiro da Suíte',
          'banheiro_social': 'Echo do Banheiro Social',
          'quarto_cecilia': 'Echo do Quarto da Cecília',
          'sala_de_jantar': 'Echo da Sala de Jantar',
        } %}
        {{ nomes.get(echo_mp, echo_mp) }}
  - action: script.enviar_notificacao_alexa
    data:
      dispositivos: "{{ echo_mp }}"
      mensagem: "Teste Last Alexa. Você falou comigo no {{ echo_nome }}."
      tipo: tts
