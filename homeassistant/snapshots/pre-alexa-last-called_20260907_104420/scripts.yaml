          %}{% set ns = namespace(parts=[]) %}{% for e in C %}{% if is_state(e, ''on'')
          %}{% set ns.parts = ns.parts + [state_attr(e, ''friendly_name'') | default(e)]
          %}{% endif %}{% endfor %}Atenção: {{ ns.parts | join('', '') }} está aberto.
          Não posso ligar o alarme.'
    - action: script.enviar_notificacao_alexa
      data:
        dispositivos: '{{ alexa }}'
        mensagem: '{{ msg_criticos }}'
    - stop: portas_criticas_abertas
  - if:
    - condition: template
      value_template: '{% set C = [''binary_sensor.sala_de_tv_janela_direita_z2m_contact'',''binary_sensor.sala_de_tv_janela_esquerda_z2m_contact'',''binary_sensor.oficina_janela_z2m_contact'',''binary_sensor.oficina_porta_z2m_contact'']
        %}{{ C | select(''is_state'', ''on'') | list | length > 0 }}'
    then:
    - variables:
        texto_inter: '{% set C = [''binary_sensor.sala_de_tv_janela_direita_z2m_contact'',''binary_sensor.sala_de_tv_janela_esquerda_z2m_contact'',''binary_sensor.oficina_janela_z2m_contact'',''binary_sensor.oficina_porta_z2m_contact'']
          %}{% set ns = namespace(parts=[]) %}{% for e in C %}{% if is_state(e, ''on'')
          %}{% set ns.parts = ns.parts + [state_attr(e, ''friendly_name'') | default(e)]
          %}{% endif %}{% endfor %}Tem abertura em: {{ ns.parts | join('', '') }}.
          Quer armar o alarme e sair assim mesmo? Diga sim para confirmar, ou não
          para cancelar.'
    - action: script.turn_on
      target:
        entity_id: script.alexa_actionable_notification
      data:
        variables:
          text: '{{ texto_inter }}'
          event_id: saida_casa_intermediarios
          alexa_device: '{{ alexa }}'
          suppress_confirmation: 'true'
    - wait_for_trigger:
      - trigger: event
        event_type: alexa_actionable_notification
        event_data:
          event_id: saida_casa_intermediarios
      timeout:
        seconds: 45
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: "{{ not (\n  (wait is defined) and (wait.trigger is not none)\n
          \ and (wait.trigger.event is defined)\n  and (wait.trigger.event.data.get('event_response_type',
          '') == 'ResponseYes')\n) }}"
      then:
      - action: script.enviar_notificacao_alexa
        data:
          dispositivos: '{{ alexa }}'
          mensagem: Beleza, cancelei. O alarme não foi armado.
      - stop: usuario_cancelou_intermediarios
  - if:
    - condition: template
      value_template: '{% set C = [''binary_sensor.brinquedoteca_janela_z2m_contact'',''binary_sensor.quarto_cecilia_janela_z2m_contact'',''binary_sensor.suite_janela_z2m_contact'']
        %}{{ C | select(''is_state'', ''on'') | list | length > 0 }}'
    then:
    - variables:
        msg_alertas: '{% set C = [''binary_sensor.brinquedoteca_janela_z2m_contact'',''binary_sensor.quarto_cecilia_janela_z2m_contact'',''binary_sensor.suite_janela_z2m_contact'']
          %}{% set ns = namespace(parts=[]) %}{% for e in C %}{% if is_state(e, ''on'')
          %}{% set ns.parts = ns.parts + [state_attr(e, ''friendly_name'') | default(e)]
          %}{% endif %}{% endfor %}Atenção: {{ ns.parts | join('', '') }} vai ficar
          aberto. Vou ligar o alarme e apagar as luzes para você.'
    - action: script.enviar_notificacao_alexa
      data:
        dispositivos: '{{ alexa }}'
        mensagem: '{{ msg_alertas }}'
  - if:
    - condition: state
      entity_id: binary_sensor.sala_de_tv_porta_contato_hikvision_axpro
      state: 'off'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.sala_de_tv_porta_contato_hikvision_axpro
        to: 'on'
        for:
          seconds: 2
      timeout:
        minutes: 5
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ (wait is defined) and (wait.trigger is none) }}'
      then:
      - action: script.enviar_notificacao_alexa
        data:
          dispositivos: '{{ alexa }}'
          mensagem: Saída cancelada por tempo. Alarme não foi armado.
          tipo: tts
      - stop: timeout_porta_sala_saida_casa
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.sala_de_tv_porta_contato_hikvision_axpro
        to: 'off'
        for:
          seconds: 3
        from: 'on'
      timeout:
        minutes: 5
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ (wait is defined) and (wait.trigger is none) }}'
      then:
      - action: script.enviar_notificacao_alexa
        data:
          dispositivos: '{{ alexa }}'
          mensagem: Saída cancelada por tempo. Alarme não foi armado.
          tipo: tts
      - stop: timeout_porta_sala_saida_casa
    else:
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.sala_de_tv_porta_contato_hikvision_axpro
        to: 'off'
        for:
          seconds: 3
        from: 'on'
      timeout:
        minutes: 5
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ (wait is defined) and (wait.trigger is none) }}'
      then:
      - action: script.enviar_notificacao_alexa
        data:
          dispositivos: '{{ alexa }}'
          mensagem: Saída cancelada por tempo. Alarme não foi armado.
          tipo: tts
      - stop: timeout_porta_sala_saida_casa
  - variables:
      tentativas_desligar: 4
      intervalo_desligar_seg: 20
      dominios_desligar_auto:
      - light
      - fan
      - media_player
      - humidifier
      entidades_auto_desligar: "{% set excluir = garagem_luzes %}\n{% set ns = namespace(items=[])
        %}\n{% for dominio in dominios_desligar_auto %}\n  {% for e in states[dominio]
        | rejectattr('state', 'in', ['unavailable', 'unknown']) %}\n    {% if e.entity_id
        not in excluir %}\n      {% set ns.items = ns.items + [e.entity_id] %}\n    {%
        endif %}\n  {% endfor %}\n{% endfor %}\n{{ ns.items }}"
      switches_desligar: '{{ expand(''switch.saida_desligar_switches'') | map(attribute=''entity_id'')
        | list }}'
      entidades_gerais_desligar: '{{ entidades_auto_desligar + switches_desligar }}'
      climas_desligar: '{{ states.climate | rejectattr(''state'', ''in'', [''off'',
        ''unavailable'', ''unknown'']) | map(attribute=''entity_id'') | list }}'
      todos_desligar: '{{ entidades_gerais_desligar + climas_desligar }}'
  - repeat:
      count: '{{ tentativas_desligar }}'
      sequence:
      - variables:
          pendentes_desligar: "{% set ns = namespace(items=[]) %}\n{% for e in todos_desligar
            %}\n  {% if states(e) not in ['off', 'unavailable', 'unknown'] %}\n    {%
            set ns.items = ns.items + [e] %}\n  {% endif %}\n{% endfor %}\n{{ ns.items
            }}"
          pendentes_gerais: '{{ pendentes_desligar | reject(''in'', climas_desligar)
            | list }}'
          pendentes_clima: '{{ pendentes_desligar | select(''in'', climas_desligar)
            | list }}'
      - if:
        - condition: template
          value_template: '{{ pendentes_gerais | count > 0 }}'
        then:
        - action: homeassistant.turn_off
          target:
            entity_id: '{{ pendentes_gerais }}'
      - if:
        - condition: template
          value_template: '{{ pendentes_clima | count > 0 }}'
        then:
        - action: climate.turn_off
          target:
            entity_id: '{{ pendentes_clima }}'
      - if:
        - condition: template
          value_template: '{{ repeat.index < (tentativas_desligar | int) }}'
        then:
        - delay:
            seconds: '{{ intervalo_desligar_seg }}'
  - variables:
      falhas_desligar: "{% set ns = namespace(items=[]) %}\n{% for e in todos_desligar
        %}\n  {% if states(e) not in ['off', 'unavailable', 'unknown'] %}\n    {%
        set ns.items = ns.items + [e] %}\n  {% endif %}\n{% endfor %}\n{{ ns.items
        }}"
      falhas_desligar_nomes: "{% set ns = namespace(items=[]) %}\n{% for e in falhas_desligar
        %}\n  {% set nome = state_attr(e, 'friendly_name') | default(e, true) %}\n
        \ {% set ns.items = ns.items + [nome ~ ' (' ~ e ~ ') - estado: ' ~ states(e)]
        %}\n{% endfor %}\n{{ ns.items }}"
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.alarme_hikvision_axpro
    data: {}
  - if:
    - condition: template
      value_template: '{{ falhas_desligar | count > 0 }}'
    then:
    - action: script.enviar_notificacao_telegram
      data:
        destinatarios:
        - antonio
        - renata
        titulo: '⚠️ Saída: itens ainda ligados'
        mensagem: 'Tentei desligar os itens da casa {{ tentativas_desligar }} vezes,
          com intervalo de {{ intervalo_desligar_seg }} segundos.


          Não consegui desligar:

          - {{ falhas_desligar_nomes | join(''\n- '') }}'
  - action: script.enviar_notificacao_alexa
    data:
      dispositivos: '{{ alexa }}'
      mensagem: '{% if falhas_desligar | count > 0 %}Alarme armado. Tentei desligar
        tudo, mas alguns itens continuaram ligados. Enviei os detalhes no Telegram.{%
        else %}Alarme armado e itens da casa desligados.{% endif %}'
homelab_teste_notificacao_backup:
  alias: "\U0001F4BE Homelab: Teste notificações backup"
  description: Simula alerta de backup Duplicati (warning/error) sem alterar sensores
    SSD/OneDrive. Use para validar Telegram, app e notificação persistente.
  icon: mdi:backup-restore-alert
  mode: single
  fields:
    cenario:
      name: Cenário
      description: warning, error ou ambos (envia os dois alertas em sequência).
      required: true
      selector:
        select:
          options:
          - warning
          - error
          - ambos
      default: warning
  sequence:
  - variables:
      destinatarios_homelab:
      - antonio
      agora: '{{ now().strftime(''%d/%m/%Y %H:%M'') }}'
      job_teste: TESTE — Duplicati homelab
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ cenario in [''warning'', ''ambos''] }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: '[TESTE] Backup com avisos — {{ job_teste }}'
          message: Simulação de warning em {{ agora }}. Se recebeu isto, o canal persistente
            funciona.
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_homelab }}'
          titulo: '[TESTE] Homelab — backup com avisos'
          mensagem: '{{ job_teste }}: simulação de warning em {{ agora }}.'
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_homelab }}'
          titulo: '[TESTE] Homelab — backup com avisos'
          mensagem: Simulação Duplicati — verifique se chegou no telemóvel.
          dados:
            tag: duplicati_backup_test_warning
            channel: Homelab
            importance: high
            notification_icon: mdi:alert
            color: '#FF9800'
    - conditions:
      - condition: template
        value_template: '{{ cenario in [''error'', ''ambos''] }}'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_homelab }}'
          titulo: '[TESTE] Homelab — backup FALHOU'
          mensagem: '{{ job_teste }}: simulação de erro em {{ agora }}.'
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_homelab }}'
          titulo: '[TESTE] Homelab — backup FALHOU'
          mensagem: Simulação Duplicati — verifique se chegou no telemóvel.
          dados:
            tag: duplicati_backup_test_error
            channel: Homelab
            importance: high
            notification_icon: mdi:backup-restore-alert
            color: '#D32F2F'
      - action: persistent_notification.create
        data:
          title: '[TESTE] Backup FALHOU — {{ job_teste }}'
          message: Simulação de erro em {{ agora }}. Se recebeu isto, o canal persistente
            funciona.
pirata_cecilia:
  alias: "\U0001F3F4‍☠️ Pirata Cecília"
  description: Lembrete diário e consulta por voz do pirata, com pausa e retomada.
    Responde no Echo que invocou. Aguarda last_called fresco (até ~5s) e só confia
    em last_called=True recente.
  fields:
    modo:
      default: consultar
      description: lembrete (cron) ou consultar (Alexa)
      name: Modo
      selector:
        select:
          options:
          - consultar
          - lembrete
    alexa_dispositivo:
      name: Echo (Alexa)
      description: Nome amigável (sala, cozinha, …). Vazio = Echo que invocou por
        voz.
      default: ''
      selector:
        select:
          options:
          - ''
          - sala
          - cozinha
          - brinquedoteca
          - escritorio
          - oficina
          - suite
          - banheiro_suite
          - banheiro_social
          - quarto_cecilia
          - sala_de_jantar
  icon: mdi:human-handsdown
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (alexa_dispositivo | default('''') | string | trim) in
          ['''', ''none'', ''None'', ''unknown'', ''unavailable''] }}'
      sequence:
      - variables:
          t0_ms: '{{ (as_timestamp(now()) * 1000) | int }}'
      - action: alexa_media.update_last_called
        continue_on_error: true
      - repeat:
          count: 10
          sequence:
          - if:
            - condition: template
              value_template: "{% set mapa = {\n  'media_player.sala_de_tv_echo_mediaplayer':
                'sala',\n  'media_player.cozinha_echo_mediaplayer': 'cozinha',\n  'media_player.brinquedoteca_echo_mediaplayer':
                'brinquedoteca',\n  'media_player.escritorio_echo_mediaplayer': 'escritorio',\n
                \ 'media_player.oficina_echo_mediaplayer': 'oficina',\n  'media_player.suite_echo_mediaplayer':
                'suite',\n  'media_player.banheiro_suite_echo_mediaplayer': 'banheiro_suite',\n
                \ 'media_player.banheiro_social_echo_mediaplayer': 'banheiro_social',\n
                \ 'media_player.quarto_cecilia_echo_mediaplayer': 'quarto_cecilia',\n
                \ 'media_player.sala_de_jantar_echo_mediaplayer': 'sala_de_jantar',\n
                \ 'media_player.sala_de_jantar_echo_devices': 'sala_de_jantar'\n}
                %}\n{% set t0 = (t0_ms | default(0)) | int %}\n{% set ns = namespace(ok=false)
                %}\n{% for mp, nome in mapa.items() %}\n  {% set t = (state_attr(mp,
                'last_called_timestamp') or 0) | int %}\n  {% set lc = state_attr(mp,
                'last_called') %}\n  {% if (lc is true or lc == true) and t >= (t0
                - 5000) %}\n    {% set ns.ok = true %}\n  {% endif %}\n{% endfor %}\n{{
                not ns.ok }}"
            then:
            - delay:
                milliseconds: 500
            - action: alexa_media.update_last_called
              continue_on_error: true
  - variables:
      minutos_restantes: "{% set t = 'timer.pirata_cecilia_sessao' %}\n{% set st =
        states(t) %}\n{% if st == 'active' and state_attr(t, 'finishes_at') %}\n  {%
        set secs = [(as_timestamp(state_attr(t, 'finishes_at')) - as_timestamp(now()))
        | int, 0] | max %}\n{% elif state_attr(t, 'remaining') %}\n  {% set rem =
        (state_attr(t, 'remaining') | string).split(':') %}\n  {% if rem | length
        >= 3 %}\n    {% set secs = (rem[0] | int * 3600) + (rem[1] | int * 60) + (rem[2]
        | int) %}\n  {% elif rem | length == 2 %}\n    {% set secs = (rem[0] | int
        * 60) + (rem[1] | int) %}\n  {% else %}\n    {% set secs = 0 %}\n  {% endif
        %}\n{% else %}\n  {% set secs = 0 %}\n{% endif %}\n{{ ((secs + 59) // 60)
        if secs > 0 else 0 }}\n"
      modo_final: '{{ modo | default(''consultar'') }}'
      ecos_lembrete:
      - sala
      - cozinha
      - brinquedoteca
      echo_de_ecos: "{% set mapa = {\n  'media_player.sala_de_tv_echo_mediaplayer':
        'sala',\n  'media_player.cozinha_echo_mediaplayer': 'cozinha',\n  'media_player.brinquedoteca_echo_mediaplayer':
        'brinquedoteca',\n  'media_player.escritorio_echo_mediaplayer': 'escritorio',\n
        \ 'media_player.oficina_echo_mediaplayer': 'oficina',\n  'media_player.suite_echo_mediaplayer':
        'suite',\n  'media_player.banheiro_suite_echo_mediaplayer': 'banheiro_suite',\n
        \ 'media_player.banheiro_social_echo_mediaplayer': 'banheiro_social',\n  'media_player.quarto_cecilia_echo_mediaplayer':
        'quarto_cecilia',\n  'media_player.sala_de_jantar_echo_mediaplayer': 'sala_de_jantar',\n
        \ 'media_player.sala_de_jantar_echo_devices': 'sala_de_jantar'\n} %}\n{% set
        t0 = (t0_ms | default(0)) | int %}\n{% set ns = namespace(dev='sala', ts=0,
        flagged=none, fts=0) %}\n{% for mp, nome in mapa.items() %}\n  {% set t =
        (state_attr(mp, 'last_called_timestamp') or 0) | int %}\n  {% set lc = state_attr(mp,
        'last_called') %}\n  {% set fresco = (t0 == 0) or (t >= (t0 - 5000)) %}\n
        \ {% if (lc is true or lc == true) and fresco and t >= ns.fts %}\n    {% set
        ns.flagged = nome %}\n    {% set ns.fts = t %}\n  {% endif %}\n  {% if t >
        ns.ts %}\n    {% set ns.ts = t %}\n    {% set ns.dev = nome %}\n  {% endif
        %}\n{% endfor %}\n{{ ns.flagged if ns.flagged is not none else ns.dev }}"
      mapa_echo:
        media_player.sala_de_tv_echo_mediaplayer: sala
        media_player.cozinha_echo_mediaplayer: cozinha
        media_player.brinquedoteca_echo_mediaplayer: brinquedoteca
        media_player.escritorio_echo_mediaplayer: escritorio
        media_player.oficina_echo_mediaplayer: oficina
        media_player.suite_echo_mediaplayer: suite
        media_player.banheiro_suite_echo_mediaplayer: banheiro_suite
        media_player.banheiro_social_echo_mediaplayer: banheiro_social
        media_player.quarto_cecilia_echo_mediaplayer: quarto_cecilia
        media_player.sala_de_jantar_echo_mediaplayer: sala_de_jantar
        media_player.sala_de_jantar_echo_devices: sala_de_jantar
      alexa_fixo: '{% set informado = alexa_dispositivo | default('''') | string |
        trim %}

        {{ informado not in ['''', ''none'', ''None'', ''unknown'', ''unavailable'']
        }}

        '
      alexa: "{% set informado = alexa_dispositivo | default('') | string | trim %}\n{%
        if informado not in ['', 'none', 'None', 'unknown', 'unavailable'] %}\n  {{
        informado }}\n{% else %}\n{% set mapa = {\n  'media_player.sala_de_tv_echo_mediaplayer':
        'sala',\n  'media_player.cozinha_echo_mediaplayer': 'cozinha',\n  'media_player.brinquedoteca_echo_mediaplayer':
        'brinquedoteca',\n  'media_player.escritorio_echo_mediaplayer': 'escritorio',\n
        \ 'media_player.oficina_echo_mediaplayer': 'oficina',\n  'media_player.suite_echo_mediaplayer':
        'suite',\n  'media_player.banheiro_suite_echo_mediaplayer': 'banheiro_suite',\n
        \ 'media_player.banheiro_social_echo_mediaplayer': 'banheiro_social',\n  'media_player.quarto_cecilia_echo_mediaplayer':
        'quarto_cecilia',\n  'media_player.sala_de_jantar_echo_mediaplayer': 'sala_de_jantar',\n
        \ 'media_player.sala_de_jantar_echo_devices': 'sala_de_jantar'\n} %}\n{% set
        t0 = (t0_ms | default(0)) | int %}\n{% set ns = namespace(dev='sala', ts=0,
        flagged=none, fts=0) %}\n{% for mp, nome in mapa.items() %}\n  {% set t =
        (state_attr(mp, 'last_called_timestamp') or 0) | int %}\n  {% set lc = state_attr(mp,
        'last_called') %}\n  {% set fresco = (t0 == 0) or (t >= (t0 - 5000)) %}\n
        \ {% if (lc is true or lc == true) and fresco and t >= ns.fts %}\n    {% set
        ns.flagged = nome %}\n    {% set ns.fts = t %}\n  {% endif %}\n  {% if t >
        ns.ts %}\n    {% set ns.ts = t %}\n    {% set ns.dev = nome %}\n  {% endif
        %}\n{% endfor %}\n{{ ns.flagged if ns.flagged is not none else ns.dev }}\n{%
        endif %}"
      echo_tpl: "{% if alexa_informo %}\n  {{ alexa }}\n{% else %}\n{% set mapa =
        {\n  'media_player.sala_de_tv_echo_mediaplayer': 'sala',\n  'media_player.cozinha_echo_mediaplayer':
        'cozinha',\n  'media_player.brinquedoteca_echo_mediaplayer': 'brinquedoteca',\n
        \ 'media_player.escritorio_echo_mediaplayer': 'escritorio',\n  'media_player.oficina_echo_mediaplayer':
        'oficina',\n  'media_player.suite_echo_mediaplayer': 'suite',\n  'media_player.banheiro_suite_echo_mediaplayer':
        'banheiro_suite',\n  'media_player.banheiro_social_echo_mediaplayer': 'banheiro_social',\n
        \ 'media_player.quarto_cecilia_echo_mediaplayer': 'quarto_cecilia',\n  'media_player.sala_de_jantar_echo_mediaplayer':
        'sala_de_jantar',\n  'media_player.sala_de_jantar_echo_devices': 'sala_de_jantar'\n}
        %}\n{% set t0 = (t0_ms | default(0)) | int %}\n{% set ns = namespace(dev='sala',
        ts=0, flagged=none, fts=0) %}\n{% for mp, nome in mapa.items() %}\n  {% set
        t = (state_attr(mp, 'last_called_timestamp') or 0) | int %}\n  {% set lc =
        state_attr(mp, 'last_called') %}\n  {% set fresco = (t0 == 0) or (t >= (t0
        - 5000)) %}\n  {% if (lc is true or lc == true) and fresco and t >= ns.fts
        %}\n    {% set ns.flagged = nome %}\n    {% set ns.fts = t %}\n  {% endif
        %}\n  {% if t > ns.ts %}\n    {% set ns.ts = t %}\n    {% set ns.dev = nome
        %}\n  {% endif %}\n{% endfor %}\n{{ ns.flagged if ns.flagged is not none else
        ns.dev }}\n{% endif %}"
  - variables:
      tempo_falta: "{% set m = minutos_restantes | int %}\n{% if m <= 0 %}\n  menos
        de um minuto\n{% elif m == 1 %}\n  1 minuto\n{% else %}\n  {{ m }} minutos\n{%
        endif %}\n"
  - if:
    - condition: state
      entity_id: input_boolean.pirata_cecilia_usou_hoje
      state: 'on'
    then:
    - action: script.enviar_notificacao_alexa
      data:
        dispositivos: '{{ alexa }}'
        mensagem: Cecília, você já usou o pirata hoje. Parabéns!
    - stop: já usou hoje
  - if:
    - condition: state
      entity_id: timer.pirata_cecilia_sessao
      state: active
    - condition: template
      value_template: '{{ modo_final == ''consultar'' }}'
    then:
    - action: script.turn_on
      target:
        entity_id: script.alexa_actionable_notification
