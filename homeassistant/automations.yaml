      - binary_sensor.sala_de_tv_porta_contato_hikvision_axpro
      - binary_sensor.cozinha_porta_alto_contato_hikvision_axpro
      - binary_sensor.cozinha_porta_baixo_contato_hikvision_axpro
      - binary_sensor.escritorio_porta_varanda_contato_hikvision_axpro
      - binary_sensor.cozinha_porta_terreiro_contato_hikvision_axpro
      telegram_destinatarios:
      - Antonio
