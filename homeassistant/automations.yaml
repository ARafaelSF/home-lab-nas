- id: '1769123404531'
  alias: "\U0001F6A8\U0001F6E1️ Notificação - Falha ao armar alarme"
  description: Detecta quando um comando de armar é enviado mas o alarme não arma
  triggers:
  - event_type: call_service
    event_data:
      domain: alarm_control_panel
      service: alarm_arm_away
      service_data:
        entity_id: alarm_control_panel.alarme_hikvision_axpro
    platform: event
  - event_type: call_service
    event_data:
      domain: alarm_control_panel
      service: alarm_arm_home
      service_data:
        entity_id: alarm_control_panel.alarme_hikvision_axpro
    platform: event
  actions:
  - variables:
      estado_inicial: '{{ states(''alarm_control_panel.alarme_hikvision_axpro'') }}'
  - delay:
      seconds: 8
  - if:
    - condition: template
      value_template: "{{ states('alarm_control_panel.alarme_hikvision_axpro') not
        in ['armed_away', 'armed_home'] and\n   states('alarm_control_panel.alarme_hikvision_axpro')
        == estado_inicial }}\n"
    then:
    - data:
        destinatarios: antonio
        mensagem: "*ALERTA DE ALARME!* \U0001F6A8 O alarme não foi armado. Verifique
          se há alguma zona aberta ou outro problema."
      action: script.enviar_notificacao_telegram
  mode: single
- id: '1769284986778'
  alias: ⏲️ Desligar Bone após 20 minutos
  description: 'Desliga automaticamente o switch 20 minutos após ser ligado. Se for
