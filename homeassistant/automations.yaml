- id: '1777207495704'
  alias: "\U0001F697 Garagem: portão menor — monitorização e fechamento automático"
  description: 'Monitora portão aberto, gerencia alertas via boolean e notifica fechamento
    apenas se estava em alerta.


    Alerta após 2 min aberto (alterado em 2026-09-01, antes 1 min).'
  triggers:
  - entity_id:
    - cover.garagem_portao_menor_localtuya
    to:
    - open
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: portao_aberto_tempo
    trigger: state
  - entity_id: cover.garagem_portao_menor_localtuya
    to: closed
    id: portao_fechou
    trigger: state
  - id: watchdog_10s
    minutes: /1
    trigger: time_pattern
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: portao_fechou
      - condition: state
        entity_id: input_boolean.garagem_portao_menor_alerta_ativo
        state: 'on'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_portao }}'
          titulo: '{{ titulo_sucesso }}'
          mensagem: ✅ O portão foi fechado com sucesso!
          cameras:
          - camera.camera_garagem_hd_stream
          - camera.camera_portao_hd_stream
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_portao }}'
          titulo: '{{ titulo_sucesso }}'
          mensagem: O portão foi fechado com sucesso!
          dados:
            tag: portao_garagem_menor_aberto_alerta
            color: '{{ color_sucesso_app }}'
            notification_icon: '{{ icon_sucesso_app }}'
            timeout: 60
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garagem_portao_menor_alerta_ativo
    - conditions:
      - condition: trigger
        id: watchdog_10s
      - condition: state
        entity_id: cover.garagem_portao_menor_localtuya
        state: closed
        for: 00:02:00
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garagem_portao_menor_alerta_ativo
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: portao_aberto_tempo
        - condition: and
          conditions:
          - condition: trigger
            id: watchdog_10s
          - condition: state
            entity_id: cover.garagem_portao_menor_localtuya
            state: open
          - condition: template
            value_template: '{{ (as_timestamp(now()) - as_timestamp(states.cover.garagem_portao_menor_localtuya.last_changed,
              0)) >= 120 }}'
      - condition: state
        entity_id: input_boolean.garagem_portao_menor_alerta_ativo
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garagem_portao_menor_alerta_ativo
      - repeat:
          while:
          - condition: state
            entity_id: cover.garagem_portao_menor_localtuya
            state: open
          sequence:
          - variables:
              last_changed: '{{ states.cover.garagem_portao_menor_localtuya.last_changed
                }}'
              tempo_aberto_seg: '{{ (as_timestamp(now()) - as_timestamp(last_changed,
                0)) | int }}'
              tempo_aberto_min: '{{ (tempo_aberto_seg // 60) | int }}'
              horas: '{{ (tempo_aberto_min // 60) | int }}'
              minutos: '{{ (tempo_aberto_min % 60) | int }}'
              mensagem_tempo: "{% if tempo_aberto_seg < 3600 %}\n  {{ tempo_aberto_min
                }} minuto{{ 's' if tempo_aberto_min != 1 else '' }}\n{% else %}\n
                \ {{ horas }} hora{{ 's' if horas != 1 else '' }}\n  {%- if minutos
                > 0 -%}\n    e {{ minutos }} minuto{{ 's' if minutos != 1 else ''
                }}\n  {%- endif -%}\n{% endif %}"
              mensagem_alerta_dinamica: ⚠️ O Portão da Garagem Menor está *aberto*
                há {{ mensagem_tempo }}! Deseja fechá-lo?
              mensagem_alexa: Atenção. O Portão da Garagem Menor está aberto há {{
                mensagem_tempo }}.
          - action: script.enviar_notificacao_alexa
            data:
              dispositivos: '{{ alexa_alvos }}'
              mensagem: '{{ mensagem_alexa }}'
              tipo: announce
          - action: script.enviar_notificacao_telegram
            data:
              destinatarios: '{{ destinatarios_portao }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta_dinamica }}'
              parse_mode: MarkdownV2
              inline_keyboard: '{{ teclado_telegram }}'
              cameras:
              - camera.camera_garagem_hd_stream
              - camera.camera_portao_hd_stream
          - action: script.enviar_notificacao_app
            data:
              destinatarios: '{{ destinatarios_portao }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta_dinamica }}'
              dados:
                tag: portao_garagem_menor_aberto_alerta
                channel: Garagem
                importance: high
                notification_icon: '{{ icon_alerta_app }}'
                color: '{{ color_alerta_app }}'
                actions: '{{ botoes_app }}'
          - wait_for_trigger:
            - event_type: mobile_app_notification_action
              event_data:
                action: FECHAR_PORTAO_GARAGEM_MENOR
              trigger: event
            - event_type: telegram_callback
              event_data:
                command: /fechar_portao_garagem_menor
              trigger: event
            timeout:
              minutes: 5
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ wait.trigger is not none }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: cover.garagem_portao_menor_localtuya
              - action: script.enviar_notificacao_app
                data:
                  destinatarios: '{{ destinatarios_portao }}'
                  titulo: "\U0001F504 Fechando..."
                  mensagem: Comando enviado. Verificando fechamento...
                  dados:
                    tag: portao_garagem_menor_aberto_alerta
              - wait_for_trigger:
                - entity_id: cover.garagem_portao_menor_localtuya
                  to: closed
                  trigger: state
                timeout: 00:00:30
                continue_on_timeout: true
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ wait.trigger is none }}'
                  sequence:
                  - action: script.enviar_notificacao_telegram
                    data:
                      destinatarios: '{{ destinatarios_portao }}'
                      titulo: '{{ titulo_erro }}'
                      mensagem: '❌ ALERTA CRÍTICO: O comando foi enviado, mas o portão
                        NÃO confirmou o fechamento após 30 segundos.'
                      cameras:
                      - camera.camera_garagem_hd_stream
                      - camera.camera_portao_hd_stream
                  - action: script.enviar_notificacao_app
                    data:
                      destinatarios: '{{ destinatarios_portao }}'
                      titulo: '{{ titulo_erro }}'
                      mensagem: O portão NÃO fechou após o comando!
                      dados:
                        tag: portao_garagem_menor_aberto_alerta
                        color: '{{ color_erro_app }}'
                        notification_icon: '{{ icon_erro_app }}'
                        importance: high
                        channel: GaragemCritico
  mode: parallel
  max: 10
  variables:
    destinatarios_portao:
    - antonio
    - renata
    alexa_alvos:
    - sala
    - cozinha
    - escritório
    - oficina
    - brinquedoteca
    titulo_alerta: "\U0001F697 Portão Garagem Menor: Alerta"
    titulo_sucesso: "\U0001F697 Portão Garagem Menor: Fechado"
    titulo_erro: "\U0001F697 Portão Garagem Menor: Erro"
    icon_alerta_app: mdi:garage-alert
    icon_sucesso_app: mdi:garage-lock
    icon_erro_app: mdi:alert-circle
    color_alerta_app: '#FFC107'
    color_sucesso_app: '#4CAF50'
    color_erro_app: '#F44336'
    teclado_telegram: "\U0001F512 Fechar Portão:/fechar_portao_garagem_menor"
    botoes_app: "{% set actions = [] %}  {% set actions = actions + [{'action':'FECHAR_PORTAO_GARAGEM_MENOR','title':'\U0001F6AB
      Fechar Portão'}] %}  {{ actions }}\n"
- id: '1777226605274'
  alias: '❄️ Alerta: Ar-condicionado (Escritório)'
  description: Monitora se o ar-condicionado do escritório está ligado sem presença
    no escritório por 20 minutos. Envia alertas a cada 20 min no Telegram e App com
    botão para desligar.
  triggers:
