- id: '1768059289288'
  alias: "\U0001F6E1️ Alarme — Armado/Desarmado (Telegram)"
  description: 'Notifica no Telegram quando o alarme Hikvision AX Pro muda de estado.

    Variáveis notify_armed / notify_disarmed controlam quais mensagens enviar.'
  triggers:
  - entity_id: alarm_control_panel.alarme_hikvision_axpro
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none\n   and trigger.from_state is
      not none\n   and trigger.to_state.state not in ['unknown','unavailable']\n   and
      trigger.from_state.state not in ['unknown','unavailable']\n   and trigger.to_state.state
      != trigger.from_state.state\n   and trigger.to_state.state in ['disarmed','armed_home','armed_away']
      }}\n"
  actions:
  - variables:
      st: '{{ trigger.to_state.state }}'
      notify_armed: false
      notify_disarmed: true
      titulo: "{% set t = {\n  'disarmed': '\U0001F694 *Alarme*',\n  'armed_home':
        '\U0001F694 *Alarme*',\n  'armed_away': '\U0001F694 *Alarme*'\n} %} {{ t.get(st,
        '\U0001F694 *Alarme — Estado Alterado*') }}"
      mensagem: "{% set m = {\n  'disarmed': '✅ Alarme desarmado.',\n  'armed_home':
        '\U0001F512 Alarme armado (dentro).',\n  'armed_away': '\U0001F512 Alarme
        armado (fora).'\n} %} {{ m.get(st, 'ℹ️ Novo estado: ' ~ st) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (st == ''disarmed'' and notify_disarmed) or (st in [''armed_home'',''armed_away'']
          and notify_armed) }}'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          mensagem: '{{ mensagem }}'
          titulo: '{{ titulo }}'
  mode: queued
