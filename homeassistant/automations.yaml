- id: '1768246287199'
  alias: "\U0001F99F Desligar Repelentes"
  description: Desliga entidades de repelente selecionadas em um horário específico
    e notifica via Telegram se alguma estava ligada.
  triggers:
  - at: 07:00:00
    platform: time
  conditions: []
  actions:
  - variables:
      target_entities:
      - switch.escritorio_repelente_sonoff
      - switch.sala_de_tv_repelente_sonoff
      - switch.sala_de_jantar_repelente_sonoff
      - switch.brinquedoteca_repelente_sonoff
      - switch.quarto_cecilia_repelente_z2m
      - switch.suite_repelente_sonoff
      - switch.oficina_repelente_localtuya
      entities_currently_on: '{{ target_entities | select(''is_state'', ''on'') |
        list }}'
      friendly_names_desligadas: '{{ entities_currently_on | expand | map(attribute=''name'')
        | list }}'
      notification_message: "{% if (friendly_names_desligadas | count) > 0 %}\n  Os
        seguintes repelentes foram desligados: {{ friendly_names_desligadas | join(',
        ') }}.\n{% else %}\n  Nenhum repelente precisou ser desligado.\n{% endif %}"
  - data:
      level: info
      message: 'Debug Desligar Repelentes (Telegram) - Detalhes: - Horário de execução:
        {{ now().strftime(''%Y-%m-%d %H:%M:%S'') }} - Entidades configuradas (target_entities):
        {{ target_entities }} - Entidades atualmente ligadas (entities_currently_on):
        {{ entities_currently_on }} - Friendly Names dos repelentes ligados (friendly_names_desligadas):
        {{ friendly_names_desligadas }} - Contagem de repelentes ligados: {{ friendly_names_desligadas
        | count }} - Mensagem de notificação gerada: {{ notification_message }}

        '
    action: system_log.write
  - if:
    - condition: template
      value_template: '{{ (entities_currently_on | count) > 0 }}'
    then:
    - target:
        entity_id: '{{ entities_currently_on }}'
      action: homeassistant.turn_off
    - data:
        destinatarios:
        - Antonio
        titulo: "\U0001F99F Repelentes Desligados"
        mensagem: '{{ notification_message }}'
        parse_mode: MarkdownV2
      action: script.enviar_notificacao_telegram
  mode: single
