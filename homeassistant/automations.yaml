      max_tentativas: 30
- id: '1772216403231'
  alias: "\U0001F504 Recarregar - LocalTuya"
  description: Monitora os dispositivos Tuya. Se o LocalTuya cair, recarrega a integração
    e avisa no Telegram.
  use_blueprint:
    path: Antonio/recarregar_integracao.yaml
    input:
      target_entities:
      - cover.garagem_portao_maior_localtuya
      - light.suite_cabeceira_antonio_localtuya
      - light.suite_cabeceira_renata_localtuya
      telegram_destinatarios:
      - Antonio
      telegram_titulo: "\U0001F504 LocalTuya Reiniciado"
      tempo_entre_tentativas: 120
      max_tentativas: 30
      tempo_espera: 60
- id: '1772222074530'
  alias: "\U0001F5A5️ Alerta: Desktop Ligado"
  description: Monitora se o desktop está ligado sem presença no escritório por 30
    minutos. Envia alertas a cada 30 min no Telegram e App com botão para desligar.
  triggers:
  - entity_id: binary_sensor.escritorio_presenca_z2m_occupancy
    for: 00:30:00
    id: iniciar_alerta
    to: 'off'
    trigger: state
  - entity_id: switch.escritorio_desktop_sonoff
    for: 00:30:00
    id: iniciar_alerta
    to: 'on'
    trigger: state
  - event_data:
      data: /desligar_desktop
    event_type: telegram_callback
    id: telegram_desligar
    trigger: event
  - event_data:
      action: DESLIGAR_DESKTOP
    event_type: mobile_app_notification_action
    id: app_desligar
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: telegram_desligar
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.escritorio_desktop_sonoff
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_alerta }}'
          mensagem: O desktop foi desligado remotamente pelo Telegram.
          parse_mode: MarkdownV2
          titulo: "\U0001F50C Desktop Desligado"
    - conditions:
      - condition: trigger
        id: app_desligar
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.escritorio_desktop_sonoff
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_alerta }}'
          dados:
            channel: Avisos
            color: '#4CAF50'
            importance: high
            notification_icon: mdi:power-plug-off
            tag: desktop_esquecido_acao
          mensagem: O desktop foi desligado remotamente pelo Aplicativo.
          titulo: "\U0001F50C Desktop Desligado"
    - conditions:
      - condition: trigger
        id: iniciar_alerta
      - condition: state
        entity_id: switch.escritorio_desktop_sonoff
        state: 'on'
      - condition: state
        entity_id: binary_sensor.escritorio_presenca_z2m_occupancy
        for: 00:30:00
        state: 'off'
      sequence:
      - repeat:
          sequence:
          - action: script.enviar_notificacao_telegram
            data:
              destinatarios: '{{ destinatarios_alerta }}'
              inline_keyboard:
              - "\U0001F50C Desligar Desktop:/desligar_desktop"
              mensagem: O desktop do escritório está ligado sem presença há {{ repeat.index
                * 30 }} minutos.
              parse_mode: MarkdownV2
              titulo: ⚠️ Desktop Esquecido?
          - action: script.enviar_notificacao_app
            data:
              destinatarios: '{{ destinatarios_alerta }}'
              dados:
                actions:
                - action: DESLIGAR_DESKTOP
                  title: "\U0001F50C Desligar Desktop"
                channel: Avisos
                color: '#FF9800'
                importance: high
                notification_icon: mdi:desktop-tower
                tag: desktop_esquecido
              mensagem: O desktop do escritório está ligado sem presença há {{ repeat.index
                * 30 }} minutos.
              titulo: ⚠️ Desktop Esquecido?
          - timeout: 00:30:00
            wait_for_trigger:
            - entity_id: binary_sensor.escritorio_presenca_z2m_occupancy
              to: 'on'
              trigger: state
            - entity_id: switch.escritorio_desktop_sonoff
              to: 'off'
              trigger: state
          while:
          - condition: state
            entity_id: switch.escritorio_desktop_sonoff
            state: 'on'
          - condition: state
            entity_id: binary_sensor.escritorio_presenca_z2m_occupancy
            state: 'off'
  mode: restart
  variables:
    destinatarios_alerta:
    - antonio
    - renata
- id: '1772275176661'
  alias: "\U0001F6AA Automação: Luzes do Terreiro"
  description: Acende a luz da lavanderia ao abrir a porta à noite. Ao fechar, apaga
    luzes da lavanderia, terreiro, cozinha externa e oficina se o forno convecção
    estiver desligado.
  triggers:
  - entity_id: binary_sensor.cozinha_porta_terreiro_z2m_contact
    to: 'on'
    id: porta_abriu
    platform: state
  - entity_id: binary_sensor.cozinha_porta_terreiro_z2m_contact
    to: 'off'
    id: porta_fechou
    platform: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: porta_abriu
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.lavanderia_interruptor_lavanderia_z2m_l2_lavanderia
    - conditions:
      - condition: trigger
        id: porta_fechou
      - condition: state
        entity_id: binary_sensor.cozinha_externa_forno_convecao_ligado
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          area_id:
          - lavanderia
          - terreiro
          - cozinha_externa
          - oficina
        data: {}
  mode: restart
- id: '1772392565282'
  alias: "\U0001F6AA Aviso: Oficina Aberta"
  description: Avisa na Alexa da cozinha se a porta ou janela da oficina ficaram abertas
    ao fechar a porta do terreiro.
  triggers:
  - entity_id: binary_sensor.cozinha_porta_terreiro_z2m_contact
    to: 'off'
    platform: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.oficina_janela_z2m_contact
      state: 'on'
    - condition: state
      entity_id: binary_sensor.oficina_porta_z2m_contact
      state: 'on'
  actions:
  - action: script.enviar_notificacao_alexa
    data:
      dispositivos: cozinha
      volume: 0.4
      tipo: announce
      mensagem: "{% set janela = is_state('binary_sensor.oficina_janela_z2m_contact',
        'on') %} {% set porta = is_state('binary_sensor.oficina_porta_z2m_contact',
        'on') %} {% if janela and porta %}\n  Atenção! A porta e a janela da oficina
        ficaram abertas.\n{% elif janela %}\n  Atenção! A janela da oficina ficou
        aberta.\n{% elif porta %}\n  Atenção! A porta da oficina ficou aberta.\n{%
        endif %}"
  mode: single
- id: '1772490582219'
