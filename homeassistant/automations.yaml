    to:
    - 'off'
    trigger: state
  - entity_id:
    - climate.escritorio_ar_condicionado_localthings
    for:
      hours: 0
      minutes: 20
      seconds: 0
    id: iniciar_alerta
    to:
    - auto
    - cool
    - dry
    - fan_only
    trigger: state
  - event_data:
      data: /desligar_ac_escritorio
    event_type: telegram_callback
    id: telegram_desligar
    trigger: event
  - event_data:
      action: DESLIGAR_AC_ESCRITORIO
    event_type: mobile_app_notification_action
    id: app_desligar
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: telegram_desligar
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.escritorio_ar_condicionado_localthings
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_alerta }}'
          mensagem: O ar-condicionado do escritório foi desligado remotamente pelo
            Telegram.
          parse_mode: MarkdownV2
          titulo: ❄️ Ar-condicionado desligado
    - conditions:
      - condition: trigger
        id: app_desligar
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.escritorio_ar_condicionado_localthings
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_alerta }}'
          dados:
            actions:
            - action: DESLIGAR_AC_ESCRITORIO
