- id: '1769455729722'
  alias: "\U0001F9F9\U0001F514 Alarme — Restaurar alertas ao armar/desarmar"
  description: Sempre que o painel mudar para estados de armar/desarmar (armed_*,
    arming, pending, disarmed), restaura o boolean de silenciar alertas. Assim, no
    próximo disparo, volta a notificar.
  triggers:
  - entity_id:
    - alarm_control_panel.alarme_hikvision_axpro
    to:
    - triggered
    - armed_away
    - armed_home
    - armed_vacation
    - armed_night
    - arming
    - armed_custom_bypass
    - disarmed
    - disarming
    - pending
    platform: state
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.casa_alarme_alerta_silenciado
    data: {}
  mode: single
- id: '1769459924425'
  alias: "\U0001F6A8\U0001F6E1️ Alarme — Disparado (repetir + botões)"
  description: 'Quando o AX Pro entra em ''triggered'', envia alerta no Telegram repetidamente
    até o alarme ser desativado OU até silenciar os alertas (vale só até o próximo
    disparo). Inclui botões: Desativar alarme e Silenciar alerta.'
  triggers:
  - entity_id: alarm_control_panel.alarme_hikvision_axpro
    to: triggered
    id: alarm_triggered
    platform: state
  - event_type: telegram_callback
    event_data:
      command: /alarme_desativar
    id: telegram_desativar
    platform: event
  - event_type: telegram_callback
    event_data:
      command: /alarme_silenciar
    id: telegram_silenciar
    platform: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm_triggered
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.casa_alarme_alerta_silenciado
      - action: script.turn_on
        target:
          entity_id: script.alarme_piscar_cabeceira_vermelho
      - action: script.turn_on
        target:
          entity_id: script.alarme_loop_de_alertas_telegram
    - conditions:
      - condition: trigger
        id: telegram_silenciar
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.casa_alarme_alerta_silenciado
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          titulo: '*Alarme — Alertas Silenciados*'
          mensagem: "\U0001F515 OK. Vou parar de repetir os alertas até o próximo
            disparo."
    - conditions:
      - condition: trigger
        id: telegram_desativar
      sequence:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id:
          - alarm_control_panel.alarme_hikvision_axpro
        data: {}
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          titulo: '*Alarme — Comando Enviado*'
          mensagem: ✅ Comando para desativar o alarme enviado.
      - delay: 00:00:06
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''alarm_control_panel.alarme_hikvision_axpro'',
              ''triggered'') }}'
          - condition: state
            entity_id: input_boolean.casa_alarme_alerta_silenciado
            state: 'off'
          sequence:
          - action: script.enviar_notificacao_telegram
            data:
              destinatarios: antonio
              titulo: '*Alarme — Falha ao Desativar*'
              mensagem: ⚠️ Tentei desativar, mas o alarme ainda está dispar. Vou continuar
                alertando.
          - action: script.turn_on
            target:
              entity_id: script.alarme_piscar_cabeceira_vermelho
          - action: script.turn_on
            target:
              entity_id: script.alarme_loop_de_alertas_telegram
  mode: restart
- id: '1769805144806'
  alias: "\U0001F4A7 Válvula Água: Alerta Fechada"
  description: Verifica a cada 4 horas se a válvula está fechada e envia notificação
    com botão. Também escuta o clique do botão no Telegram/App para abrir a válvula.
  triggers:
  - hours: /4
    id: checar_valvula
    platform: time_pattern
  - event_type: telegram_callback
    event_data:
      command: /abrir_valvula_alerta
    id: telegram_abrir
    platform: event
  - event_type: mobile_app_notification_action
    event_data:
      action: ALERTA_ABRIR_VALVULA
    id: app_abrir
    platform: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: checar_valvula
      - condition: time
        after: 08:00:00
        before: '20:01:00'
      - condition: state
        entity_id: valve.casa_valvula_agua_z2m
        state: closed
      sequence:
      - variables:
          mensagem_alerta: A válvula de água está atualmente *fechada*. Deseja abri-la
            agora?
          teclado_telegram: "\U0001F6B0 Abrir válvula:/abrir_valvula_alerta\n"
          botoes_app: '{% set actions = [] %}  {% set actions = actions + [{''action'':
            ''ALERTA_ABRIR_VALVULA'', ''title'': ''✅ Abrir válvula''}] %} {{ actions
            }}

            '
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_alerta }}'
          mensagem: '{{ mensagem_alerta }}'
          parse_mode: MarkdownV2
          inline_keyboard: '{{ teclado_telegram }}'
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_alerta }}'
          mensagem: '{{ mensagem_alerta }}'
          dados:
            tag: casa_valvula_agua_z2m_fechada_alerta
            channel: Água
            importance: high
            notification_icon: '{{ icon_alerta }}'
            color: '{{ color_alerta }}'
            actions: '{{ botoes_app }}'
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: telegram_abrir
        - condition: trigger
          id: app_abrir
      sequence:
      - action: valve.open_valve
        target:
          entity_id: valve.casa_valvula_agua_z2m
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula aberta com sucesso pelo alerta.
          parse_mode: MarkdownV2
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula aberta com sucesso pelo alerta.
          dados:
            tag: casa_valvula_agua_z2m_fechada_alerta
            channel: Água
            importance: high
            notification_icon: '{{ icon_ok }}'
            color: '{{ color_ok }}'
  mode: single
  variables:
    destinatarios_agua:
    - antonio
    - renata
    titulo_alerta: "\U0001F4A7 Válvula: Alerta"
    titulo_acao: "\U0001F4A7 Válvula: Ação"
    icon_alerta: mdi:water-off
    icon_ok: mdi:water-check
    color_alerta: '#D32F2F'
    color_ok: '#4CAF50'
- id: '1769817870805'
  alias: "\U0001F697 Portão Garagem Maior: Monitoramento"
  description: 'Monitora portão aberto, gerencia alertas via boolean e notifica fechamento
