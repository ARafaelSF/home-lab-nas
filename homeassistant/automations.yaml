- id: '1776980929972'
  alias: '⛽ Gás — Vazamento: Alexa, válvula e Telegram'
  description: 'Fumaça na cozinha (binary_sensor.cozinha_alarme_fumaca_z2m_smoke).
    Echo: sim = cancela fechamento; caso contrário ou 16s = fechar registo e avisar
    no Telegram (antonio).'
  triggers:
  - platform: state
    entity_id: binary_sensor.cozinha_alarme_fumaca_z2m_smoke
    to: 'on'
  actions:
  - target:
      entity_id: script.alexa_actionable_notification
    data:
      variables:
        text: Atenção, foi detectada fumaça na cozinha. Vou fechar o registro de gás.
          Deseja cancelar a ação?
        event_id: gas_vazamento_cozinha
        alexa_device: media_player.cozinha_echo_mediaplayer
        suppress_confirmation: 'true'
    action: script.turn_on
  - wait_for_trigger:
    - event_type: alexa_actionable_notification
      event_data:
        event_id: gas_vazamento_cozinha
      trigger: event
    timeout:
      seconds: 16
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ (wait is defined) and (wait.trigger is not none) and (wait.trigger.event
        is defined) and (wait.trigger.event.data.get(''event_response_type'', '''')
        == ''ResponseYes'') }}'
    then:
    - action: script.enviar_notificacao_alexa
      data:
        dispositivos: cozinha
        mensagem: Não vou fechar o registo de gás. O fechamento foi cancelado.
        tipo: tts
    - action: script.enviar_notificacao_telegram
      data:
        destinatarios: antonio
        parse_mode: MarkdownV2
        titulo: ⛽ Gás — vazamento
        mensagem: Fechamento do registo de gás *cancelado*.
    else:
    - action: switch.turn_off
      target:
        entity_id: valve.casa_valvula_gas_z2m
    - action: script.enviar_notificacao_telegram
      data:
        destinatarios: antonio
        parse_mode: MarkdownV2
        titulo: ⛽ Gás — vazamento
        mensagem: O registo de gás foi *fechado* por segurança.
  mode: single
- id: '1777204504177'
  alias: "\U0001FA9F Cortinas: fechar ao armar alarme"
