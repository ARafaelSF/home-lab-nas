  description: Liga os monitores quando o desktop liga e desliga quando o desktop
    fica desligado por 10 segundos. Desligar os monitores manualmente nao afeta o
    desktop (apenas o desktop dispara esta automacao).
  triggers:
  - entity_id: switch.escritorio_desktop_sonoff
    to: 'on'
    id: desktop_ligado
    trigger: state
  - entity_id: switch.escritorio_desktop_sonoff
    to: 'off'
    for: 00:00:10
    id: desktop_desligado
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.escritorio_desktop_sonoff
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.escritorio_monitores_tasmota
    - conditions:
      - condition: state
        entity_id: switch.escritorio_desktop_sonoff
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.escritorio_monitores_tasmota
  mode: single
- id: '1779719512347'
  alias: "\U0001F5A5️ Homelab: Serviço offline (Uptime Kuma)"
  description: Quando o Uptime Kuma deteta um serviço do homelab fora do ar, envia
    alerta no Telegram e na app só para o António (webhook local).
  triggers:
  - platform: webhook
    webhook_id: uptime_kuma_homelab
    allowed_methods:
    - POST
    local_only: true
    id: kuma_webhook
  conditions:
  - condition: template
    value_template: "{{ trigger.json.msg is defined and ('Down' in trigger.json.msg
      or '\U0001F534' in trigger.json.msg) }}"
  actions:
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: '{{ destinatarios_homelab }}'
      titulo: "\U0001F5A5️ Homelab — offline"
      mensagem: '{{ trigger.json.msg }}'
  - action: script.enviar_notificacao_app
    data:
      destinatarios: '{{ destinatarios_homelab }}'
      titulo: "\U0001F5A5️ Homelab — offline"
      mensagem: '{{ trigger.json.msg }}'
      dados:
        tag: homelab_offline
        channel: Homelab
        importance: high
        notification_icon: mdi:cloud-alert
        color: '#D32F2F'
  - action: persistent_notification.create
    data:
      title: Homelab — offline
      message: '{{ trigger.json.msg }}'
  mode: queued
  variables:
    destinatarios_homelab:
    - antonio
