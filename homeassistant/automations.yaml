      telegram_titulo: "\U0001F504 SmartThings Reiniciado"
      tempo_espera: 30
      max_tentativas: 30
- id: '1772216206246'
  alias: "\U0001F504 Recarregar - Hikvision"
  description: Monitora os sensores do alarme. Se o Hikvision cair, recarrega a integração
