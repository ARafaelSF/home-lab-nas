    destinatarios:
    - antonio
    - renata
    alexa_alvos:
    - cozinha
    titulo_alerta: "\U0001F9CA Geladeira: porta refrigerador aberta"
    titulo_ok: "\U0001F9CA Geladeira: porta refrigerador fechada"
    titulo_silencio: "\U0001F9CA Geladeira: alertas porta refrigerador silenciados"
    teclado_telegram: "\U0001F515 Interromper notificações:/geladeira_porta_refri_silenciar"
- id: '1787676624713'
  alias: "\U0001F9CA Geladeira Midea — Porta freezer aberta"
  description: 'Após 1 min com a porta do freezer aberta: Telegram (Antonio/Renata)
    + Echo Cozinha; repete a cada 5 min. Botão silencia até o próximo evento.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.cozinha_geladeira_midea_porta_freezer
    to:
    - 'on'
    for:
      minutes: 1
    id: condicao_ativa
  - trigger: state
    entity_id: binary_sensor.cozinha_geladeira_midea_porta_freezer
    to: 'off'
    id: condicao_ok
  - trigger: time_pattern
    minutes: /1
    id: watchdog
  - trigger: event
    event_type: telegram_callback
    event_data:
      command: /geladeira_porta_freezer_silenciar
    id: silenciar
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: silenciar
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_ativo
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios }}'
          titulo: '{{ titulo_silencio }}'
          mensagem: "\U0001F515 OK. Vou parar de repetir os alertas da porta do freezer
            até o próximo evento."
          parse_mode: MarkdownV2
    - conditions:
      - condition: trigger
        id: condicao_ok
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_ativo
          state: 'on'
        - condition: state
          entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
          state: 'on'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios }}'
          titulo: '{{ titulo_ok }}'
          mensagem: ✅ A porta do freezer foi fechada.
          parse_mode: MarkdownV2
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.geladeira_midea_alerta_porta_freezer_ativo
          - input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: condicao_ok
        - condition: and
          conditions:
          - condition: trigger
            id: watchdog
          - condition: state
            entity_id: binary_sensor.cozinha_geladeira_midea_porta_freezer
            state: 'off'
            for: 00:02:00
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.geladeira_midea_alerta_porta_freezer_ativo
          - input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: condicao_ativa
        - condition: and
          conditions:
          - condition: trigger
            id: watchdog
          - condition: state
            entity_id: binary_sensor.cozinha_geladeira_midea_porta_freezer
            state: 'on'
            for: 00:01:00
      - condition: state
        entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_ativo
        state: 'off'
      - condition: state
        entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
        state: 'off'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_ativo
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.cozinha_geladeira_midea_porta_freezer
            state: 'on'
          - condition: state
            entity_id: input_boolean.geladeira_midea_alerta_porta_freezer_silenciado
            state: 'off'
          sequence:
          - variables:
              last_changed: '{{ states.binary_sensor.cozinha_geladeira_midea_porta_freezer.last_changed
                }}'
              tempo_seg: '{{ (as_timestamp(now()) - as_timestamp(last_changed, 0))
                | int }}'
              tempo_min: '{{ (tempo_seg // 60) | int }}'
              horas: '{{ (tempo_min // 60) | int }}'
              minutos: '{{ (tempo_min % 60) | int }}'
              mensagem_tempo: '{% if tempo_seg < 3600 %}{{ tempo_min }} minuto{{ ''s''
                if tempo_min != 1 else '''' }}{% else %}{{ horas }} hora{{ ''s'' if
                horas != 1 else '''' }}{% if minutos > 0 %} e {{ minutos }} minuto{{
                ''s'' if minutos != 1 else '''' }}{% endif %}{% endif %}'
              mensagem_alerta: ⚠️ A porta do freezer está *aberta* há {{ mensagem_tempo
                }}!
              mensagem_alexa: Atenção. A porta do freezer está aberta há {{ mensagem_tempo
                }}.
          - action: script.enviar_notificacao_alexa
            data:
              dispositivos: '{{ alexa_alvos }}'
              mensagem: '{{ mensagem_alexa }}'
              tipo: announce
          - action: script.enviar_notificacao_telegram
            data:
              destinatarios: '{{ destinatarios }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta }}'
              parse_mode: MarkdownV2
              inline_keyboard: '{{ teclado_telegram }}'
          - wait_for_trigger:
            - trigger: event
              event_type: telegram_callback
              event_data:
                command: /geladeira_porta_freezer_silenciar
            - trigger: state
              entity_id: binary_sensor.cozinha_geladeira_midea_porta_freezer
              to: 'off'
            timeout:
              minutes: 5
            continue_on_timeout: true
  mode: parallel
  max: 10
  variables:
    destinatarios:
    - antonio
    - renata
    alexa_alvos:
    - cozinha
    titulo_alerta: "\U0001F9CA Geladeira: porta freezer aberta"
    titulo_ok: "\U0001F9CA Geladeira: porta freezer fechada"
    titulo_silencio: "\U0001F9CA Geladeira: alertas porta freezer silenciados"
    teclado_telegram: "\U0001F515 Interromper notificações:/geladeira_porta_freezer_silenciar"
- id: '1787750449606'
  alias: "\U0001F372 Cozinha — Termocirculador sync duração h/min"
  description: Mantém duração total (min) alinhada com os helpers de horas e minutos
    do dash.
  triggers:
  - trigger: state
    entity_id:
    - input_number.termocirculador_duracao_horas
    - input_number.termocirculador_duracao_minutos
    id: ui_hm
  - trigger: state
    entity_id: input_number.cozinha_termocirculador_duracao
    id: total_min
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ui_hm
      sequence:
      - variables:
          total: '{{ [[(states(''input_number.termocirculador_duracao_horas'') | int(0))
            * 60 + (states(''input_number.termocirculador_duracao_minutos'') | int(0)),
            1] | max, 1440] | min }}'
      - if:
        - condition: template
          value_template: '{{ (states(''input_number.cozinha_termocirculador_duracao'')
            | int(0)) != (total | int) }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.cozinha_termocirculador_duracao
          data:
            value: '{{ total }}'
    - conditions:
      - condition: trigger
        id: total_min
      sequence:
      - variables:
          m: '{{ [[states(''input_number.cozinha_termocirculador_duracao'') | int(1),
            1] | max, 1440] | min }}'
          h: '{{ (m | int) // 60 }}'
          mm: '{{ (m | int) % 60 }}'
      - if:
        - condition: template
          value_template: '{{ (states(''input_number.termocirculador_duracao_horas'')
            | int(-1)) != (h | int) }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.termocirculador_duracao_horas
          data:
            value: '{{ h }}'
      - if:
        - condition: template
          value_template: '{{ (states(''input_number.termocirculador_duracao_minutos'')
            | int(-1)) != (mm | int) }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.termocirculador_duracao_minutos
          data:
            value: '{{ mm }}'
  mode: restart
- id: '1788267226108'
  alias: "\U0001F504 Recarregar - LocalThings"
  description: Monitora os ar-condicionados Samsung (LocalThings). Se algum ficar
    indisponível, recarrega a integração e avisa no Telegram.
  use_blueprint:
    input:
      max_tentativas: 30
      target_entities:
      - climate.escritorio_ar_condicionado_localthings
      - climate.suite_ar_condicionado_localthings
      - climate.sala_de_tv_ar_condicionado_localthings
      telegram_destinatarios:
      - Antonio
      telegram_titulo: "\U0001F504 LocalThings Reiniciado"
      tempo_entre_tentativas: 120
      tempo_espera: 60
    path: Antonio/recarregar_integracao.yaml
- id: '1788439379199'
  alias: "\U0001F4E1 SLZB — Marcar mudança Ethernet"
  description: Grava o timestamp quando o botão for pressionado ou quando o modo de
    conexão do SLZB mudar para eth — marcador para comparar temperatura USB vs Ethernet
    no Influx/Grafana.
  triggers:
  - trigger: state
    entity_id: input_button.slzb_marcar_mudanca_ethernet
    id: botao
  - trigger: state
    entity_id: sensor.slzb_06_connection_mode
    to: eth
    id: modo_eth
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.slzb_mudanca_para_ethernet
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.slzb_ja_mudou_para_ethernet
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      titulo: "\U0001F4E1 SLZB → Ethernet"
      mensagem: Marcador USB→Ethernet gravado em {{ now().strftime('%d/%m/%Y %H:%M')
        }}. Use esse ponto no Grafana para comparar temperatura e quedas.
      parse_mode: MarkdownV2
  mode: single
- id: '1788439379959'
  alias: "\U0001F321️ SLZB — Temperatura alta"
  description: Avisa quando a temperatura do chip Core do SLZB-06 fica acima do limiar
    (threshold helper) por 10 minutos — útil enquanto coleta baseline USB e após mudar
    para Ethernet.
  triggers:
  - trigger: state
    entity_id: binary_sensor.sistema_slzb_06_slzb_core_temp_alta
    to: 'on'
    for:
      minutes: 10
  actions:
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      titulo: "\U0001F321️ SLZB temperatura alta"
      mensagem: 'Core: {{ states(''sensor.slzb_06_core_chip_temp'') }}°C · Zigbee:
        {{ states(''sensor.slzb_06_zigbee_chip_temp'') }}°C · Modo: {{ states(''sensor.slzb_06_connection_mode'')
        }}'
      parse_mode: MarkdownV2
  mode: single
- id: '1788441209362'
  alias: "\U0001F512 Câmeras internas — Internet Tapo (60 min)"
  description: Liga/desliga a regra UniFi 'Cameras Internas → Bloquear WAN'. Interruptor
    ON libera internet por 60 minutos; OFF ou fim do timer volta a bloquear.
  triggers:
  - id: liberar
    trigger: state
    entity_id: input_boolean.cameras_internas_internet_tapo
    to: 'on'
  - id: bloquear
    trigger: state
    entity_id: input_boolean.cameras_internas_internet_tapo
    to: 'off'
  - id: timer_fim
    trigger: timer.finished
    target:
      entity_id: timer.cameras_internas_internet
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: liberar
      sequence:
      - action: shell_command.cameras_internas_wan_allow
      - action: timer.start
        target:
          entity_id: timer.cameras_internas_internet
        data:
          duration: 01:00:00
    - conditions:
      - condition: trigger
        id: bloquear
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.cameras_internas_internet
      - action: shell_command.cameras_internas_wan_block
    - conditions:
      - condition: trigger
        id: timer_fim
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cameras_internas_internet_tapo
  mode: restart
- id: '1788470156952'
  alias: "\U0001F321️ Inkbird — Alarme de temperatura (Telegram)"
  description: Notifica Antonio no Telegram quando qualquer alarme de temperatura
    do Inkbird IHT-2PB dispara (ambiente, sonda 1 ou sonda 2).
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.inkbird_iht_2pb_built_in_temperature_alarm
    - binary_sensor.inkbird_iht_2pb_external_1_temperature_alarm
    - binary_sensor.inkbird_iht_2pb_external_2_temperature_alarm
    to: 'on'
  conditions: []
  actions:
  - variables:
      eid: '{{ trigger.entity_id }}'
      canal: '{% if ''built_in'' in trigger.entity_id %}Ambiente{% elif ''external_1''
        in trigger.entity_id %}Sonda 1{% else %}Sonda 2{% endif %}'
      temp_eid: '{% if ''built_in'' in trigger.entity_id %}sensor.inkbird_iht_2pb_built_in_temperature{%
        elif ''external_1'' in trigger.entity_id %}sensor.inkbird_iht_2pb_external_1_temperature{%
        else %}sensor.inkbird_iht_2pb_external_2_temperature{% endif %}'
      alvo_eid: '{% if ''built_in'' in trigger.entity_id %}sensor.inkbird_iht_2pb_built_in_target_high_temperature{%
        elif ''external_1'' in trigger.entity_id %}sensor.inkbird_iht_2pb_external_1_target_high_temperature{%
        else %}sensor.inkbird_iht_2pb_external_2_target_high_temperature{% endif %}'
      temp: '{{ states(temp_eid) }}'
      alvo: '{{ states(alvo_eid) }}'
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      titulo: "\U0001F321️ *Inkbird — Alarme*"
      mensagem: '⚠️ Alarme no canal *{{ canal }}*.

        Temperatura: *{{ temp }} °C*

        Alvo: *{{ alvo }} °C*'
  mode: queued
- id: '1788520682469'
  alias: "\U0001F697 Garagem: portão da rua — monitorização"
  description: 'Avisa se o portão da rua (sensor Zigbee) ficar aberto. Sem comando
    de fechar — só há contacto, não há motor no HA.


    Alerta após 2 min aberto (igual aos portões maior/menor). Reenvia a cada 5 min
    enquanto continuar aberto. Notifica fechamento só se o alerta estava ativo.'
  triggers:
  - id: portao_aberto_tempo
    trigger: door.opened
    target:
      entity_id: binary_sensor.garagem_portao_rua_z2m_contact
    options:
      for: 00:02:00
  - id: portao_fechou
    trigger: door.closed
    target:
      entity_id: binary_sensor.garagem_portao_rua_z2m_contact
  - id: watchdog
    trigger: time_pattern
    minutes: /1
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: portao_fechou
      - condition: state
        entity_id: input_boolean.garagem_portao_rua_alerta_ativo
        state: 'on'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_portao }}'
          titulo: '{{ titulo_sucesso }}'
          mensagem: ✅ O portão da rua foi fechado.
          cameras: '{{ cameras_alerta }}'
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_portao }}'
          titulo: '{{ titulo_sucesso }}'
          mensagem: O portão da rua foi fechado.
          dados:
            tag: portao_rua_aberto_alerta
            color: '{{ color_sucesso_app }}'
            notification_icon: '{{ icon_sucesso_app }}'
            timeout: 60
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garagem_portao_rua_alerta_ativo
    - conditions:
      - condition: trigger
        id: watchdog
      - condition: state
        entity_id: binary_sensor.garagem_portao_rua_z2m_contact
        state: 'off'
        for: 00:02:00
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garagem_portao_rua_alerta_ativo
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: portao_aberto_tempo
        - condition: and
          conditions:
          - condition: trigger
            id: watchdog
          - condition: state
            entity_id: binary_sensor.garagem_portao_rua_z2m_contact
            state: 'on'
            for: 00:02:00
      - condition: state
        entity_id: input_boolean.garagem_portao_rua_alerta_ativo
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garagem_portao_rua_alerta_ativo
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.garagem_portao_rua_z2m_contact
            state: 'on'
          sequence:
          - variables:
              last_changed: '{{ states.binary_sensor.garagem_portao_rua_z2m_contact.last_changed
                }}'
              tempo_aberto_seg: '{{ (as_timestamp(now()) - as_timestamp(last_changed,
                0)) | int }}'
              tempo_aberto_min: '{{ (tempo_aberto_seg // 60) | int }}'
              horas: '{{ (tempo_aberto_min // 60) | int }}'
              minutos: '{{ (tempo_aberto_min % 60) | int }}'
              mensagem_tempo: '{% if tempo_aberto_seg < 3600 %}{{ tempo_aberto_min
                }} minuto{{ ''s'' if tempo_aberto_min != 1 else '''' }}{% else %}{{
                horas }} hora{{ ''s'' if horas != 1 else '''' }}{%- if minutos > 0
                %} e {{ minutos }} minuto{{ ''s'' if minutos != 1 else '''' }}{%-
                endif %}{% endif %}'
              mensagem_alerta_dinamica: ⚠️ O Portão da Rua está *aberto* há {{ mensagem_tempo
                }}!
              mensagem_alexa: Atenção. O Portão da Rua está aberto há {{ mensagem_tempo
                }}.
          - action: script.enviar_notificacao_alexa
            data:
              dispositivos: '{{ alexa_alvos }}'
              mensagem: '{{ mensagem_alexa }}'
              tipo: announce
          - action: script.enviar_notificacao_telegram
            data:
              destinatarios: '{{ destinatarios_portao }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta_dinamica }}'
              parse_mode: MarkdownV2
              cameras: '{{ cameras_alerta }}'
          - action: script.enviar_notificacao_app
            data:
              destinatarios: '{{ destinatarios_portao }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta_dinamica }}'
              dados:
                tag: portao_rua_aberto_alerta
                channel: Garagem
                importance: high
                notification_icon: '{{ icon_alerta_app }}'
                color: '{{ color_alerta_app }}'
          - wait_for_trigger:
            - trigger: door.closed
              target:
                entity_id: binary_sensor.garagem_portao_rua_z2m_contact
            timeout:
              minutes: 5
            continue_on_timeout: true
  mode: parallel
  max: 10
  variables:
    destinatarios_portao:
    - antonio
    - renata
    alexa_alvos:
    - sala
    - cozinha
    - escritório
    - oficina
    - brinquedoteca
    titulo_alerta: "\U0001F697 Portão da Rua: Alerta"
    titulo_sucesso: "\U0001F697 Portão da Rua: Fechado"
    icon_alerta_app: mdi:gate-alert
    icon_sucesso_app: mdi:gate
    color_alerta_app: '#FFC107'
    color_sucesso_app: '#4CAF50'
    cameras_alerta:
    - camera.camera_portao_hd_stream
    - camera.camera_garagem_hd_stream
- id: '1788558698862'
  alias: Pirata Cecília - Atualizar tempo restante
  description: Atualiza o tempo restante do timer a cada segundo enquanto a sessão
    está ativa ou pausada. O atributo remaining do timer não conta regressivamente;
    o cálculo usa finishes_at.
  triggers:
  - trigger: time_pattern
    seconds: /1
    id: tick
  - trigger: state
    entity_id: timer.pirata_cecilia_sessao
    id: sync
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: timer.pirata_cecilia_sessao
      state:
      - active
      - paused
    - condition: trigger
      id: sync
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.pirata_cecilia_tempo_restante
    data:
      value: "{% set t = 'timer.pirata_cecilia_sessao' %}\n{% set st = states(t) %}\n{%
        if st == 'active' and state_attr(t, 'finishes_at') %}\n  {% set secs = [(as_timestamp(state_attr(t,
        'finishes_at')) - as_timestamp(now())) | int, 0] | max %}\n  {% set h = secs
        // 3600 %}\n  {% set m = (secs % 3600) // 60 %}\n  {% set s = secs % 60 %}\n
        \ {{ '%d:%02d:%02d' % (h, m, s) }}\n{% elif st == 'paused' and state_attr(t,
        'remaining') %}\n  {{ state_attr(t, 'remaining') }}\n{% else %}\n  —\n{% endif
        %}"
  mode: single
- id: '1788558999225'
  alias: "\U0001F504 Recarregar - Alexa Devices (listas)"
  description: 'Quando as listas Alexa (todo.lista_*) ficarem unavailable, recarrega
    alexa_devices e avisa no Telegram (Antonio). Contagem: counter.alexa_devices_quedas_das_listas.'
  use_blueprint:
    input:
      max_tentativas: 10
      target_entities:
      - todo.lista_compras
      - todo.lista_principal
      - todo.lista_congelador
      - todo.lista_filmes
      - todo.lista_remedios
      - todo.lista_escritorio
      - todo.lista_home_assistant
      telegram_destinatarios:
      - Antonio
      telegram_mensagem: "⚠️ As __DISPOSITIVOS__ ficaram indisponíveis.\n\n\U0001F504
        A tentar recarregar a integração __INTEGRACAO__."
      telegram_texto_botao: "\U0001F6D1 Cancelar Tentativas"
      telegram_titulo: "\U0001F504 Alexa Devices (listas) reiniciada"
      tempo_entre_tentativas: 120
      tempo_espera: 60
    path: Antonio/recarregar_integracao.yaml
- id: '1788561513188'
  alias: "\U0001F4A7 Pressurizador — corte por limite de tempo (Telegram)"
  description: Notifica o Antonio no Telegram quando o ESPHome corta a bomba por limite
    de 10 min (evento esphome.caixa_dagua_pressurizador_timeout).
  triggers:
  - event_data:
      motivo: limite_tempo
    event_type: esphome.caixa_dagua_pressurizador_timeout
    id: esphome_timeout
    trigger: event
  actions:
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      mensagem: A bomba pressurizadora foi *desligada automaticamente* após o limite
        de *10 minutos*.
      parse_mode: MarkdownV2
      titulo: "\U0001F4A7 Pressurizador — limite de tempo"
  mode: single
- id: '1788568108628'
  alias: "\U0001F522 Contador — quedas Alexa Devices (listas)"
  description: Incrementa counter.alexa_devices_quedas_das_listas uma vez por incidente
    (quando lista_compras fica unavailable por 60s). Usa uma lista como proxy para
    não contar 7 vezes a mesma queda da integração.
  triggers:
  - entity_id: todo.lista_compras
    for:
      seconds: 60
    id: lista_caiu
    to: unavailable
    trigger: state
  actions:
  - action: counter.increment
    target:
      entity_id: counter.alexa_devices_quedas_das_listas
  mode: single
- id: '1788609532883'
  alias: "\U0001F4A7 Rega — Tentar novamente (Telegram/App)"
  description: Botão persistente nas falhas de rega. Não usa wait — /rega_retry ou
    REGA_RETRY podem ser premidos horas depois.
  triggers:
  - trigger: event
    event_type: telegram_callback
    event_data:
      command: /rega_retry
    id: telegram
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: REGA_RETRY
    id: app
  conditions: []
  actions:
  - action: telegram_bot.answer_callback_query
    continue_on_error: true
    data:
      callback_query_id: '{{ trigger.event.data.id if trigger.id == ''telegram'' else
        '''' }}'
      message: A tentar novamente…
  - action: script.rega_executar_retry
  mode: queued
- id: '1788624260937'
  alias: "\U0001F4A7 Água — monitorar retorno (falta de água)"
  description: Botão na dash Água ativa o monitoramento. Ao consumir mais de 30 L
    no hidrômetro desde a ativação, notifica Antonio e Renata e desliga o monitoramento
    automaticamente.
  triggers:
  - trigger: state
    entity_id: input_boolean.monitorar_retorno_da_agua
    to: 'on'
    id: iniciar
  - trigger: numeric_state
    entity_id: sensor.casa_hidrometro_entrada_agua_desde_monitoramento_retorno
    above: 30
    id: agua_voltou
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: iniciar
      sequence:
      - action: utility_meter.reset
        target:
          entity_id: sensor.casa_hidrometro_entrada_agua_desde_monitoramento_retorno
      - action: input_number.set_value
        target:
          entity_id: input_number.agua_leitura_inicio_monitoramento
        data:
          value: '{{ states(''sensor.casa_agua'') | float(0) }}'
    - conditions:
      - condition: trigger
        id: agua_voltou
      - condition: state
        entity_id: input_boolean.monitorar_retorno_da_agua
        state: 'on'
      sequence:
      - action: script.enviar_notificacao_app
        data:
          destinatarios:
          - antonio
          - renata
          titulo: "\U0001F4A7 Água voltou"
          mensagem: Consumo passou de 30 L desde o início do monitoramento. A água
            parece ter voltado.
          dados:
            tag: agua_retorno
            channel: Água
            importance: high
            notification_icon: mdi:water-check
            color: '#1E88E5'
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios:
          - antonio
          - renata
          titulo: "\U0001F4A7 Água voltou"
          mensagem: Consumo passou de 30 L desde o início do monitoramento. A água
            parece ter voltado.
          parse_mode: MarkdownV2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.monitorar_retorno_da_agua
  mode: single
- id: docker_ops_update_result_20260907
  alias: "\U0001F433 Docker — resultado da atualização (ops.sh)"
  description: Webhook local do listener no host Docker quando ops.sh termina.
  mode: queued
  triggers:
  - platform: webhook
    webhook_id: docker_ops_update_result
    allowed_methods:
    - POST
    local_only: true
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.sistema_docker_atualizacao_em_curso
  - variables:
      ok: '{{ trigger.json.ok | default(false) }}'
      app: '{{ trigger.json.app | default(''?'') }}'
      nome: '{{ trigger.json.nome | default(app) }}'
      resumo: '{{ trigger.json.summary | default(trigger.json.message | default(''''))
        }}'
      detalhe: '{{ trigger.json.message | default('''') }}'
  - action: persistent_notification.create
    data:
      title: Docker — {{ nome }}
      message: '{{ resumo }}'
      notification_id: docker_ops_update
  - delay:
      seconds: 3
  - action: script.enviar_notificacao_telegram
    continue_on_error: true
    data:
      destinatarios: antonio
      titulo: "{% set ok_flag = trigger.json.ok is true or trigger.json.ok | string
        | lower == 'true' %}{{ '\U0001F433 Docker' if ok_flag else '\U0001F433 Docker:
        problema' }}"
      mensagem: '{{ resumo }}'
      parse_mode: html
- id: '20260908130200'
  alias: AdGuard backup — espelhar protecção
  description: O switch do HA só controla o AdGuard oficial (192.168.3.21). Replica
    o mesmo estado no Pi (192.168.3.22). Se o Pi estiver offline, ignora o erro.
  mode: queued
  max: 3
  triggers:
  - trigger: state
    entity_id: switch.adguard_home_protecao
    to:
    - 'on'
    - 'off'
  conditions: []
  actions:
  - action: rest_command.adguard_backup_protection
    continue_on_error: true
    data:
      is_on: '{{ trigger.to_state.state == ''on'' }}'
