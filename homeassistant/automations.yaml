- id: '1773225522519'
  alias: "\U0001F4BE Verificação Diária de Backup Local"
  description: Verifica diariamente às 8h se o backup local foi realizado com sucesso.
  triggers:
  - at: '10:04:00'
    trigger: time
  conditions: []
  actions:
  - variables:
      ultimo_backup_sucesso_str: '{{ states(''sensor.backup_last_successful_automatic_backup'')
        }}'
      hoje_date_str: '{{ now().strftime(''%Y-%m-%d'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set backup_datetime = as_datetime(ultimo_backup_sucesso_str)
          if ultimo_backup_sucesso_str is not none and ultimo_backup_sucesso_str !=
          ''unavailable'' else none %} {% set backup_date_str = backup_datetime.strftime(''%Y-%m-%d'')
          if backup_datetime is not none else none %} {{ backup_date_str is none or
          backup_date_str != hoje_date_str }}'
      sequence:
      - data:
          destinatarios: antonio
          titulo: "\U0001F6A8 Falha no Backup Home Assistant"
          mensagem: "O backup local não foi realizado com sucesso no dia de hoje.
            Último backup bem-sucedido registrado: {%- if ultimo_backup_sucesso_str
            is not none and ultimo_backup_sucesso_str != 'unavailable' -%}\n  {{ (as_datetime(ultimo_backup_sucesso_str)
            | as_local).strftime('%d/%m/%Y às %H:%M') }}\n{%- else -%}\n  N/A\n{%-
            endif -%}. Verifique a integração de backup."
          parse_mode: MarkdownV2
        action: script.enviar_notificacao_telegram
    - conditions:
      - condition: template
        value_template: '{% set backup_datetime = as_datetime(ultimo_backup_sucesso_str)
          if ultimo_backup_sucesso_str is not none and ultimo_backup_sucesso_str !=
          ''unavailable'' else none %} {% set backup_date_str = backup_datetime.strftime(''%Y-%m-%d'')
          if backup_datetime is not none else none %} {{ backup_date_str is not none
          and backup_date_str == hoje_date_str }}'
      sequence:
      - data:
          destinatarios:
          titulo: ✅ Backup Local OK
          mensagem: "Backup local do Home Assistant realizado com sucesso no dia de
            hoje ( {%- if ultimo_backup_sucesso_str is not none and ultimo_backup_sucesso_str
            != 'unavailable' -%}\n  {{ (as_datetime(ultimo_backup_sucesso_str) | as_local).strftime('%d/%m/%Y
            às %H:%M') }}\n{%- else -%}\n  N/A\n{%- endif -%} ). Lembre-se de que
            esta verificação não confirma o upload para o OneDrive."
          parse_mode: MarkdownV2
        action: script.enviar_notificacao_telegram
  mode: single
