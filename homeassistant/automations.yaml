- id: '1767186938348'
  alias: "\U0001F39B️ Suíte — Controle 4 botões (Zigbee) Cabeceira Antonio"
  description: Controle Zigbee (Tuya 4 botões) via Zigbee2MQTT.
  use_blueprint:
    path: rdeangel/zigbee2mqtt-tuya-4-button-switch-mqtt-device-trigger_rdeangel.yaml
    input:
      zigbee_device: 4ecdd15020b51a5c270c478e1131b371
      button_one_short_press:
      - action: light.toggle
        metadata: {}
        target:
          entity_id:
          - light.suite_cabeceira_antonio_localtuya
        data:
          brightness_pct: 30
          rgb_color:
          - 255
          - 255
          - 0
      button_two_short_press:
      - action: light.toggle
        metadata: {}
        target:
          entity_id: light.suite_cabeceira_renata_localtuya
        data:
          rgb_color:
          - 255
          - 255
          - 0
          brightness_pct: 30
      button_three_short_press:
      - action: light.toggle
        metadata: {}
        target:
          entity_id:
          - light.suite_spot_sonoff
        data: {}
      button_four_short_press:
      - action: light.toggle
        metadata: {}
        target:
          entity_id:
          - light.suite_luz_indireta_z2m
        data:
          brightness_pct: 30
      button_one_long_press:
      - choose:
        - conditions:
          - condition: state
            entity_id: alarm_control_panel.alarme_hikvision_axpro
            state: disarmed
          sequence:
          - action: alarm_control_panel.alarm_arm_home
            target:
              entity_id: alarm_control_panel.alarme_hikvision_axpro
            data: {}
          - wait_for_trigger:
            - entity_id: alarm_control_panel.alarme_hikvision_axpro
              to: armed_home
              trigger: state
            timeout: 00:00:06
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: state
                entity_id: alarm_control_panel.alarme_hikvision_axpro
                state: armed_home
              sequence:
              - action: light.turn_on
                target:
                  device_id:
                  - c76e5287dc9f27d0016120f9783a5be5
                  - dd5fab206a5686b93f9deff3d70537d2
                data:
                  color_name: green
                  brightness_pct: 60
              - delay: 00:00:04
              - action: light.turn_off
                target:
                  entity_id: light.suite_cabeceira_antonio_localtuya
                data: {}
            default:
            - action: light.turn_on
              target:
                entity_id:
                - light.suite_cabeceira_antonio_localtuya
                - light.suite_cabeceira_renata_localtuya
              data:
                color_name: red
                brightness_pct: 100
                effect: blink
            - delay: 00:00:04
            - action: light.turn_off
              target:
                entity_id:
                - light.suite_cabeceira_antonio_localtuya
                - light.suite_cabeceira_renata_localtuya
              data: {}
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: alarm_control_panel.alarme_hikvision_axpro
              state: armed_home
            - condition: state
              entity_id: alarm_control_panel.alarme_hikvision_axpro
              state: armed_away
          sequence:
          - action: alarm_control_panel.alarm_disarm
            target:
              entity_id: alarm_control_panel.alarme_hikvision_axpro
            data: {}
          - wait_for_trigger:
            - entity_id: alarm_control_panel.alarme_hikvision_axpro
              to: disarmed
              trigger: state
            timeout: 00:00:06
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: state
                entity_id: alarm_control_panel.alarme_hikvision_axpro
                state: disarmed
              sequence:
              - action: light.turn_on
                target:
                  entity_id:
                  - light.suite_cabeceira_antonio_localtuya
                  - light.suite_cabeceira_renata_localtuya
                data:
                  color_name: blue
                  brightness_pct: 60
              - delay: 00:00:04
              - action: light.turn_off
                target:
                  entity_id:
                  - light.suite_cabeceira_antonio_localtuya
                  - light.suite_cabeceira_renata_localtuya
                data: {}
            default:
            - action: light.turn_on
              target:
                entity_id: light.suite_cabeceira_antonio_localtuya
              data:
                color_name: red
                brightness_pct: 100
                effect: blink
            - delay: 00:00:04
            - action: light.turn_off
              target:
                entity_id: light.suite_cabeceira_antonio_localtuya
              data: {}
        default: []
