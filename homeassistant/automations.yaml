- id: duplicati_registar_backup_homelab
  alias: "\U0001F4BE Homelab: Registar backup (Duplicati)"
  description: Atualiza helpers SSD/OneDrive quando o webhook duplicati_backup_result
    chega.
  triggers:
  - trigger: webhook
    webhook_id: duplicati_backup_result
    allowed_methods:
    - POST
    local_only: true
    id: duplicati_registar
  conditions: []
  actions:
  - variables:
      job: '{{ trigger.json.job_name | default('''') | lower }}'
      job_key: '{{ trigger.json.job_key | default(''unknown'') }}'
      status_raw: '{{ trigger.json.status | default(''unknown'') }}'
      backup_time: '{{ trigger.json.time | default(now().isoformat()) }}'
      status_opt: '{{ status_raw if status_raw in [''success'',''warning'',''error'',''unknown'']
        else ''unknown'' }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ job_key == ''ssd'' or ''docker-local'' in job }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sistema_docker_backup_ssd_ultimo
        data:
          datetime: '{{ backup_time }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.sistema_docker_backup_ssd_estado
        data:
          option: '{{ status_opt }}'
    - conditions:
      - condition: template
        value_template: '{{ job_key == ''onedrive'' or ''onedrive'' in job }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.sistema_docker_backup_onedrive_ultimo
        data:
          datetime: '{{ backup_time }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.sistema_docker_backup_onedrive_estado
        data:
          option: '{{ status_opt }}'
  mode: queued
  max: 10
- id: '1780944346290'
  alias: "\U0001F4BE Homelab: Verificação diária backup Duplicati (Telegram)"
  description: Todos os dias às 9h verifica SSD (docker-local, 24h+2h) e OneDrive
    (homelab-onedrive, 7d+2h). Notifica Antonio no Telegram apenas se sensor.sistema_docker_backup_problemas
    > 0.
  triggers:
  - platform: time
    at: 09:00:00
  conditions:
  - condition: numeric_state
    entity_id: sensor.sistema_docker_backup_problemas
    above: 0
  actions:
  - variables:
      linha_ssd: '{{ states(''sensor.sistema_docker_backup_ssd_linha'') }}'
      linha_od: '{{ states(''sensor.sistema_docker_backup_onedrive_linha'') }}'
      problemas: '{{ states(''sensor.sistema_docker_backup_problemas'') }}'
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      titulo: "\U0001F4BE Homelab — backup Duplicati"
      mensagem: '{{ problemas }} problema(s) nos backups Docker.


        SSD docker-local: {{ linha_ssd }}

        OneDrive homelab-onedrive: {{ linha_od }}


        Verifique o Duplicati na VM Docker.'
      parse_mode: MarkdownV2
  mode: single
