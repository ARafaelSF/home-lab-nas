- id: '1767805398310'
  alias: "\U0001F9F0\U0001F4A1 Oficina — Desligar bancada e réguas ao apagar a luz"
  description: Quando a luz principal da oficina for desligada, desliga a luz da bancada
    e os switches/réguas da oficina para evitar algo ficar ligado sozinho.
