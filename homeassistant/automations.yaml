- id: '1787398761177'
  alias: "\U0001F372 Cozinha — Termocirculador controle pelo aparelho"
  description: 'Durante a sessao: play/pause no termo sao respeitados. Stop/off online
    por 90s pausa (nao religa sozinho) — evita falso positivo em oscilacao de Wi-Fi.
    Play no termo ou Continue no HA retoma. Parar no HA encerra.'
  triggers:
  - entity_id: sensor.cozinha_termocirculador_status_localtuya
    id: pause
    to: pause
    trigger: state
  - entity_id: sensor.cozinha_termocirculador_status_localtuya
    id: pause
    to: paused
    trigger: state
  - entity_id: sensor.cozinha_termocirculador_status_localtuya
    for:
      seconds: 90
    id: stop
    to: stop
    trigger: state
  - entity_id: climate.cozinha_termocirculador_localtuya
    for:
      seconds: 90
    id: desligou
    to: 'off'
    trigger: state
  - entity_id: sensor.cozinha_termocirculador_status_localtuya
    id: play
    to: working
    trigger: state
  - entity_id: climate.cozinha_termocirculador_localtuya
    id: play
    to: heat
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_sessao_ativa
    state: 'on'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_comando_ha
    state: 'off'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_em_queda
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.cozinha_termocirculador_localtuya
      state:
      - unavailable
      - unknown
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: play
      - condition: or
        conditions:
        - condition: state
          entity_id: input_boolean.cozinha_termocirculador_pausado
          state: 'on'
        - condition: state
          entity_id: input_boolean.cozinha_termocirculador_falta_agua
          state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.cozinha_termocirculador_pausado
          - input_boolean.cozinha_termocirculador_falta_agua
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          mensagem: 'Sessão retomada pelo aparelho.


            Temp atual: {{ states(''input_number.cozinha_termocirculador_temp_ultima'')
            }}°C

            Alvo: {{ states(''input_number.cozinha_termocirculador_temp_sessao'')
            }}°C

            Mins restantes: {{ states(''input_number.cozinha_termocirculador_mins_restantes'')
            | int }} min'
          parse_mode: MarkdownV2
          titulo: ▶️ Termocirculador retomado
    - conditions:
      - condition: trigger
        id: pause
      - above: 0
        condition: numeric_state
        entity_id: input_number.cozinha_termocirculador_mins_restantes
      - condition: state
        entity_id: input_boolean.cozinha_termocirculador_pausado
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.cozinha_termocirculador_pausado
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          mensagem: 'Pause detectado no aparelho.

            A sessão ficou pausada no HA.


            Temp: {{ states(''input_number.cozinha_termocirculador_temp_ultima'')
            }}°C

            Alvo: {{ states(''input_number.cozinha_termocirculador_temp_sessao'')
            }}°C

            Mins restantes: {{ states(''input_number.cozinha_termocirculador_mins_restantes'')
            | int }} min


            Dê play no termo ou Continue no HA para retomar.'
          parse_mode: MarkdownV2
          titulo: ⏸️ Termocirculador pausado
    - conditions:
      - condition: trigger
        id:
        - stop
        - desligou
      - above: 0
        condition: numeric_state
        entity_id: input_number.cozinha_termocirculador_mins_restantes
      - condition: state
        entity_id: input_boolean.cozinha_termocirculador_pausado
        state: 'off'
      - condition: state
        entity_id: input_boolean.cozinha_termocirculador_falta_agua
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.cozinha_termocirculador_status_localtuya
          state: complete
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.cozinha_termocirculador_pausado
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          mensagem: 'O aparelho parou com a sessão em andamento (pause, desligamento
            ou falta de água).

            A automação foi pausada e NÃO vai religar sozinha.


            Temp: {{ states(''input_number.cozinha_termocirculador_temp_ultima'')
            }}°C

            Alvo: {{ states(''input_number.cozinha_termocirculador_temp_sessao'')
            }}°C

            Mins restantes: {{ states(''input_number.cozinha_termocirculador_mins_restantes'')
            | int }} min


            Se faltou água: reponha e dê play no termo (ou Continue no HA).

            Se pausou: dê play para continuar.

            Se quis desligar de vez: toque em Parar no HA.'
          parse_mode: MarkdownV2
          titulo: ⏸️ Termocirculador parou — sessão pausada
  max: 5
  mode: queued
