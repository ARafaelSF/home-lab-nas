            tag: portao_garagem_maior_aberto_alerta
            color: '{{ color_sucesso_app }}'
            notification_icon: '{{ icon_sucesso_app }}'
            timeout: 60
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garagem_portao_maior_alerta_ativo
    - conditions:
      - condition: trigger
        id: watchdog_10s
      - condition: state
        entity_id: cover.garagem_portao_maior_localtuya
        state: closed
        for: 00:02:00
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garagem_portao_maior_alerta_ativo
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: portao_aberto_tempo
        - condition: and
          conditions:
          - condition: trigger
            id: watchdog_10s
          - condition: state
            entity_id: cover.garagem_portao_maior_localtuya
            state: open
          - condition: template
            value_template: '{{ (as_timestamp(now()) - as_timestamp(states.cover.garagem_portao_maior_localtuya.last_changed,
              0)) >= 120 }}'
      - condition: state
        entity_id: input_boolean.garagem_portao_maior_alerta_ativo
        state: 'off'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garagem_portao_maior_alerta_ativo
      - repeat:
          while:
          - condition: state
            entity_id: cover.garagem_portao_maior_localtuya
            state: open
          sequence:
          - variables:
              last_changed: '{{ states.cover.garagem_portao_maior_localtuya.last_changed
                }}'
              tempo_aberto_seg: '{{ (as_timestamp(now()) - as_timestamp(last_changed,
                0)) | int }}'
              tempo_aberto_min: '{{ (tempo_aberto_seg // 60) | int }}'
              horas: '{{ (tempo_aberto_min // 60) | int }}'
              minutos: '{{ (tempo_aberto_min % 60) | int }}'
              mensagem_tempo: "{% if tempo_aberto_seg < 3600 %}\n  {{ tempo_aberto_min
                }} minuto{{ 's' if tempo_aberto_min != 1 else '' }}\n{% else %}\n
                \ {{ horas }} hora{{ 's' if horas != 1 else '' }}\n  {%- if minutos
                > 0 -%}\n    e {{ minutos }} minuto{{ 's' if minutos != 1 else ''
                }}\n  {%- endif -%}\n{% endif %}"
              mensagem_alerta_dinamica: ⚠️ O Portão da Garagem Maior está *aberto*
                há {{ mensagem_tempo }}! Deseja fechá-lo?
              mensagem_alexa: Atenção. O Portão da Garagem Maior está aberto há {{
                mensagem_tempo }}.
          - action: script.enviar_notificacao_alexa
            data:
              dispositivos: '{{ alexa_alvos }}'
              mensagem: '{{ mensagem_alexa }}'
              tipo: announce
          - action: script.enviar_notificacao_telegram
            data:
              destinatarios: '{{ destinatarios_portao }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta_dinamica }}'
              parse_mode: MarkdownV2
              inline_keyboard: '{{ teclado_telegram }}'
              cameras:
              - camera.camera_garagem_hd_stream
              - camera.camera_portao_hd_stream
          - action: script.enviar_notificacao_app
            data:
              destinatarios: '{{ destinatarios_portao }}'
              titulo: '{{ titulo_alerta }}'
              mensagem: '{{ mensagem_alerta_dinamica }}'
              dados:
                tag: portao_garagem_maior_aberto_alerta
                channel: Garagem
                importance: high
                notification_icon: '{{ icon_alerta_app }}'
                color: '{{ color_alerta_app }}'
                actions: '{{ botoes_app }}'
          - wait_for_trigger:
            - event_type: mobile_app_notification_action
              event_data:
                action: FECHAR_PORTAO_GARAGEM_MAIOR
              trigger: event
            - event_type: telegram_callback
              event_data:
                command: /fechar_portao_garagem_maior
              trigger: event
            timeout:
              minutes: 5
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ wait.trigger is not none }}'
              sequence:
              - action: cover.close_cover
                target:
                  entity_id: cover.garagem_portao_maior_localtuya
              - action: script.enviar_notificacao_app
                data:
                  destinatarios: '{{ destinatarios_portao }}'
                  titulo: "\U0001F504 Fechando..."
                  mensagem: Comando enviado. Verificando fechamento...
                  dados:
                    tag: portao_garagem_maior_aberto_alerta
              - wait_for_trigger:
                - entity_id: cover.garagem_portao_maior_localtuya
                  to: closed
                  trigger: state
                timeout: 00:00:30
                continue_on_timeout: true
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ wait.trigger is none }}'
                  sequence:
                  - action: script.enviar_notificacao_telegram
                    data:
                      destinatarios: '{{ destinatarios_portao }}'
                      titulo: '{{ titulo_erro }}'
                      mensagem: '❌ ALERTA CRÍTICO: O comando foi enviado, mas o portão
                        NÃO confirmou o fechamento após 30 segundos.'
                      cameras:
                      - camera.camera_garagem_hd_stream
                      - camera.camera_portao_hd_stream
                  - action: script.enviar_notificacao_app
                    data:
                      destinatarios: '{{ destinatarios_portao }}'
                      titulo: '{{ titulo_erro }}'
                      mensagem: O portão NÃO fechou após o comando!
                      dados:
                        tag: portao_garagem_maior_aberto_alerta
                        color: '{{ color_erro_app }}'
                        notification_icon: '{{ icon_erro_app }}'
                        importance: high
                        channel: GaragemCritico
  mode: parallel
  max: 10
  variables:
    destinatarios_portao:
    - antonio
    - renata
    alexa_alvos:
    - sala
    - cozinha
    - escritório
    - oficina
    - brinquedoteca
    titulo_alerta: "\U0001F697 Portão Garagem Maior: Alerta"
    titulo_sucesso: "\U0001F697 Portão Garagem Maior: Fechado"
    titulo_erro: "\U0001F697 Portão Garagem Maior: Erro"
    icon_alerta_app: mdi:garage-alert
    icon_sucesso_app: mdi:garage-lock
    icon_erro_app: mdi:alert-circle
    color_alerta_app: '#FFC107'
    color_sucesso_app: '#4CAF50'
    color_erro_app: '#F44336'
    teclado_telegram: "\U0001F512 Fechar Portão:/fechar_portao_garagem_maior"
    botoes_app: "{% set actions = [] %}  {% set actions = actions + [{'action':'FECHAR_PORTAO_GARAGEM_MAIOR','title':'\U0001F6AB
      Fechar Portão'}] %}  {{ actions }}\n"
- id: '1769897920999'
  alias: "\U0001F6E0️ Oficina: Automação da Porta"
  description: 'Gerencia a iluminação e equipamentos da oficina baseado na porta.
    - Ao ABRIR: Acende a luz principal. - Ao FECHAR: Desliga tudo e avisa se a janela
    ficou aberta.'
  triggers:
  - entity_id: binary_sensor.oficina_porta_z2m_contact
    to: 'off'
    id: fechou
    trigger: state
  - entity_id: binary_sensor.oficina_porta_z2m_contact
    to: 'on'
    id: abriu
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fechou
      sequence:
      - action: homeassistant.turn_off
        target:
          entity_id:
          - light.bancada_oficina_bancada_oficina
          - light.oficina_luz_sonoff
          - switch.oficina_repelente_localtuya
          - switch.oficina_soldador_localtuya
          - switch.oficina_regua_z2m
      - if:
        - condition: state
          entity_id: binary_sensor.oficina_janela_z2m_contact
          state: 'on'
        then:
        - action: script.enviar_notificacao_alexa
          data:
            dispositivos: oficina
            mensagem: Atenção, a janela da oficina ficou aberta.
            tipo: tts
    - conditions:
      - condition: trigger
        id: abriu
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.oficina_luz_sonoff
- id: '1770498379027'
  alias: "\U0001F6A8 Alarme: Presença Cozinha - Alerta que está Ligado"
  description: Monitora o sensor de presença da cozinha entre 05:00 e 10:00. Caso
    detecte presença e o alarme (alarm_control_panel.alarme_hikvision_axpro) esteja
    armado, envia um alerta sonoro imediato para a Alexa da cozinha.
  triggers:
  - entity_id: binary_sensor.cozinha_presenca_z2m_occupancy
    to: 'on'
    trigger: state
  conditions:
  - condition: time
    after: 05:00:00
    before: '10:00:00'
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarme_hikvision_axpro
      state:
      - disarmed
      - unknown
      - unavailable
  actions:
  - variables:
      dispositivo_alexa: cozinha
      mensagem_alerta: Alarme!
      tipo_notificacao: announce
  - action: script.enviar_notificacao_alexa
    data:
      dispositivos: '{{ dispositivo_alexa }}'
      mensagem: '{{ mensagem_alerta }}'
      tipo: '{{ tipo_notificacao }}'
      volume: '{{ volume_alerta }}'
  mode: single
- id: '1770677116956'
  alias: "\U0001F327️ Toldo - Chuva"
  description: Fecha se chover. Reabre se parar (e estiver no horário).
  triggers:
  - entity_id: binary_sensor.casa_agua_copasa_chovendo
    to: 'on'
    id: chuva_comecou
    platform: state
  - entity_id: binary_sensor.casa_agua_copasa_chovendo
    from: 'on'
    to: 'off'
    for:
      minutes: 30
    id: chuva_parou
    platform: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: chuva_comecou
      - condition: not
        conditions:
        - condition: state
          entity_id: cover.suite_toldo_z2m
          state: closed
      sequence:
      - target:
          entity_id: cover.suite_toldo_z2m
        action: cover.close_cover
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          titulo: "\U0001F327️ Chuva começou"
          mensagem: Detectei chuva. Fechando o toldo.
          parse_mode: MarkdownV2
    - conditions:
      - condition: trigger
        id: chuva_parou
      - condition: time
        after: 09:00:00
        before: '18:00:00'
      - condition: state
        entity_id: cover.suite_toldo_z2m
        state: closed
      sequence:
      - target:
          entity_id: cover.suite_toldo_z2m
        action: cover.open_cover
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          titulo: "\U0001F324️ Chuva Parou"
          mensagem: A chuva parou há 30min e estamos no horário permitido. Reabrindo
            o toldo.
          parse_mode: MarkdownV2
  mode: single
- id: '1770752813386'
  alias: "\U0001F305 Controle por Horário — Toldo da Suíte"
  description: Abre ao ligar (Evento 1) e fecha ao desligar (Evento 2). Não reabre
    se estiver a chover.
  use_blueprint:
    input:
      reconcile_enabled: false
      start_time: 09:40:00
      stop_time: '18:00:00'
      target_entity:
      - cover.suite_toldo_z2m
      block_on_when:
      - binary_sensor.casa_agua_copasa_chovendo
      telegram_destinatarios:
      - Antonio
      telegram_enable_msg_off: false
      telegram_enable_msg_off_already: false
      telegram_enable_msg_on: false
      telegram_enable_msg_on_already: false
      telegram_msg_off: O toldo está sendo *fechado* agora.
      telegram_msg_off_already: O tolda já estava fechado.
      telegram_msg_on: O toldo está sendo *aberto* agora.
      telegram_msg_on_already: O tolda já estava aberto.
      telegram_titulo_off: "\U0001F305 Toldo da Suíte"
      telegram_titulo_on: "\U0001F305 Toldo da Suíte"
    path: Antonio/controle_por_horario.yaml
- id: '1771340239219'
  alias: "\U0001F6B1 Jardim Japonês — Falta de água"
  description: Notifica no Telegram quando o ESPHome desligar a fonte por falta de
    água.
  triggers:
  - entity_id: sensor.jardim_japones_status_seguranca_fonte
    to: Falta de Água na Fonte
    trigger: state
    not_from:
    - unknown
    - unavailable
    - none
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none\n   and trigger.to_state.state
      not in ['unknown','unavailable','none','']\n   and trigger.to_state.state ==
      'Falta de Água na Fonte' }}"
  actions:
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios:
      - antonio
      titulo: "\U0001F6B1 Jardim Japonês — Falta de água"
      mensagem: 'A fonte foi desligada automaticamente por segurança. Motivo: {{ states(''sensor.jardim_japones_status_seguranca_fonte'')
        }}'
      parse_mode: MarkdownV2
  mode: single
- id: '1771357055628'
  alias: "\U0001F6A8 Indicador - Alarme (pausa com portas abertas)"
  description: "Lâmpada RGB como status visual do alarme, mas somente se TUDO estiver
    fechado. Regras: - \U0001F6AA Se binary_sensor.portas_seguranca = on (alguma porta/janela
    aberta):\n    -> APAGA a lâmpada imediatamente\n    -> e não deixa acender por
    mudança no alarme\n- ✅ Se binary_sensor.portas_seguranca = off (tudo fechado):\n
    \   -> \U0001F534 Armado (armed / armed_*)\n    -> \U0001F7E2 Desarmado (disarmed)
    [verde trocado por azul]\n    -> \U0001F7E0 Outros estados (arming/pending/triggered/unavailable/unknown)\n"
  triggers:
  - entity_id: alarm_control_panel.alarme_hikvision_axpro
    id: alarme_mudou
    platform: state
  - entity_id: binary_sensor.portas_seguranca
    to: 'on'
    id: portas_abriram
    platform: state
  - entity_id: binary_sensor.portas_seguranca
    to: 'off'
    id: portas_fecharam
    platform: state
  - event: start
    id: ha_iniciou
    platform: homeassistant
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.portas_seguranca
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.alarme_indicacao_luz_localtuya
    default:
    - choose:
      - conditions:
        - condition: state
          entity_id: alarm_control_panel.alarme_hikvision_axpro
          state: disarmed
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.alarme_indicacao_luz_localtuya
          data:
            rgb_color:
            - 0
            - 255
            - 0
            brightness_pct: 10
            transition: 1
      - conditions:
        - condition: template
          value_template: "{{ states('alarm_control_panel.alarme_hikvision_axpro')
            == 'armed'\n   or states('alarm_control_panel.alarme_hikvision_axpro').startswith('armed_')
            }}\n"
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.alarme_indicacao_luz_localtuya
          data:
            rgb_color:
            - 255
            - 0
            - 0
            brightness_pct: 10
            transition: 1
      default:
      - action: light.turn_on
        target:
          entity_id: light.alarme_indicacao_luz_localtuya
        data:
          rgb_color:
          - 255
          - 165
          - 0
          brightness_pct: 10
          transition: 1
  mode: restart
- id: '1772215745375'
  alias: "\U0001F504 Recarregar - SmartThings"
  description: Monitora os ar-condicionados via SmartThings cloud (transição). Se
    a integração cair, recarrega e avisa no Telegram.
  use_blueprint:
