- id: '1784899088196'
  alias: "\U0001F3F4‍☠️ Pirata Cecília - Fim do timer"
  description: Avisa quando completar 1h e marca que já usou hoje.
  triggers:
  - event_data:
      entity_id: timer.pirata_cecilia_sessao
    event_type: timer.finished
    trigger: event
  conditions:
  - condition: state
    entity_id: input_boolean.pirata_cecilia_usou_hoje
    state: 'off'
  actions:
  - action: script.enviar_notificacao_alexa
    data:
      dispositivos:
      - sala
      - sala_de_jantar
      - brinquedoteca
      mensagem: Cecília, acabou uma hora no pirata. Parabéns!
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.pirata_cecilia_usou_hoje
  mode: single
- id: '1784899089151'
  alias: "\U0001F3F4‍☠️ Pirata Cecília - Reset diário"
  description: Zera o estado do pirata à meia-noite.
  triggers:
  - at: 00:00:05
    trigger: time
  actions:
  - if:
    - condition: template
      value_template: '{{ not is_state(''timer.pirata_cecilia_sessao'', ''idle'')
        }}'
    then:
    - action: timer.cancel
      target:
        entity_id: timer.pirata_cecilia_sessao
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.pirata_cecilia_usou_hoje
  mode: single
- id: '1784899092832'
  alias: "\U0001F3F4‍☠️ Pirata Cecília - Lembretes periódicos"
  description: Lembra a Cecília de usar o pirata a cada 20 min entre 16h e 20h.
  triggers:
  - minutes: /20
    trigger: time_pattern
  conditions:
  - after: '16:00:00'
    before: '20:00:00'
    condition: time
  - condition: state
    entity_id: input_boolean.pirata_cecilia_usou_hoje
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: timer.pirata_cecilia_sessao
      state: active
  actions:
  - action: script.pirata_cecilia
    data:
      modo: lembrete
  mode: single
- id: '1786460444302'
  alias: "\U0001F500 Jardim Japonês → Lanterna (unidirecional)"
  description: Jardim comanda a lanterna. Lanterna não afeta o jardim.
  triggers:
  - entity_id: light.corredor_interruptor_escada_z2m_l3_jardim_japones
    from: 'off'
    id: turn_on
    to: 'on'
    trigger: state
  - entity_id: light.corredor_interruptor_escada_z2m_l3_jardim_japones
    from: 'on'
    id: turn_off
    to: 'off'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.context.id != this.context.id }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.jardim_japones_lanterna_japonesa
    - conditions:
      - condition: trigger
        id: turn_off
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.jardim_japones_lanterna_japonesa
  max_exceeded: silent
  mode: single
- id: '1786476425509'
  alias: "\U0001F501 Z2M — Contar falhas do coordenador"
  description: Conta SRSP, NWK_NO_ROUTE, BUFFER_FULL, MAC_NO_RESOURCES e Failed to
    ping no log MQTT do Z2M.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/bridge/logging
  conditions:
  - condition: template
    value_template: '{% set p = trigger.payload | default('''') %}{{ ''SRSP'' in p
      or ''NWK_NO_ROUTE'' in p or ''BUFFER_FULL'' in p or ''MAC_NO_RESOURCES'' in
      p or ''Failed to ping'' in p }}'
  actions:
  - action: counter.increment
    target:
      entity_id: counter.z2m_srsp_falhas
  mode: queued
  max: 50
- id: '1786476425508'
  alias: "\U0001F501 Z2M — Reset contador falhas (janela)"
  description: Zera o contador a cada 30 minutos se ainda não atingiu o limiar de
    recuperação (5), evitando acumular erros isolados sem apagar rajadas em curso.
  triggers:
  - trigger: time_pattern
    minutes: /30
  conditions:
  - condition: numeric_state
    entity_id: counter.z2m_srsp_falhas
    below: 5
  actions:
  - action: counter.reset
    target:
      entity_id: counter.z2m_srsp_falhas
  mode: single
- id: '1786476437458'
  alias: "\U0001F501 Z2M — Recuperar coordenador"
  description: 'Quando o contador de falhas Zigbee passa de 4 (≥5), faz recuperação
    completa. Usa state for: no limiar (rearmável) + cooldown 30 min. Também reage
    se o contador já estiver alto quando o cooldown terminar.'
  triggers:
  - trigger: numeric_state
    entity_id: counter.z2m_srsp_falhas
    above: 4
    for:
      seconds: 30
    id: limiar
  - trigger: state
    entity_id: timer.z2m_coordenador_cooldown
    from: active
    to: idle
    id: cooldown_fim
  conditions:
  - condition: state
    entity_id: timer.z2m_coordenador_cooldown
    state: idle
  - condition: numeric_state
    entity_id: counter.z2m_srsp_falhas
    above: 4
  actions:
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      titulo: "\U0001F504 Zigbee2MQTT recuperando"
      mensagem: "⚠️ Atenção: várias falhas no coordenador Zigbee (SRSP / rota / buffer
        / MAC_NO_RESOURCES).\n\n\U0001F504 Recuperação completa: parar Zigbee2MQTT
        → reiniciar rádio SLZB-06 → subir Zigbee2MQTT."
      parse_mode: MarkdownV2
  - action: persistent_notification.create
    data:
      notification_id: z2m_coordenador_travado
      title: Zigbee — recuperação automática
      message: 'Falhas detectadas. Ciclo completo: stop app → rádio SLZB-06 → start
        app.'
  - action: timer.start
    target:
      entity_id: timer.z2m_coordenador_cooldown
  - action: hassio.addon_stop
    data:
      addon: 45df7312_zigbee2mqtt
    continue_on_error: true
  - delay:
      seconds: 15
  - action: button.press
    target:
      entity_id: button.slzb_06_reiniciar_zigbee
  - delay:
      seconds: 60
  - action: hassio.addon_start
    data:
      addon: 45df7312_zigbee2mqtt
    continue_on_error: true
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
      to: 'on'
    timeout:
      minutes: 3
    continue_on_timeout: true
  - delay:
      seconds: 30
  - action: counter.reset
    target:
      entity_id: counter.z2m_srsp_falhas
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
        state: 'on'
      sequence:
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          titulo: ✅ Zigbee recuperação
          mensagem: Recuperação completa concluída. Bridge MQTT conectado. Cooldown
            de 30 minutos ativo.
          parse_mode: MarkdownV2
      - action: persistent_notification.create
        data:
          notification_id: z2m_coordenador_travado
          title: Zigbee — recuperação OK
          message: Bridge MQTT conectado após stop/start + rádio SLZB-06.
    default:
    - action: script.enviar_notificacao_telegram
      data:
        destinatarios: antonio
        titulo: ⚠️ Zigbee recuperação incompleta
        mensagem: O ciclo stop/rádio/start rodou, mas o bridge MQTT não voltou em
          3 minutos. Verifique o Zigbee2MQTT e o SLZB-06.
        parse_mode: MarkdownV2
    - action: persistent_notification.create
      data:
        notification_id: z2m_coordenador_travado
        title: Zigbee — recuperação incompleta
        message: Bridge MQTT não conectou após a recuperação completa. Intervenção
          manual pode ser necessária.
  mode: single
- id: '1787225915185'
  alias: "\U0001F372 Cozinha — Termocirculador ciclo concluído"
  description: Encerra a sessão quando o tempo restante do aparelho chega a 0. Ignora
    pausa e falta de água.
  triggers:
  - entity_id: sensor.cozinha_termocirculador_tempo_restante_localtuya
    to: '0'
    trigger: state
  - below: 1
    entity_id: input_number.cozinha_termocirculador_mins_restantes
    for:
      seconds: 5
    id: helper_zerou
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_sessao_ativa
    state: 'on'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_em_queda
    state: 'off'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_pausado
    state: 'off'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_falta_agua
    state: 'off'
  actions:
  - action: script.cozinha_termocirculador_parar
    data:
      motivo: concluido
  mode: single
- id: '1787225927758'
  alias: "\U0001F372 Cozinha — Termocirculador detectar queda"
  description: Queda de rede (unavailable/unknown) com sessao ativa, so apos 2 min
    fora. Guarda ultima temp valida. Flexivel para oscilacao de Wi-Fi; foco e queda
    de energia.
  triggers:
  - entity_id: climate.cozinha_termocirculador_localtuya
    for:
      minutes: 2
      seconds: 0
    id: indisponivel
    to: unavailable
    trigger: state
  - entity_id: climate.cozinha_termocirculador_localtuya
    for:
      minutes: 2
      seconds: 0
    id: desconhecido
    to: unknown
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_sessao_ativa
    state: 'on'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_em_queda
    state: 'off'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_pausado
    state: 'off'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_falta_agua
    state: 'off'
  - above: 0
    condition: numeric_state
    entity_id: input_number.cozinha_termocirculador_mins_restantes
  actions:
  - variables:
      mins_guardados: '{% set rem = states(''sensor.cozinha_termocirculador_tempo_restante_localtuya'')
        %}{% if rem not in [''unknown'',''unavailable'',''''] %}{{ [rem | int(1),
        1] | max }}{% else %}{{ [states(''input_number.cozinha_termocirculador_mins_restantes'')
        | int(1), 1] | max }}{% endif %}'
      temp_alvo: '{{ states(''input_number.cozinha_termocirculador_temp_sessao'')
        | float(0) }}'
      temp_queda: '{% set from_t = trigger.from_state.attributes.current_temperature
        | float(-1) %}{% set last = states(''input_number.cozinha_termocirculador_temp_ultima'')
        | float(-1) %}{% if from_t > 0 %}{{ from_t }}{% elif last > 0 %}{{ last }}{%
        else %}{{ states(''input_number.cozinha_termocirculador_temp_sessao'') | float(0)
        }}{% endif %}'
  - action: input_number.set_value
    data:
      value: '{{ mins_guardados }}'
    target:
      entity_id: input_number.cozinha_termocirculador_mins_restantes
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_em_queda
  - action: input_datetime.set_datetime
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    target:
      entity_id: input_datetime.cozinha_termocirculador_queda_em
  - action: input_number.set_value
    data:
      value: '{{ temp_queda }}'
    target:
      entity_id: input_number.cozinha_termocirculador_temp_na_queda
  - action: script.enviar_notificacao_telegram
    data:
      destinatarios: antonio
      mensagem: 'O aparelho saiu do ar durante a sessao (ja faz 2 min).

        Mins restantes guardados: {{ mins_guardados | int }} min

        Temp na queda: {{ temp_queda }}C

        Alvo: {{ temp_alvo }}C

        Quando voltar, o HA sincroniza o tempo do aparelho se ele continuou contando;
        se a energia caiu, reprograma e religa.'
      parse_mode: MarkdownV2
      titulo: ⚠️ Termocirculador — queda detectada
  mode: single
- id: '1787225928483'
  alias: "\U0001F372 Cozinha — Termocirculador recuperar após queda"
  description: 'Apos reconectar ou reboot do HA: se o aparelho continuou (Wi-Fi),
    so sincroniza o tempo dele; se desligou (energia), reprograma mins guardados e
    religa.'
  triggers:
  - trigger: state
    entity_id: climate.cozinha_termocirculador_localtuya
    from:
    - unavailable
    - unknown
    for:
      seconds: 15
    id: voltou_online
  - trigger: state
    entity_id: input_boolean.cozinha_termocirculador_em_queda
    to: 'on'
    for:
      seconds: 30
    id: retry_apos_queda
  - trigger: homeassistant
    event: start
    id: ha_start
  conditions:
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_sessao_ativa
    state: 'on'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_pausado
    state: 'off'
  - condition: state
    entity_id: input_boolean.cozinha_termocirculador_falta_agua
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.cozinha_termocirculador_em_queda
      state: 'on'
    - condition: trigger
      id: ha_start
  - above: 0
    condition: numeric_state
    entity_id: input_number.cozinha_termocirculador_mins_restantes
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ha_start
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: climate.cozinha_termocirculador_localtuya
          from:
          - unavailable
          - unknown
        timeout:
          minutes: 5
        continue_on_timeout: true
      - if:
        - condition: state
          entity_id: climate.cozinha_termocirculador_localtuya
          state:
          - unavailable
          - unknown
        then:
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: antonio
            parse_mode: MarkdownV2
            titulo: Termocirculador apos reboot
            mensagem: HA voltou, mas o termocirculador ainda esta indisponivel apos
              5 min. Sessao continua marcada como ativa.
        - stop: Aparelho indisponivel apos reboot
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: climate.cozinha_termocirculador_localtuya
            state: 'off'
          - condition: state
            entity_id: sensor.cozinha_termocirculador_status_localtuya
            state: stop
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.cozinha_termocirculador_em_queda
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.cozinha_termocirculador_queda_em
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.cozinha_termocirculador_localtuya
      state:
      - unavailable
      - unknown
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
  - delay:
      seconds: 10
  - wait_for_trigger:
    - trigger: state
      entity_id: sensor.cozinha_termocirculador_tempo_restante_localtuya
      from:
      - unavailable
      - unknown
    timeout:
      seconds: 45
    continue_on_timeout: true
  - variables:
      saved_mins: '{{ [states(''input_number.cozinha_termocirculador_mins_restantes'')
        | int(1), 1] | max }}'
      device_rem: '{% set r = states(''sensor.cozinha_termocirculador_tempo_restante_localtuya'')
        %}{% if r not in [''unknown'',''unavailable'',''''] %}{{ [r | int(0), 0] |
        max }}{% else %}-1{% endif %}'
      status_ap: '{{ states(''sensor.cozinha_termocirculador_status_localtuya'') }}'
      climate_st: '{{ states(''climate.cozinha_termocirculador_localtuya'') }}'
      mins_final: '{% set r = states(''sensor.cozinha_termocirculador_tempo_restante_localtuya'')
        %}{% set rem = r | int(-1) if r not in [''unknown'',''unavailable'','''']
        else -1 %}{% set st = states(''sensor.cozinha_termocirculador_status_localtuya'')
        %}{% set cl = states(''climate.cozinha_termocirculador_localtuya'') %}{% if
        rem > 0 and (cl == ''heat'' or st == ''working'') %}{{ rem }}{% else %}{{
        [states(''input_number.cozinha_termocirculador_mins_restantes'') | int(1),
        1] | max }}{% endif %}'
      modo: '{% set r = states(''sensor.cozinha_termocirculador_tempo_restante_localtuya'')
        %}{% set rem = r | int(-1) if r not in [''unknown'',''unavailable'','''']
        else -1 %}{% set st = states(''sensor.cozinha_termocirculador_status_localtuya'')
        %}{% set cl = states(''climate.cozinha_termocirculador_localtuya'') %}{% if
        rem > 0 and (cl == ''heat'' or st == ''working'') %}sync_aparelho{% else %}reprogramar_energia{%
        endif %}'
      temp_alvo: '{{ states(''input_number.cozinha_termocirculador_temp_sessao'')
        | float(55) }}'
      temp_atual: '{% set t = state_attr(''climate.cozinha_termocirculador_localtuya'',
        ''current_temperature'') | float(-1) %}{% if t > 0 %}{{ t }}{% else %}{{ states(''input_number.cozinha_termocirculador_temp_ultima'')
        | float(0) }}{% endif %}'
      temp_queda: '{{ states(''input_number.cozinha_termocirculador_temp_na_queda'')
        | float(0) }}'
      tempo_queda_txt: '{% set s = (as_timestamp(now()) - as_timestamp(states(''input_datetime.cozinha_termocirculador_queda_em''),
        as_timestamp(now()))) | int(0) %}{% if s >= 3600 %}{{ s // 3600 }}h {{ (s
        % 3600) // 60 }}min{% elif s >= 60 %}{{ s // 60 }} min{% else %}{{ s }} s{%
        endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (mins_final | int(0)) < 1 }}'
      sequence:
      - action: script.cozinha_termocirculador_parar
        data:
          motivo: concluido
    - conditions:
      - condition: template
        value_template: '{{ modo == ''sync_aparelho'' }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.cozinha_termocirculador_mins_restantes
        data:
          value: '{{ mins_final | int }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cozinha_termocirculador_em_queda
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: antonio
          parse_mode: MarkdownV2
          titulo: Termocirculador sincronizado
          mensagem: 'Aparelho continuou ligado (provavel Wi-Fi).


            Tempo fora: {{ tempo_queda_txt }}

            Tempo do aparelho (usado): {{ mins_final }} min

            Guardado no HA antes: {{ saved_mins }} min

            Temp atual: {{ temp_atual }}C

            Alvo: {{ temp_alvo }}C

            Status: {{ status_ap }}

            Nao regravei o timer do aparelho.'
    default:
    - action: input_number.set_value
      target:
        entity_id: input_number.cozinha_termocirculador_mins_restantes
      data:
        value: '{{ mins_final | int }}'
    - action: number.set_value
      target:
        entity_id: number.cozinha_termocirculador_tempo_configurado_localtuya
      data:
        value: '{{ mins_final | int }}'
    - delay:
        seconds: 2
    - action: climate.set_temperature
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
      data:
        temperature: '{{ temp_alvo }}'
    - delay:
        seconds: 1
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
      data:
        hvac_mode: heat
    - action: climate.turn_on
      target:
        entity_id: climate.cozinha_termocirculador_localtuya
    - delay:
        seconds: 4
    - if:
      - condition: or
        conditions:
        - condition: state
          entity_id: climate.cozinha_termocirculador_localtuya
          state: 'off'
        - condition: state
          entity_id: sensor.cozinha_termocirculador_status_localtuya
          state: stop
      then:
      - action: climate.turn_on
        target:
          entity_id: climate.cozinha_termocirculador_localtuya
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.cozinha_termocirculador_localtuya
        data:
          hvac_mode: heat
      - delay:
          seconds: 3
    - action: input_boolean.turn_off
