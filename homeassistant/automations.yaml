          Tempo fora: {{ tempo_queda_txt }}

          Temp na queda: {{ temp_queda }}C

          Temp ao retornar: {{ temp_atual }}C

          Alvo: {{ temp_alvo }}C

          Tempo reprogramado: {{ mins_final }} min

          Status: {{ status_ap }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cozinha_termocirculador_comando_ha
  mode: restart
