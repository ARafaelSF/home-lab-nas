  alias: "\U0001F6BF\U0001F6AB\U0001F4A7 Pressurizador - Bloqueia se Chuveiro Estiver
    Aberto"
  description: 'Desliga o pressurizador se o chuveiro estiver aberto: ao abrir o chuveiro
    com a bomba ligada ou ao ligar a bomba com o chuveiro já aberto.

    '
  triggers:
  - entity_id:
    - binary_sensor.chuveiro_suite_chuveiro_aberto
    to:
    - 'on'
    trigger: state
  - entity_id: switch.caixa_d_agua_ativar_bomba
    to: 'on'
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: binary_sensor.chuveiro_suite_chuveiro_aberto
      state:
      - 'on'
    - condition: state
      entity_id: switch.caixa_d_agua_ativar_bomba
      state:
      - 'on'
  actions:
  - action: button.press
    target:
      entity_id: button.caixa_d_agua_desligar_agua_pressurizada
    data: {}
  mode: single
- id: '1767534668850'
  alias: "\U0001F6BF\U0001F4A7 Pressurizador - Acionar Pelo Fluxo do Purificador"
  description: Liga a bomba por pelo menos 10 segundos quando detecta fluxo no pressurizador.
    Desliga após 10 segundos se o sensor estiver desligado. Bloqueia se o chuveiro
    da suíte estiver aberto. Ao fechar o chuveiro, volta a ligar se o purificador
    ainda tiver fluxo.
  triggers:
  - entity_id: binary_sensor.cozinha_sensor_fluxo_purificador_z2m_water_leak
    to: 'on'
    id: fluxo_on
    platform: state
  - entity_id: binary_sensor.chuveiro_suite_chuveiro_aberto
    to: 'on'
    id: chuveiro_on
    platform: state
  - entity_id: binary_sensor.chuveiro_suite_chuveiro_aberto
    to: 'off'
    id: chuveiro_off
    platform: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''chuveiro_on'' }}'
      sequence:
      - condition: state
        entity_id: switch.caixa_d_agua_agua_pressurizada
        state: 'on'
      - action: button.press
        target:
          entity_id: button.caixa_d_agua_desligar_agua_pressurizada
      - action: script.enviar_notificacao_alexa
        data:
          dispositivos: cozinha
          mensagem: Chuveiro aberto. Desliguei o pressurizador.
          tipo: tts
      - stop: Chuveiro abriu — pressurizador foi desligado.
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''chuveiro_off'' }}'
      sequence:
      - condition: state
        entity_id: binary_sensor.cozinha_sensor_fluxo_purificador_z2m_water_leak
        state: 'on'
      - action: button.press
        target:
          entity_id: button.caixa_d_agua_ligar_agua_pressurizada
      - delay: 00:00:10
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.cozinha_sensor_fluxo_purificador_z2m_water_leak
            state: 'off'
          sequence:
          - action: button.press
            target:
              entity_id: button.caixa_d_agua_desligar_agua_pressurizada
        default:
        - wait_for_trigger:
          - entity_id: binary_sensor.cozinha_sensor_fluxo_purificador_z2m_water_leak
            to: 'off'
            trigger: state
        - action: button.press
          target:
            entity_id: button.caixa_d_agua_desligar_agua_pressurizada
      - stop: Chuveiro fechou — pressurizador religado enquanto o purificador tem
          fluxo.
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''fluxo_on'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.chuveiro_suite_chuveiro_aberto
            state: 'on'
          sequence:
          - action: script.enviar_notificacao_alexa
            data:
              dispositivos: cozinha
              mensagem: O chuveiro está aberto, não vou ligar o pressurizador.
              tipo: tts
          - stop: Chuveiro ligado — pressurizador não será acionado.
        default:
        - action: button.press
          target:
            entity_id: button.caixa_d_agua_ligar_agua_pressurizada
        - delay: 00:00:10
        - choose:
          - conditions:
            - condition: state
              entity_id: binary_sensor.cozinha_sensor_fluxo_purificador_z2m_water_leak
              state: 'off'
            sequence:
            - action: button.press
              target:
                entity_id: button.caixa_d_agua_desligar_agua_pressurizada
          default:
          - wait_for_trigger:
            - entity_id: binary_sensor.cozinha_sensor_fluxo_purificador_z2m_water_leak
              to: 'off'
              trigger: state
          - action: button.press
            target:
              entity_id: button.caixa_d_agua_desligar_agua_pressurizada
  mode: restart
- id: '1767555918313'
  alias: "\U0001F4A7 Água: Alerta de Consumo"
  description: Monitora consumo de água com alertas em patamares, envia notificações
    (Telegram + App) com títulos e ícones, fecha válvula automaticamente ao atingir
    limite configurável se não for dia de faxina.
  triggers:
  - entity_id: sensor.casa_agua_hoje
    id: consumo_update
    platform: state
  - at: 00:00:05
    id: reset_meianoite
    platform: time
  - event_type: telegram_callback
    event_data:
      command: /faxina_on
    id: telegram_faxina_on
    platform: event
  - event_type: telegram_callback
    event_data:
      command: /faxina_off
    id: telegram_faxina_off
    platform: event
  - event_type: telegram_callback
    event_data:
      command: /fechar_valvula
    id: telegram_fechar_valvula
    platform: event
  - event_type: telegram_callback
    event_data:
      command: /abrir_valvula
    id: telegram_abrir_valvula
    platform: event
  - event_type: mobile_app_notification_action
    event_data:
      action: AGUA_FAXINA_ON
    id: app_faxina_on
    platform: event
  - event_type: mobile_app_notification_action
    event_data:
      action: AGUA_FAXINA_OFF
    id: app_faxina_off
    platform: event
  - event_type: mobile_app_notification_action
    event_data:
      action: AGUA_FECHAR_VALVULA
    id: app_fechar_valvula
    platform: event
  - event_type: mobile_app_notification_action
    event_data:
      action: AGUA_ABRIR_VALVULA
    id: app_abrir_valvula
    platform: event
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: reset_meianoite
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.casa_agua_dia_ultimo_patamar_notificado
        data:
          value: 0
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.sistema_dia_de_faxina
        data: {}
    - conditions:
      - condition: trigger
        id: telegram_faxina_on
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sistema_dia_de_faxina
        data: {}
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_confirmacao }}'
          mensagem: OK — Dia de faxina ativado. Não vou fechar a válvula ao passar
            de {{ limite_fechar_valvula }} L hoje.
          parse_mode: MarkdownV2
    - conditions:
      - condition: trigger
        id: telegram_faxina_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sistema_dia_de_faxina
        data: {}
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_confirmacao }}'
          mensagem: OK — Dia de faxina desativado. Voltei a fechar a válvula automaticamente
            em {{ limite_fechar_valvula }} L.
          parse_mode: MarkdownV2
    - conditions:
      - condition: trigger
        id: telegram_fechar_valvula
      sequence:
      - action: valve.close_valve
        target:
          entity_id: valve.casa_valvula_agua_z2m
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula fechada manualmente pelo Telegram.
          parse_mode: MarkdownV2
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula fechada manualmente pelo Telegram.
          dados:
            tag: agua_dia_acao
            channel: Água
            importance: high
            notification_icon: '{{ icon_acao }}'
            color: '{{ color_acao }}'
    - conditions:
      - condition: trigger
        id: telegram_abrir_valvula
      sequence:
      - action: valve.open_valve
        target:
          entity_id: valve.casa_valvula_agua_z2m
      - action: script.enviar_notificacao_telegram
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula aberta manualmente pelo Telegram.
          parse_mode: MarkdownV2
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula aberta manualmente pelo Telegram.
          dados:
            tag: agua_dia_acao
            channel: Água
            importance: high
            notification_icon: '{{ icon_ok }}'
            color: '{{ color_ok }}'
    - conditions:
      - condition: trigger
        id: app_faxina_on
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sistema_dia_de_faxina
        data: {}
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_confirmacao }}'
          mensagem: OK — Dia de faxina ativado. Não vou fechar a válvula ao passar
            de {{ limite_fechar_valvula }} L hoje.
          dados:
            tag: agua_dia_confirmacao
            channel: Água
            importance: default
            notification_icon: '{{ icon_ok }}'
            color: '{{ color_ok }}'
    - conditions:
      - condition: trigger
        id: app_faxina_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sistema_dia_de_faxina
        data: {}
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_confirmacao }}'
          mensagem: OK — Dia de faxina desativado. Voltei a fechar a válvula automaticamente
            em {{ limite_fechar_valvula }} L.
          dados:
            tag: agua_confirmacao
            channel: Água
            importance: high
            notification_icon: '{{ icon_ok }}'
            color: '{{ color_ok }}'
    - conditions:
      - condition: trigger
        id: app_fechar_valvula
      sequence:
      - action: valve.close_valve
        target:
          entity_id: valve.casa_valvula_agua_z2m
        data: {}
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula fechada manualmente pelo Aplicativo.
          dados:
            tag: agua_dia_acao
            channel: Água
            importance: high
            notification_icon: '{{ icon_acao }}'
            color: '{{ color_acao }}'
    - conditions:
      - condition: trigger
        id: app_abrir_valvula
      sequence:
      - action: valve.open_valve
        target:
          entity_id: valve.casa_valvula_agua_z2m
      - action: script.enviar_notificacao_app
        data:
          destinatarios: '{{ destinatarios_agua }}'
          titulo: '{{ titulo_acao }}'
          mensagem: Válvula aberta manualmente pelo Aplicativo.
          dados:
            tag: agua_dia_acao
            channel: Água
            importance: high
            notification_icon: '{{ icon_acao }}'
            color: '{{ color_acao }}'
    default:
    - condition: template
      value_template: '{{ states(''sensor.casa_agua_hoje'') not in [''unknown'',''unavailable'',''none'','''']
        }}

        '
    - variables:
        consumo_atual: '{{ states(''sensor.casa_agua_hoje'') | float(0) | round(0)
          | int }}'
        patamar_atual: '{{ ((consumo_atual // intervalo_notificacao) * intervalo_notificacao)
          | int }}'
        ultimo_patamar: '{{ states(''input_number.casa_agua_dia_ultimo_patamar_notificado'')
          | int(0) }}'
        eh_dia_faxina: '{{ is_state(''input_boolean.sistema_dia_de_faxina'', ''on'')
          }}'
    - condition: template
      value_template: '{{ patamar_atual >= patamar_inicial }}'
    - condition: template
      value_template: '{{ patamar_atual > ultimo_patamar }}'
    - repeat:
        for_each: "{% set start = ultimo_patamar + intervalo_notificacao %} {% set
          end = patamar_atual %} {% set ns = namespace(items=[]) %} {% for p in range(start,
          end + 1, intervalo_notificacao) %}\n  {% if p >= patamar_inicial %}\n    {%
          set ns.items = ns.items + [p] %}\n  {% endif %}\n{% endfor %} {{ ns.items
          }}\n"
        sequence:
        - variables:
            patamar: '{{ repeat.item }}'
        - action: script.enviar_notificacao_telegram
          data:
            destinatarios: '{{ destinatarios_agua }}'
            titulo: '{{ titulo_alerta }}'
            mensagem: 'Passou de {{ patamar }} L. Atual: {{ consumo_atual }} L. Dia
              de faxina: {{ ''ATIVO ✅'' if eh_dia_faxina else ''desativado ❌'' }}'
            parse_mode: MarkdownV2
            inline_keyboard: '{{ teclado_telegram }}'
        - action: script.enviar_notificacao_app
          data:
            destinatarios: '{{ destinatarios_agua }}'
            titulo: '{{ titulo_alerta }}'
            mensagem: 'Passou de {{ patamar }} L. Atual: {{ consumo_atual }} L. Dia
              de faxina: {{ ''ATIVO'' if eh_dia_faxina else ''desativado'' }}.'
            dados:
              tag: agua_dia
              channel: Água
              importance: high
              notification_icon: '{{ icon_alerta }}'
              color: '{{ color_alerta }}'
              actions: '{{ botoes_app }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ patamar == limite_fechar_valvula }}'
            - condition: template
              value_template: '{{ not eh_dia_faxina }}'
            sequence:
            - action: valve.close_valve
              target:
                entity_id: valve.casa_valvula_agua_z2m
            - action: script.enviar_notificacao_telegram
              data:
                destinatarios: '{{ destinatarios_agua }}'
                titulo: '{{ titulo_acao }}'
                mensagem: ⚠️ Válvula fechada automaticamente\. Consumo passou de {{
                  limite_fechar_valvula }} L e não é dia de faxina\.
                parse_mode: MarkdownV2
            - action: script.enviar_notificacao_app
              data:
                destinatarios: '{{ destinatarios_agua }}'
                titulo: '{{ titulo_acao }}'
                mensagem: Válvula fechada automaticamente. Consumo passou de {{ limite_fechar_valvula
                  }} L e não é dia de faxina.
                dados:
                  tag: agua_dia_acao
                  channel: Água
                  importance: high
                  notification_icon: '{{ icon_acao }}'
                  color: '{{ color_acao }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.casa_agua_dia_ultimo_patamar_notificado
      data:
        value: '{{ patamar_atual }}'
  variables:
    destinatarios_agua:
    - antonio
    - renata
    titulo_alerta: "\U0001F4A7 Água — Alerta"
    titulo_acao: "\U0001F4A7 Água — Ação"
    titulo_confirmacao: "\U0001F4A7 Água — OK"
    icon_alerta: mdi:water-alert
    icon_acao: mdi:valve-closed
    icon_ok: mdi:check-circle
    color_alerta: '#1E88E5'
    color_acao: '#D32F2F'
    color_ok: '#4CAF50'
    patamar_inicial: 300
    intervalo_notificacao: 100
    limite_fechar_valvula: 500
    teclado_telegram: "{% set linha = [] %}\n{# Botão de faxina #} {% if is_state('input_boolean.sistema_dia_de_faxina',
      'on') %}\n  {% set linha = linha + ['❌ Desativar faxina:/faxina_off'] %}\n{%
      else %}\n  {% set linha = linha + ['\U0001F9F9 Ativar faxina:/faxina_on'] %}\n{%
      endif %}\n{# Botão da válvula #} {% if is_state('valve.casa_valvula_agua_z2m',
      'open') %}\n  {% set linha = linha + ['\U0001F512 Fechar válvula:/fechar_valvula']
      %}\n{% else %}\n  {% set linha = linha + ['\U0001F6B0 Abrir válvula:/abrir_valvula']
      %}\n{% endif %}\n{{ linha | join(', ') }}\n"
    botoes_app: "{% set actions = [] %} {% if is_state('input_boolean.sistema_dia_de_faxina',
      'on') %}\n  {% set actions = actions + [{'action': 'AGUA_FAXINA_OFF', 'title':
      '❌ Desativar faxina'}] %}\n{% else %}\n  {% set actions = actions + [{'action':
      'AGUA_FAXINA_ON', 'title': '✅ Ativar faxina'}] %}\n{% endif %} {% if is_state('valve.casa_valvula_agua_z2m',
      'open') %}\n  {% set actions = actions + [{'action': 'AGUA_FECHAR_VALVULA',
      'title': '\U0001F6AB Fechar válvula'}] %}\n{% else %}\n  {% set actions = actions
      + [{'action': 'AGUA_ABRIR_VALVULA', 'title': '✅ Abrir válvula'}] %}\n{% endif
      %} {{ actions }}  \n"
  mode: single
