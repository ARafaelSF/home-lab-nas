# =============================================================================
# PROPOSTA — validar antes de substituir alexa_skill.yaml no servidor
# Base: ficheiro atual em /config/packages/alexa_skill/alexa_skill.yaml
# =============================================================================
# Alterações nesta proposta:
#   - Sensores de porta/janela, temperatura e umidade por cômodo (Alexa Plus)
#   - Portas com Zigbee + Hikvision: usa Hikvision (contato) como padrão
#   - Comentário em cada entidade com friendly name do HA
#   - entity_config para os novos sensores (name, description, display_categories)
# =============================================================================
# Documentação: https://www.home-assistant.io/integrations/alexa/
#
# Como usar este ficheiro:
#   1. include_entities — lista o entity_id atual no Home Assistant (após Z2M).
#   2. entity_config     — define como cada dispositivo aparece na Alexa (name).
#   3. Depois de editar: Configuração → Verificar → Reiniciar HA (ou reload Alexa).
#   4. Na Alexa: "Alexa, descobre dispositivos" (ou desligar/ligar skill).
# =============================================================================

smart_home:
  endpoint: https://api.amazonalexa.com/v3/events
  client_id: !secret alexa_client_id
  client_secret: !secret alexa_client_secret

  filter:
    include_entities:

      # -----------------------------------------------------------------------
      # Natal (descomente quando existir entidade e nome na Alexa)
      # -----------------------------------------------------------------------
      # - light.natal_...

      # -----------------------------------------------------------------------
      # Escritório
      # -----------------------------------------------------------------------
      - light.escritorio_interruptor_escritorio_z2m_l1_cortineiro          # Cortineiro
      - light.escritorio_interruptor_escritorio_z2m_l3_spot_computador      # Spot Computador
      - light.escritorio_interruptor_escritorio_z2m_l4_spot_mezanino      # Spot Mezanino
      - light.escritorio_estante_avioes_sonoff                            # Estante Aviões
      - cover.escritorio_cortina_z2m                                      # Escritório - Cortina
      - climate.escritorio_ar_condicionado_localthings                    # Ar condicionado
      - switch.escritorio_desktop_sonoff                                  # Desktop
      - switch.escritorio_repelente_z2m                                   # Escritório - Repelente
      - switch.escritorio_monitores_tasmota                               # Monitores
      - binary_sensor.escritorio_porta_varanda_contato_hikvision_axpro      # Escritório - Porta Varanda
      - sensor.escritorio_termo_temperatura                               # Temperatura
      - sensor.escritorio_termo_umidade                                   # Umidade

      # -----------------------------------------------------------------------
      # Corredor
      # -----------------------------------------------------------------------
      - light.corredor_interruptor_escada_z2m_l1_balizador                  # Balizador
      - light.corredor_interruptor_escada_z2m_l2_trilho_corredor          # Trilho Corredor
      - light.corredor_interruptor_escada_z2m_l3_jardim_japones           # Jardim Japonês
      - switch.jardim_japones_fonte                                       # Jardim Japonês Fonte
      - switch.jardim_japones_gerador_de_nevoa                            # Jardim Japonês Gerador de Névoa
      - light.jardim_japones_lanterna_japonesa                            # Jardim Japonês Lanterna Japonesa

      # -----------------------------------------------------------------------
      # Sala de Jantar (+ pé-direito da escada, físico nesta área)
      # -----------------------------------------------------------------------
      - light.sala_de_jantar_interruptor_sala_de_jantar_z2m_l1_lustre       # Lustre
      - light.sala_de_jantar_interruptor_sala_de_jantar_z2m_l4_arandela   # Arandela
      - light.sala_de_jantar_interruptor_escada_z2m_l4_pe_direito         # Pé Direito
      - switch.sala_de_jantar_repelente_sonoff                            # Repelente Sala de Jantar
      - fan.ventilador_sala_de_jantar_ventilador                          # Ventilador Sala de Jantar Ventilador
      - sensor.sala_de_jantar_termo_temperatura                           # Temperatura
      - sensor.sala_de_jantar_termo_umidade                               # Umidade

      # -----------------------------------------------------------------------
      # Sala de TV (alpendre: interruptor na entidade garagem_* — mesmo circuito)
      # -----------------------------------------------------------------------
      - light.sala_de_tv_interruptor_sala_de_tv_z2m_l2_spot_sofa          # Spot Sofá
      - light.sala_de_tv_interruptor_sala_de_tv_z2m_l4_spot_sala          # Spot Sala
      - light.sala_de_tv_cristaleira_z2m                                  # Sala de TV - Cristaleira
      - light.sala_de_tv_painel_z2m                                       # Sala de TV - Painel
      - cover.sala_de_tv_cortina_z2m                                      # Sala de TV - Cortina
      - climate.sala_de_tv_ar_condicionado_localthings                    # Ar condicionado
      - switch.sala_de_tv_bone_sonoff                                     # Boné
      - switch.sala_de_tv_repelente_sonoff                                # Repelente Sala de TV
      - media_player.sala_de_tv_tv                                        # TV
      - sensor.sala_de_tv_termo_temperatura                               # Temperatura
      - sensor.sala_de_tv_termo_umidade                                   # Umidade
      - binary_sensor.sala_de_tv_porta_contato_hikvision_axpro            # Sala de TV - Porta
      - binary_sensor.sala_de_tv_janela_direita_z2m_contact               # Sala de TV - Janela Direita Porta
      - binary_sensor.sala_de_tv_janela_esquerda_z2m_contact              # Sala de TV - Janela Esquerda Porta

      # -----------------------------------------------------------------------
      # Banheiro da Suíte
      # -----------------------------------------------------------------------
      - light.banheiro_suite_interruptor_banheiro_suite_z2m_l2_box_suite    # Box Suíte
      - light.banheiro_suite_interruptor_banheiro_suite_z2m_l3_espelho_suite  # Espelho Suíte
      - light.banheiro_suite_interruptor_banheiro_suite_z2m_l4_pia_suite  # Pia Suíte
      - light.banheiro_suite_led_banheiro_suite                           # Banheiro Suíte - LED

      # -----------------------------------------------------------------------
      # Lavanderia
      # -----------------------------------------------------------------------
      - light.lavanderia_interruptor_lavanderia_z2m_l2_lavanderia        # Lavanderia

      # -----------------------------------------------------------------------
      # Suíte
      # -----------------------------------------------------------------------
      - light.suite_cabeceira_antonio_localtuya                           # Cabeceira Antônio
      - light.suite_cabeceira_renata_localtuya                            # Cabeceira Renata
      - light.suite_luz_indireta_z2m                                      # Suíte - Luz Indireta
      - light.suite_spot_sonoff                                           # Spot Suíte
      - light.suite_painel_z2m                                            # Suíte - Painel
      - cover.suite_persiana_z2m                                          # Suíte - Persiana
      - cover.suite_toldo_z2m                                             # Suíte - Toldo
      - climate.suite_ar_condicionado_localthings                         # Ar condicionado
      - switch.suite_repelente_sonoff                                     # Repelente Suíte
      - switch.suite_tomada_camera_z2m                                    # Suíte - Tomada Câmera
      - media_player.suite_tv_roku                                        # TV Roku
      - binary_sensor.suite_janela_z2m_contact                            # Suíte - Janela Porta
      - sensor.suite_termo_temperatura                                    # Temperatura
      - sensor.suite_termo_umidade                                        # Umidade

      # -----------------------------------------------------------------------
      # Banheiro social
      # -----------------------------------------------------------------------
      - light.banheiro_social_espelho_sonoff                              # Espelho Banheiro Social
      - light.banheiro_social_luz_sonoff                                  # Luz Banheiro Social

      # -----------------------------------------------------------------------
      # Cozinha
      # -----------------------------------------------------------------------
      - light.cozinha_bancada_sonoff                                      # Bancada Cozinha
      - light.cozinha_luz_sonoff                                          # Luz Cozinha
      - sensor.cozinha_geladeira_termo_temperatura                        # Temperatura
      - sensor.cozinha_geladeira_termo_umidade                            # Umidade
      - sensor.cozinha_termo_higrometro_geladeira_z2m_temperature         # Temperatura
      - sensor.cozinha_termo_higrometro_geladeira_z2m_humidity           # Umidade
      - binary_sensor.cozinha_porta_terreiro_contato_hikvision_axpro     # Cozinha - Porta Terreiro
      - binary_sensor.cozinha_porta_alto_contato_hikvision_axpro         # Cozinha - Porta Alto
      - binary_sensor.cozinha_porta_baixo_contato_hikvision_axpro        # Cozinha - Porta Baixo

      # -----------------------------------------------------------------------
      # Brinquedoteca
      # -----------------------------------------------------------------------
      - light.brinquedoteca_luz_sonoff                                    # Luz Brinquedoteca
      - switch.brinquedoteca_repelente_sonoff                             # Repelente Brinquedoteca
      - light.brinquedoteca_nebulosa_estrelas_localtuya                   # Estrelas
      - light.brinquedoteca_nebulosa_localtuya                            # Nebulosa
      - binary_sensor.brinquedoteca_janela_z2m_contact                    # Brinquedoteca - Janela Porta
      - sensor.brinquedoteca_termo_higrometro_z2m_temperature             # Temperatura
      - sensor.brinquedoteca_termo_higrometro_z2m_humidity                # Umidade

      # -----------------------------------------------------------------------
      # Quarto da Cecília
      # -----------------------------------------------------------------------
      - light.quarto_cecilia_luz_sonoff                                   # Luz Cecília
      - light.quarto_cecilia_abajur_z2m                                   # Quarto Cecília - Abajur
      - switch.quarto_cecilia_repelente_z2m                               # Quarto Cecília - Repelente
      - cover.quarto_cecilia_persiana_z2m                                 # Quarto Cecília - Persiana
      - humidifier.quarto_cecilia_umidificador_localtuya                  # Umidificador
      - climate.quarto_cecilia_ar_condicionado_smartir                    # Ar condicionado
      - binary_sensor.quarto_cecilia_janela_z2m_contact                   # Quarto da Cecília - Janela Porta
      - sensor.quarto_cecilia_termo_higrometro_z2m_temperature           # Temperatura
      - sensor.quarto_cecilia_termo_higrometro_z2m_humidity              # Umidade

      # -----------------------------------------------------------------------
      # Cozinha externa
      # -----------------------------------------------------------------------
      - light.cozinha_externa_pendentes_z2m                               # Cozinha Externa - Pendentes
      - light.cozinha_externa_interruptor_cozinha_externa_z2m_l2_cozinha_externa  # Cozinha Externa
      - light.cozinha_externa_led_z2m                                     # Cozinha Externa - LED
      - sensor.cozinha_externa_termo_higrometro_z2m_temperature           # Temperatura
      - sensor.cozinha_externa_termo_higrometro_z2m_humidity            # Umidade

      # -----------------------------------------------------------------------
      # Terreiro / exterior (interruptores Z2M com área terreiro_*)
      # -----------------------------------------------------------------------
      - light.terreiro_interruptor_cozinha_externa_z2m_l4_refletor        # Refletor
      - light.terreiro_interruptor_lavanderia_z2m_l1_jardim_terreiro    # Jardim Terreiro
      - light.terreiro_interruptor_lavanderia_z2m_l3_arandela_terreiro  # Arandela Terreiro

      # -----------------------------------------------------------------------
      # Oficina
      # -----------------------------------------------------------------------
      - light.oficina_luz_sonoff                                          # Luz Oficina
      - light.bancada_oficina_bancada_oficina                             # Bancada Oficina Bancada Oficina
      - fan.ventilador_oficina_ventilador                                 # Ventilador Oficina Ventilador
      - switch.oficina_regua_z2m                                          # Oficina - Régua
      - binary_sensor.oficina_porta_z2m_contact                         # Porta
      - binary_sensor.oficina_janela_z2m_contact                          # Oficina - Janela Porta
      - sensor.oficina_termo_temperatura                                  # Temperatura
      - sensor.oficina_termo_umidade                                      # Umidade

      # -----------------------------------------------------------------------
      # Garagem
      # -----------------------------------------------------------------------
      - light.garagem_interruptor_cozinha_z2m_l2_garagen                  # Garagem
      - light.garagem_interruptor_cozinha_z2m_l3_jardim_garagem             # Jardim Garagem
      - light.garagem_interruptor_escritorio_z2m_l2_varanda                 # Varanda
      - light.garagem_interruptor_sala_de_tv_z2m_l1_alpendre                # Alpendre
      - binary_sensor.garagem_portao_rua_z2m_contact                      # Garagem - Portão Rua

      # -----------------------------------------------------------------------
      # Casa
      # -----------------------------------------------------------------------
      - valve.casa_valvula_gas_z2m                                        # Casa - Válvula Gás
      - valve.casa_valvula_agua_z2m                                       # Casa - Válvula Água
      - switch.caixa_d_agua_agua_pressurizada                             # Caixa d'agua Água Pressurizada

      # -----------------------------------------------------------------------
      # Scripts (rotinas por voz — aparecem como cenas/rotinas na Alexa)
      # -----------------------------------------------------------------------
      - script.contar_garrafa_de_agua_com_gas_e_anunciar                 # 🍾 Contar Garrafa de Gás e Anunciar
      - script.armar_alarme                                               # 🚨 Armar Alarme
      - script.saida_casa_verificar_e_armar_alarme                        # 🏠 Saída - Apagar luzes e armar alarme
      - script.pirata_cecilia                                             # 🏴‍☠️ Consultar Pirata Cecília
      - script.teste_last_alexa                                           # 🧪 Teste Last Alexa

