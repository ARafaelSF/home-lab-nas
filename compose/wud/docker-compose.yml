version: '3'
services:
  wud:
    image: getwud/wud:${WUD_TAG:-8.2.2}
    container_name: wud
    labels:
      - wud.display.name=WUD
      - wud.display.icon=si:getwud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
      - /etc/docker/wud-registries.env
    environment:
      - TZ=America/Sao_Paulo
      - WUD_TRIGGER_MQTT_HA_URL=mqtt://192.168.3.10:1883
      - WUD_TRIGGER_MQTT_HA_USER=homeassistant
      - WUD_TRIGGER_MQTT_HA_PASSWORD=${WUD_MQTT_PASSWORD}
      - WUD_TRIGGER_MQTT_HA_HASS_ENABLED=true
      - WUD_TRIGGER_MQTT_HA_HASS_DISCOVERY=true
      # Cron interno desactivado — fila horária via scripts/wud-stagger-watch.sh + /etc/cron.d/wud-stagger
      - WUD_WATCHER_LOCAL_CRON=0 0 1 1 *
      # Eventos Docker: regista containers novos no HA sem esperar restart do WUD
      - WUD_WATCHER_LOCAL_WATCHEVENTS=true
      # Evita scan em massa (e 429) sempre que o WUD reinicia
      - WUD_WATCHER_LOCAL_WATCHATSTART=false
      # GHCR: copie homelab/etc/docker/wud-registries.env.example → /etc/docker/wud-registries.env
    restart: unless-stopped
