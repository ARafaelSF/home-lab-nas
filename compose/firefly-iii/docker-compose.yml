version: '3.8'
services:
  app:
    image: fireflyiii/core:${FIREFLY_TAG:-latest}
    container_name: firefly-iii
    hostname: app
    labels:
      - wud.display.name=Firefly III
      - wud.display.icon=si:fireflyiii
      - wud.watch.digest=true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3004:8080'
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    depends_on:
      db:
        condition: service_started
    networks:
      - firefly_iii

  db:
    image: mariadb:lts
    container_name: firefly_iii_db
    hostname: db
    labels:
      - wud.watch=false
    restart: unless-stopped
    env_file:
      - .db.env
    volumes:
      - firefly_iii_db:/var/lib/mysql
    networks:
      - firefly_iii

  cron:
    image: alpine:3.21
    container_name: firefly_iii_cron
    labels:
      - wud.watch=false
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
        apk add --no-cache tzdata wget >/dev/null
        ln -sf /usr/share/zoneinfo/$$TZ /etc/localtime || true
        echo "0 3 * * * wget -qO- http://app:8080/api/v1/cron/$$STATIC_CRON_TOKEN; echo" | crontab -
        crond -f -L /dev/stdout
    depends_on:
      - app
    networks:
      - firefly_iii

volumes:
  firefly_iii_upload:
  firefly_iii_db:

networks:
  firefly_iii:
    driver: bridge
