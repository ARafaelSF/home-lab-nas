version: '3.8'

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    container_name: prometheus
    labels:
      - wud.display.name=Prometheus
      - wud.display.icon=si:prometheus
      - wud.watch.digest=true
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-365d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-40GB}
      - --web.enable-lifecycle
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  influxdb:
    image: influxdb:${INFLUXDB_TAG:-2.7}
    container_name: influxdb
    labels:
      - wud.display.name=Influx
      - wud.display.icon=si:influxdb
      - wud.tag.include=^2\.7$$
      - wud.watch.digest=true
    restart: unless-stopped
    ports:
      - '8086:8086'
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-homelab}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_DEFAULT_BUCKET:-monitoring}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - DOCKER_INFLUXDB_INIT_RETENTION=0s
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ['CMD', 'influx', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    container_name: grafana
    labels:
      - wud.display.name=Grafana
      - wud.display.icon=si:grafana
      - wud.watch.digest=true
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - '3005:3000'
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://192.168.3.21:3005
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/homelab/node-exporter-full.json
      - GF_PROVISIONING_ALLOW_ENV_VAR_EXPANSION=true
      - INFLUXDB_GRAFANA_READ_TOKEN=${INFLUXDB_GRAFANA_READ_TOKEN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-latest}
    container_name: node-exporter
    labels:
      - wud.display.name=Node Exporter
      - wud.display.icon=si:prometheus
      - wud.watch.digest=true
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_TAG:-latest}
    container_name: cadvisor
    labels:
      - wud.display.name=cAdvisor
      - wud.display.icon=si:docker
      - wud.watch.digest=true
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  ping-exporter:
    image: czerwonk/ping_exporter:${PING_EXPORTER_TAG:-latest}
    container_name: ping-exporter
    labels:
      - wud.display.name=Ping Exporter
      - wud.display.icon=si:prometheus
      - wud.watch.digest=true
    restart: unless-stopped
    cap_add:
      - NET_RAW
    volumes:
      - ./ping/ping.yml:/config/config.yml:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_TAG:-latest}
    container_name: blackbox-exporter
    labels:
      - wud.display.name=Blackbox Exporter
      - wud.display.icon=si:prometheus
      - wud.watch.digest=true
    restart: unless-stopped
    cap_add:
      - NET_RAW
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  speedtest-exporter:
    image: ghcr.io/tzockt/speedtest-exporter:${SPEEDTEST_EXPORTER_TAG:-latest}
    container_name: speedtest-exporter
    labels:
      - wud.display.name=Speedtest Exporter
      - wud.display.icon=si:speedtest
      - wud.watch.digest=true
    restart: unless-stopped
    environment:
      - SPEEDTEST_CACHE_DURATION=${SPEEDTEST_INTERVAL:-21600}
      - SPEEDTEST_TIMEOUT=90

volumes:
  prometheus_data:
  grafana_data:
  influxdb_data:
