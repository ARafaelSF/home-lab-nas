modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 204]

  dns_adguard:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: jellyfin.antonio.rafael.nom.br
      query_type: A

  dns_public:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: google.com
      query_type: A
