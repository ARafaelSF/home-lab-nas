server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 8m;

    # Prefixos da API (mesmo origin: VITE_API_URL=/).
    # Ao adicionar rotas no backend (ex.: /location-kinds), inclua o prefixo aqui
    # senão o nginx devolve o index.html do SPA e a UI fica vazia/sem criar.
    location ~ ^/(auth|users|items|locations|location-kinds|reports|assemblies|meta|settings|uploads)(/|$) {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # Chunks com hash: cache longo (imutáveis entre deploys).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html e SPA: nunca cachear, senão o browser/CDN aponta para JS antigo.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
