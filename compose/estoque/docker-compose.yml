# Estoque (instância própria, não é o servidor da Aeron).
# Código: /opt/controle-estoque  |  rebuild: ./rebuild.sh

services:
  db:
    image: postgres:16-alpine
    container_name: estoque-db
    labels:
      - wud.watch=false
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - estoque_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - estoque

  api:
    build:
      context: /opt/controle-estoque/backend
      dockerfile: /root/homelab/compose/estoque/Dockerfile.api
      additional_contexts:
        homelab: /root/homelab/compose/estoque
    image: homelab/estoque-api:local
    container_name: estoque-api
    labels:
      - wud.watch=false
      - wud.display.name=Estoque (API)
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: production
      PORT: "3333"
      TZ: ${TZ:-America/Sao_Paulo}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Oficina}
    volumes:
      - estoque_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/ | grep -q Backend || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - estoque

  web:
    build:
      context: /opt/controle-estoque/frontend
      dockerfile: /root/homelab/compose/estoque/Dockerfile.web
      additional_contexts:
        homelab: /root/homelab/compose/estoque
      args:
        VITE_API_URL: /
    image: homelab/estoque-web:local
    container_name: estoque-web
    labels:
      - wud.watch=false
      - wud.display.name=Estoque
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "3011:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - estoque

volumes:
  estoque_db:
  estoque_uploads:

networks:
  estoque:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.7.0/24
