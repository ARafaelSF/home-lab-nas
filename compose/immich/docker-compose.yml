version: "3.8"
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_TAG:-release}
    labels:
      - wud.display.name=Immich
      - wud.display.icon=si:immich
      - wud.watch.digest=true
    command: ['start.sh', 'immich']
    volumes:
      - immich_upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_TAG:-release}
    labels:
      - wud.display.name=Immich ML
      - wud.display.icon=si:immich
      - wud.watch.digest=true
    volumes:
      - immich_model-cache:/cache
    env_file:
      - .env
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine
    labels:
      - wud.display.name=Immich Redis
      - wud.display.icon=si:redis
      - wud.watch=false
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    labels:
      - wud.display.name=Immich Postgres
      - wud.display.icon=si:postgresql
      # Tag fixa do Immich — não seguir major (WUD sugeriria PG 18 e partia a BD)
      - wud.watch=false
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  immich_upload:
  immich_model-cache:
  immich_postgres:
