services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_TAG:-release}
    labels:
      - wud.display.name=Immich
      - wud.display.icon=si:immich
      - wud.watch.digest=true
    volumes:
      # Immich >=1.137 usa /data (antes: /usr/src/app/upload). Mesmo volume nomeado.
      - immich_upload:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    # VM tem ~8 GB RAM — evita Immich comer a máquina em pico
    mem_limit: 2g

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_TAG:-release}
    labels:
      - wud.display.name=Immich ML
      - wud.display.icon=si:immich
      - wud.watch.digest=true
    volumes:
      - immich_model-cache:/cache
    env_file:
      - .env
    restart: always
    # ML pode disparar em reconhecimento facial; teto evita OOM no host
    mem_limit: 2g

  redis:
    # Nome do serviço mantém-se "redis" (REDIS_HOSTNAME no .env).
    # Imagem alinhada ao compose oficial Immich v3.2.0 (Valkey).
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    labels:
      - wud.display.name=Immich Valkey
      - wud.display.icon=si:redis
      - wud.watch=false
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    labels:
      - wud.display.name=Immich Postgres
      - wud.display.icon=si:postgresql
      # Tag fixa do Immich — não seguir major (WUD sugeriria PG 18 e partia a BD)
      - wud.watch=false
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  immich_upload:
  immich_model-cache:
  immich_postgres:
